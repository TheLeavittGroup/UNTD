<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Daddy's Sales Deck</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:34000px;border:0;background:#000}</style></head><body><iframe id="base" src="../combined-v16/?build=aps-full-rate-panels-v19" scrolling="no" title="Daddy's Sales Deck"></iframe><script>const base=document.getElementById('base');const generationCopy='Those two round balls in between San Diego and Los Angeles.';const replacements=[['Big breasts you see when driving from San Diego to Newport.',generationCopy],['Those giant spinny fans you see on the drive and say, yep, that is electricity.',generationCopy],['Those giant spinny fans photobombing the drive from San Diego to Newport.',generationCopy],['Those giant power pinwheels you see on the drive from San Diego to Newport.',generationCopy]];function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)walkDocs(f.contentDocument,docs)}catch(e){}})}catch(e){}return docs}function cleanDoc(doc){try{const w=doc.createTreeWalker(doc.body||doc,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let t=n.nodeValue||'';replacements.forEach(([o,r])=>{if(t.includes(o))t=t.replaceAll(o,r)});n.nodeValue=t}}catch(e){}}function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}function panel(type){const w=type==='winter',title=w?'Winter Rates':'Summer Rates',season=w?'Winter Rates (November - April billing cycles)':'Summer Rates (May - October billing cycles)',off=w?'5.938':'5.943',on=w?'9.932':'14.227',demand=w?'13.747':'19.585';return `<section class="slide aps-rate-full ${w?'winter':'summer'}"><div class="aps-page"><h1>${title}</h1><div class="aps-card"><div class="chart-title">Time-of-Use 4pm-7pm Weekdays with Demand Charge</div><div class="season ${w?'snow':'sun'}">${season}</div><div class="legend"><span><i class="off"></i>Off-Peak</span>${w?'<span><i class="super"></i>Super Off-Peak</span>':''}<span><i class="peak"></i>On-Peak</span><span><i class="dem"></i>Demand</span></div><div class="axis-label">Electricity Costs (kWh)</div><div class="axis"><b>20¢</b><b>10¢</b><b>0</b></div><div class="yline"></div><div class="xline"></div><div class="bar green left"></div>${w?'<div class="bar blue mid"></div>':''}<div class="bar pink"></div><div class="bar green right"></div><div class="price offprice"><span>Off-Peak</span><strong>${off}¢</strong><em>Per<br>kWh</em><u></u></div>${w?'<div class="price superprice"><span>Super Off-Peak</span><strong>3.495¢</strong><em>Per<br>kWh</em><u></u></div>':''}<div class="price peakprice"><span>On-Peak</span><strong>${on}¢</strong><em>Per<br>kWh</em><u></u></div><div class="moon m0">☾</div><div class="sunicon">☀</div><div class="moon m24">☾</div><div class="time t0">12am</div><div class="time t12">12pm</div><div class="time t4">4</div><div class="time t7">7</div><div class="time t24">12am</div><div class="peak-window"></div><div class="demand"><span>Once Per Month<br>Demand Charge</span><strong>$${demand}</strong><em>Per kW</em><small>Your highest on-peak usage hour (e.g., 5-6pm) charged 1x per month</small></div></div></div></section>`}function addRates(d){if(!d||d.getElementById('apsRateSlides'))return false;const slides=[...d.querySelectorAll('.slide')];const before=slides.find(s=>/Arizona.?s\s+largest\s+installer|Arizona.*largest.*installer|largest\s+installer|largest\s+solar\s+installer/i.test(s.textContent||''))||slides.find(s=>/BBB|Our World Energy|credential|review/i.test(s.textContent||''))||slides[1];if(!before||!before.parentNode)return false;if(!d.getElementById('apsRateFullStyles')){const style=d.createElement('style');style.id='apsRateFullStyles';style.textContent=`.aps-rate-full{background:#fff!important;color:#202124!important;padding:0!important;overflow:visible!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important}.aps-page{padding:3.4% 6%;background:#fff}.aps-page h1{margin:0 0 1.3%!important;color:#202124!important;font:400 clamp(36px,4.4vw,62px)/1.05 Arial,Helvetica,sans-serif!important;letter-spacing:-.02em!important}.aps-card{position:relative;width:100%;aspect-ratio:16/9;background:#074662;color:#fff;overflow:hidden}.chart-title{position:absolute;left:3.6%;top:6%;right:20%;font-size:clamp(28px,3.1vw,54px);font-weight:850;line-height:1.04}.season{position:absolute;left:3.6%;top:19%;font-size:clamp(18px,2vw,33px);font-weight:850}.season:before{content:'☀';color:#ffc82f;margin-right:.45em}.snow:before{content:'❄';color:#2fbaff}.legend{position:absolute;right:8.5%;top:6%;display:grid;gap:.75em;font-size:clamp(13px,1.2vw,21px);font-weight:850}.legend span{display:flex;align-items:center;gap:.6em}.legend i{width:1em;height:1em;display:inline-block}.off{background:#1fad23}.peak{background:#c73370}.dem{background:#ffc82f}.super{background:#91cde0}.axis-label{position:absolute;left:3.8%;top:43%;transform:rotate(-90deg);transform-origin:left center;font-size:clamp(16px,1.35vw,24px);letter-spacing:.02em}.axis{position:absolute;left:8.4%;top:35%;height:31%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:clamp(13px,1.08vw,20px)}.yline{position:absolute;left:9.6%;top:35%;height:38%;width:3px;background:#fff}.xline{position:absolute;left:8.8%;right:3.8%;top:66.4%;height:3px;background:#fff}.bar{ clamp(16px,1.45vw,25px);font-weight:950;line-height:1.12;z-index:1}.demand strong{font-size:clamp(58px,5vw,92px);font-weight:300;z-index:1}.demand em{font-size:clamp(21px,1.9vw,33px);font-style:normal;z-index:1}.demand small{grid-column:1/-1;color:#074662;font-size:clamp(10px,.9vw,16px);font-style:italic;font-weight:850;z-index:1}.winter .left{width:35.6%}.winter .right{right:3.8%;width:33%}@media(max-width:700px){.aps-page{padding:6% 4%}.aps-page h1{font-size:34px!important}.aps-card{aspect-ratio:16/10}.chart-title{font-size:22px}.season{font-size:15px}.legend{font-size:10px;right:5%}.price strong{font-size:34px}.price span{font-size:12px}.demand strong{font-size:34px}.demand span{font-size:10px}.demand em{font-size:12px}}`;d.head.appendChild(style)}const wrap=d.createElement('div');wrap.id='apsRateSlides';wrap.innerHTML=panel('summer')+panel('winter');before.parentNode.insertBefore(wrap,before);return true}function patch(){try{const docs=walkDocs(base.contentDocument,[]);docs.forEach(cleanDoc);docs.forEach(addRates)}catch(e){}resize()}base.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500);setTimeout(patch,5000)});setInterval(patch,1400);window.addEventListener('resize',()=>setTimeout(resize,100));</script></body></html>
