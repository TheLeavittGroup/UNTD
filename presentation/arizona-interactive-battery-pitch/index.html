<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arizona Interactive Battery Pitch</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--text:#f7f7f5;--muted:#9aa0a8;--line:#2a2f36}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow:hidden}#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.top{padding:14px 2px 8px;display:flex;align-items:center;justify-content:space-between}.title{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.counter{font-size:13px;color:var(--muted)}.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.card{width:100%;max-width:680px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px 26px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.step{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}.goal{font-size:17px;color:var(--muted);margin-bottom:18px;line-height:1.35}.say{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em}.say .em{opacity:.72}.cue{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:16px;line-height:1.4;color:#d8dadd}.cue b{color:#fff}.branch{margin-top:18px;padding:16px 17px;border-radius:16px;background:#111419;border:1px solid var(--line);font-size:15px;line-height:1.4}.branch strong{display:block;margin-bottom:7px;color:#fff}.navhint{padding:10px 4px 14px;display:flex;justify-content:space-between;color:#747b84;font-size:12px}.tapzone{position:fixed;top:0;bottom:0;width:50%;z-index:20}#prevZone{left:0}#nextZone{right:0}.dots{display:flex;gap:5px;justify-content:center;padding-bottom:4px;position:relative;z-index:30;pointer-events:none}.dot{width:5px;height:5px;border-radius:50%;background:#343a42}.dot.active{background:#fff}@media(max-width:430px){.card{padding:24px 20px 22px;border-radius:22px}.say{font-size:24px}.goal{font-size:16px}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="title">Arizona Interactive Battery Pitch</div><div class="counter" id="counter"></div></div>
<div class="stage"><div class="card"><div class="step" id="step"></div><div class="goal" id="goal"></div><div class="say" id="say"></div><div class="cue" id="cue"></div><div class="branch" id="branch" style="display:none"></div></div></div>
<div class="dots" id="dots"></div><div class="navhint"><span>← tap left to go back</span><span>tap right to continue →</span></div>
</div>
<div id="prevZone" class="tapzone"></div><div id="nextZone" class="tapzone"></div>
<script>
const slides=[
{step:"1 · Open",goal:"Local, simple, straight to APS pain.",say:`“Hey, I’m Aidan with Our World Energy. I have some work going in down the road, and I’ve noticed the neighbors aren’t super stoked about what they’re paying APS right now. <span class="em">Are you guys noticing higher payments to them too?</span>”`,cue:`If they say <b>yes</b>, move immediately.`},
{step:"2 · Why you're there",goal:"Make this about qualifying the home.",say:`“Yeah, that’s exactly why I’m here — <span class="em">to see which homes are eligible for our company to provide battery storage.</span>”`,cue:`Keep it short. Let <b>eligible</b> create curiosity.`},
{step:"3 · Simple concept",goal:"One sentence. No technical explanation.",say:`“Basically, the idea is to store cheaper off-peak power and use that stored power when APS gets expensive.”`,cue:`If they understand, keep moving. Don’t pile on details.`},
{step:"4 · Battery explanation",goal:"Make the offer feel simple and usage-based.",say:`“Pretty simple. If you guys use a ton of power and the home is eligible, <span class="em">our company covers the cost of however many batteries the home needs.</span>”`,cue:`Do not get into battery specs unless they ask.`},
{step:"5 · Reimbursement angle",goal:"Make your role sound simple and tied to utility eligibility.",say:`“Yeah, my job is super simple. I basically go off a pre-selected list of homes that <span class="em">may qualify for APS reimbursement or storage incentives</span>, and I just verify whether the usage at the house is high enough for it to make sense.”`,cue:`Use <b>may qualify</b> so you are not promising an APS reimbursement before the home is actually verified.`},
{step:"6 · What they pay",goal:"Explain the payment in one clean line.",say:`“You’d basically just pay us for <span class="em">maintaining them, repairing them, and replacing them if they ever need it.</span>”`,cue:`Only use this wording if it accurately matches the actual customer agreement.`},
{step:"7 · Immediate bill pull",goal:"As soon as they say okay, transition. No more explaining.",say:`“So do me a favor — <span class="em">do you get the APS bill paper or paperless?</span>”`,cue:`Do not ask permission to see the bill. Give them the two choices.`},
{step:"8 · Get the bill",goal:"Create movement and get inside the numbers.",say:`“Cool, go grab that for me real quick, and that way I can show you what I’m talking about.”`,cue:`Then <b>stop talking.</b>`},
{step:"9 · If they ask about solar",goal:"Keep solar optional and return to the battery conversation.",say:`“You don’t necessarily need solar. I usually recommend looking at a few panels mainly for backup, so during a longer APS outage the system has a way to produce power and recharge the batteries.”`,cue:`Then go right back to: <b>“First I just need to see if the battery side makes sense for the house.”</b>`,branch:`<strong>Rule</strong>Do not bring solar up unless they ask.`}
];
let i=0;const els={step:document.getElementById('step'),goal:document.getElementById('goal'),say:document.getElementById('say'),cue:document.getElementById('cue'),branch:document.getElementById('branch'),counter:document.getElementById('counter'),dots:document.getElementById('dots')};function render(){const s=slides[i];els.step.innerHTML=s.step;els.goal.innerHTML=s.goal;els.say.innerHTML=s.say;els.cue.innerHTML=s.cue;if(s.branch){els.branch.innerHTML=s.branch;els.branch.style.display='block'}else els.branch.style.display='none';els.counter.textContent=`${i+1} / ${slides.length}`;els.dots.innerHTML=slides.map((_,idx)=>`<span class="dot ${idx===i?'active':''}"></span>`).join('')}function next(){if(i<slides.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}document.getElementById('nextZone').addEventListener('click',next);document.getElementById('prevZone').addEventListener('click',prev);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev()});let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>45){dx<0?next():prev()}x0=null},{passive:true});render();
</script>
</body>
</html>
