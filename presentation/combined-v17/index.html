<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Daddy's Sales Deck</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:30000px;border:0;background:#000}</style></head><body><iframe id="base" src="../combined-v16/?build=aps-rates-slide-v17" scrolling="no" title="Daddy's Sales Deck"></iframe><script>const base=document.getElementById('base');function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)walkDocs(f.contentDocument,docs)}catch(e){}})}catch(e){}return docs}function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}function ratePanel(title,season,off,on,demand,extra){return `<article class="aps-rate-panel"><h2>${title}</h2><div class="aps-rate-graphic"><div class="aps-rate-top"><h3>Time-of-Use 4pm-7pm Weekdays with Demand Charge</h3><p>${season}</p></div><div class="aps-legend"><span><b class="green"></b>Off-Peak</span>${extra?'<span><b class="blue"></b>Super Off-Peak</span>':''}<span><b class="pink"></b>On-Peak</span><span><b class="yellow"></b>Demand</span></div><div class="aps-axis"><span>20¢</span><span>10¢</span><span>0</span></div><div class="aps-timeline"><div class="bar greenbar left"></div>${extra?'<div class="bar bluebar"></div>':''}<div class="bar pinkbar"></div><div class="bar greenbar right"></div><div class="callout off"><b>Off-Peak</b><strong>${off}¢</strong><small>Per kWh</small></div>${extra?'<div class="callout super"><b>Super Off-Peak</b><strong>3.495¢</strong><small>Per kWh</small></div>':''}<div class="callout peak"><b>On-Peak</b><strong>${on}¢</strong><small>Per kWh</small></div><div class="moon m1">☾</div><div class="sun">☀</div><div class="moon m2">☾</div><div class="time t0">12am</div><div class="time t12">12pm</div><div class="time t4">4</div><div class="time t7">7</div><div class="time t24">12am</div></div><div class="demand"><span>Once Per Month<br>Demand Charge</span><strong>$${demand}</strong><em>Per kW</em><small>Your highest on-peak usage hour charged 1x per month</small></div></div></article>`}function addRates(d){try{if(!d||d.getElementById('apsCurrentRatePlanSlide'))return false;const slides=[...d.querySelectorAll('.slide')];if(!slides.length)return false;const target=slides.find(s=>/Arizona.*largest|largest.*installer|largest.*install/i.test(s.textContent||''))||slides.find(s=>/installer/i.test(s.textContent||''));if(!target)return false;if(!d.getElementById('apsRatePlanSlideStyles')){const st=d.createElement('style');st.id='apsRatePlanSlideStyles';st.textContent=`.aps-current-rate-plan{background:#f7f7f7!important;color:#202124!important;padding:2.5% 4%!important;overflow:hidden!important}.aps-current-rate-plan>h1{font:500 clamp(28px,3.2vw,54px)/1 Arial!important;margin:0 0 1.5%!important;color:#202124!important}.aps-rate-wrap{display:grid!important;grid-template-columns:1fr 1fr!important;gap:2%!important}.aps-rate-panel h2{font:500 clamp(22px,2.3vw,38px)/1 Arial!important;margin:0 0 1%!important;color:#202124!important}.aps-rate-graphic{position:relative;height:clamp(365px,42vw,560px)!important;background:#073f5b!important;color:white!important;padding:3% 4%!important;overflow:hidden!important}.aps-rate-top h3{font:800 clamp(16px,1.8vw,30px)/1.08 Arial!important;margin:0!important;color:white!important}.aps-rate-top p{font:800 clamp(12px,1.25vw,21px)/1 Arial!important;margin:1.4% 0 0!important;color:white!important}.aps-legend{position:absolute;right:5%;top:6%;display:grid;gap:6px;font:800 clamp(8px,.8vw,13px)/1 Arial!important}.aps-legend span{display:flex;gap:8px;align-items:center}.aps-legend b{width:12px;height:12px;display:inline-block}.green{background:#1dab22}.pink{background:#c43473}.yellow{background:#ffca2f}.blue{background:#96d3ec}.aps-axis{position:absolute;left:4%;top:31%;height:31%;display:flex;flex-direction:column;justify-content:space-between;font:800 12px Arial}.aps-timeline{position:absolute;left:10%;right:6%;top:39%;height:34%;border-bottom:2px solid white}.bar{position:absolute;bottom:0;height:28%;border-radius:0}.greenbar{background:#1daa24}.left{left:0;width:67%}.right{right:0;width:22%}.bluebar{left:42%;width:21%;height:20%;background:#91cee7}.pinkbar{left:68%;width:13%;height:58%;background:#c43473;border-radius:12px 12px 0 0}.callout{position:absolute;text-align:center;transform:translateX(-50%)}.callout b{display:block;font:900 clamp(9px,.92vw,16px) Arial}.callout strong{display:inline-block;font:300 clamp(28px,3vw,54px) Arial}.callout small{font:700 clamp(7px,.7vw,12px) Arial}.off{left:32%;top:-36%}.super{left:52%;top:-22%}.peak{left:74%;top:-48%}.moon,.sun{position:absolute;bottom:-30px;font-size:24px}.m1{left:0}.sun{left:50%;color:#ffcf33}.m2{right:0}.time{position:absolute;bottom:-50px;font:900 12px Arial}.t0{left:-1%}.t12{left:49%}.t4{left:68%}.t7{left:78%}.t24{right:-1%}.demand{position:absolute;left:48%;right:11%;bottom:6%;background:#ffca2f;color:#073f5b;border-radius:12px;padding:1.4% 2%;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px}.demand span{font:900 clamp(8px,.82vw,14px) Arial}.demand strong{font:300 clamp(30px,3.1vw,58px) Arial}.demand em{font:500 clamp(10px,1vw,18px) Arial;font-style:normal}.demand small{grid-column:1/-1;font:800 italic clamp(7px,.68vw,11px) Arial}.aps-rate-note{margin:1% 0 0!important;font:800 clamp(10px,.9vw,15px) Arial!important;color:#4d5a66!important}@media(max-width:650px){.aps-rate-wrap{grid-template-columns:1fr!important}.aps-rate-graphic{height:420px!important}.aps-current-rate-plan{padding:5%!important}}`;d.head.appendChild(st)}const slide=d.createElement('section');slide.className='slide aps-current-rate-plan';slide.id='apsCurrentRatePlanSlide';slide.innerHTML=`<h1>APS Current Pricing</h1><div class="aps-rate-wrap">${ratePanel('Summer Rates','Summer Rates (May - October billing cycles)','5.943','14.227','19.585',false)}${ratePanel('Winter Rates','Winter Rates (November - April billing cycles)','5.938','9.932','13.747',true)}</div><p class="aps-rate-note">Time-of-Use 4pm-7pm Weekdays with Demand Charge. This page is placed before the installer proof section so customers can see current pricing first.</p>`;target.parentNode.insertBefore(slide,target);return true}catch(e){return false}}function patch(){try{walkDocs(base.contentDocument,[]).forEach(addRates)}catch(e){}resize()}base.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1200);setTimeout(patch,3000);setTimeout(patch,5500)});setInterval(patch,1600);window.addEventListener('resize',()=>setTimeout(resize,100));</script></body></html>
