<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Daddy's Sales Deck</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;min-height:100%}
#base{display:block;width:100%;height:24000px;border:0;background:#000;visibility:hidden}
</style>
</head>
<body>
<iframe id="base" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const BUILD='20260715-iphone-precision-1';
const base=document.getElementById('base');
base.src='../combined-v12/?build='+BUILD+'&refresh='+Date.now();
let resizeTimer=0;
let patched=false;

function getDeck(){
 try{
  const docs=[];
  let doc=base.contentDocument;
  while(doc){
   docs.push(doc);
   const frame=doc.getElementById('base');
   if(!frame||!frame.contentDocument)break;
   doc=frame.contentDocument;
  }
  const outer=docs[docs.length-1];
  const deckFrame=outer&&outer.getElementById('deckFrame');
  const deck=deckFrame&&deckFrame.contentDocument;
  return{docs,deckFrame,deck};
 }catch(e){return{}}
}

function setHeight(frame,height){
 const next=Math.ceil(height||0);
 const current=parseInt(frame.style.height,10)||0;
 if(next>0&&Math.abs(next-current)>4)frame.style.height=next+'px';
}

function resizeAll(ctx){
 try{
  const{docs,deckFrame,deck}=ctx;
  if(deckFrame&&deck)setHeight(deckFrame,deck.documentElement.scrollHeight);
  if(docs){
   for(let i=docs.length-1;i>0;i--){
    const frame=docs[i-1].getElementById('base');
    if(frame)setHeight(frame,docs[i].documentElement.scrollHeight);
   }
  }
  if(base.contentDocument)setHeight(base,base.contentDocument.documentElement.scrollHeight);
 }catch(e){}
}

function applyPrecisionFix(){
 const ctx=getDeck();
 const d=ctx.deck;
 if(!d)return false;
 const cover=d.querySelector('.slide.cover');
 const grid=d.querySelector('.slide.grid-interactive')||[...d.querySelectorAll('.slide')].find(s=>/^\s*The Grid/i.test(s.textContent||''));
 const net=d.querySelector('.slide.net-simple')||[...d.querySelectorAll('.slide')].find(s=>/The Power of Net Metering/i.test(s.textContent||''));
 const savings=d.querySelector('.slide.savings-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
 const zillow=d.querySelector('.slide.zillow')||[...d.querySelectorAll('.slide')].find(s=>/property value/i.test(s.textContent||'')&&/Zillow/i.test(s.textContent||''));
 const options=d.querySelector('.slide.options-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/The Options/i.test(s.textContent||''));
 const aurora=d.querySelector('.slide.aurora-transition');
 if(!cover||!grid||!net||!savings||!zillow||!options||!aurora)return false;

 let style=d.getElementById('iphonePrecisionFixV14');
 if(!style){style=d.createElement('style');style.id='iphonePrecisionFixV14'}
 style.textContent=`
 @media(max-width:600px){
  html,body{overflow-x:hidden!important;background:#000!important}
  .slide{margin-bottom:7px!important}

  .cover .owe{left:7%!important;bottom:5.5%!important;padding:1.1% 2%!important;font-size:14px!important;line-height:1.05!important;z-index:5!important}
  .cover .owe small{font-size:10px!important;margin-top:3px!important}
  .cover-customer-name{position:absolute!important;left:4.6%!important;bottom:29%!important;width:53%!important;margin:0!important;z-index:10!important}
  .cover-customer-name input{font-size:10px!important;line-height:1.1!important;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important;color:#fff!important}

  .grid-flow-shell{grid-template-rows:24% minmax(0,1fr) 15%!important;padding:2.3% 3%!important;gap:1.1%!important}
  .grid-flow-head{padding-right:33%!important}
  .grid-flow-head h1{font-size:29px!important}
  .grid-flow-head p{font-size:6.8px!important;line-height:1.15!important;margin-top:.8%!important}
  .grid-address-tool{position:absolute!important;top:1%!important;right:2.5%!important;width:30.5%!important;padding:.75%!important;border-radius:7px!important;grid-template-columns:minmax(0,1fr) 33px!important;gap:2px!important;z-index:30!important}
  .grid-address-tool input{font-size:5.7px!important;padding:.45em!important;border-radius:4px!important}
  .grid-address-tool button{font-size:5.8px!important;padding:0 .2em!important;border-radius:4px!important}
  .grid-loss-result{padding:.32em .45em!important;border-radius:4px!important}
  .grid-loss-result span{font-size:4.8px!important}.grid-loss-result strong{font-size:9px!important}
  .grid-loss-note{display:none!important}

  .net-simple{padding:0!important;overflow:hidden!important}
  .net-simple-shell{position:absolute!important;inset:0!important;padding:3% 3.2%!important;display:grid!important;grid-template-rows:auto minmax(0,1fr) auto!important;gap:1.5%!important}
  .net-simple h1{font-size:28px!important;line-height:.95!important;margin:0!important}
  .simple-grid{min-height:0!important;margin:0!important;display:grid!important;grid-template-columns:1fr 13% 1fr!important;gap:1.5%!important;align-items:stretch!important}
  .simple-card{height:100%!important;min-height:0!important;border-radius:12px!important;padding:3.5% 3%!important;justify-content:center!important;overflow:hidden!important}
  .simple-icon{width:34px!important;height:34px!important;border-radius:10px!important;font-size:19px!important;margin-bottom:2%!important}
  .simple-card h2{font-size:11px!important;line-height:1.02!important;max-width:100%!important}
  .simple-label{margin-top:2.5%!important;font-size:5.5px!important}
  .simple-rate{margin-top:.5%!important;font-size:25px!important;line-height:.9!important}
  .simple-unit{font-size:6.5px!important;margin-top:1%!important}
  .simple-note{font-size:5.5px!important;line-height:1.12!important;margin-top:2%!important;max-width:100%!important}
  .battery-center{min-width:0!important;overflow:hidden!important}
  .battery-orb{width:42px!important;border-radius:12px!important;box-shadow:none!important}
  .battery-center strong{margin-top:8%!important;font-size:6px!important;line-height:1.1!important}
  .demand-line{margin:0!important;padding:1.2% 2%!important;border-radius:8px!important;font-size:8px!important;line-height:1.1!important;box-shadow:none!important}

  .savings-upgrade{aspect-ratio:auto!important;height:580px!important;min-height:580px!important;overflow:hidden!important}
  .savings-shell{position:absolute!important;inset:0!important;padding:3% 3%!important;display:grid!important;grid-template-rows:auto 17% minmax(0,1fr)!important;gap:1.2%!important}
  .savings-head h1{font-size:24px!important;line-height:1!important;margin:0!important}
  .savings-head p{font-size:9px!important;line-height:1.15!important;margin:1% 0 0!important}
  .savings-graph{border-radius:11px!important;min-height:0!important}
  .graph-label{right:3%!important;top:7%!important;font-size:7px!important}
  .graph-yellow{font-size:8px!important;border-radius:4px!important}
  .calc-zone{min-height:0!important;display:grid!important;grid-template-columns:1fr 1fr!important;grid-template-rows:minmax(0,1.65fr) minmax(0,.8fr)!important;gap:1.3%!important}
  .input-card{grid-column:1/-1!important;min-height:0!important;padding:2.5%!important;border-radius:12px!important;justify-content:flex-start!important}
  .monthly-card,.future-card{min-height:0!important;padding:3%!important;border-radius:12px!important}
  .mode-toggle{margin:0 0 5px!important;padding:3px!important;gap:3px!important}
  .mode-toggle button{font-size:8px!important;padding:5px 6px!important}
  .input-head{margin-bottom:1.3%!important;gap:5px!important}
  .input-title{font-size:9px!important}.annual-total{font-size:7px!important;padding:4px 6px!important}
  .month-grid{grid-template-columns:repeat(4,1fr)!important;gap:4px 5px!important}
  .month-grid label,.rate-inputs label{font-size:7px!important;line-height:1!important}
  .month-grid input,.rate-inputs input{font-size:10px!important;padding:5px 6px!important;border-radius:6px!important;margin-top:2px!important}
  .rate-inputs{gap:5px!important;margin-top:5px!important;padding-top:5px!important}
  .monthly-card small{font-size:7px!important}.monthly-card strong{font-size:36px!important;margin:4% 0 2%!important}.monthly-card span{font-size:7px!important;line-height:1.12!important}
  .future-title{font-size:9px!important;margin-bottom:2%!important}.future-grid{gap:4px!important}.future-box{padding:5px!important;border-radius:7px!important}.future-box span{font-size:7px!important}.future-box strong{font-size:15px!important}
  .rate-result{font-size:6.5px!important;margin-top:4px!important}#utility25Button{font-size:7px!important;padding:6px!important;margin-top:4px!important;border-radius:7px!important}

  .zillow{display:block!important;padding:4% 4% 4% 13%!important;text-align:left!important;overflow:hidden!important}
  .zillow .logo{left:3%!important;top:7%!important;width:7%!important;border-width:2px!important;font-size:8px!important}
  .zillow .title{margin:0!important;padding:0!important;max-width:76%!important;font-size:28px!important;line-height:.95!important;letter-spacing:-.035em!important}
  .zillow-box{position:absolute!important;left:14%!important;bottom:8%!important;width:48%!important;margin:0!important}
  .zillow-logo{font-size:42px!important;line-height:.9!important}
  .zillow-box p{font-size:10px!important;line-height:1.16!important;margin:5% 0 0!important}
  .zillow .sign{right:5%!important;bottom:10%!important;padding:2% 2.5%!important;font-size:10px!important;line-height:1.08!important;transform:rotate(5deg)!important}
  .zillow-proof{right:6%!important;bottom:42%!important;padding:.55em .75em!important;border-width:1px!important;font-size:7px!important;box-shadow:0 5px 12px rgba(29,94,199,.18)!important}

  .options-upgrade{padding:3% 3.5%!important;overflow:hidden!important}
  .options-upgrade .logo{left:3%!important;top:6%!important;width:7%!important;border-width:2px!important;font-size:8px!important}
  .options-upgrade .title{font-size:28px!important;line-height:.95!important;margin:0!important;padding-left:10%!important}
  .options-upgrade .options-grid{height:78%!important;margin-top:1.5%!important;gap:2%!important;align-items:stretch!important}
  .options-upgrade .option{width:45%!important;min-height:100%!important;padding:2% 2.2%!important;overflow:hidden!important;box-shadow:none!important}
  .options-upgrade .option h2{font-size:21px!important;line-height:.94!important;margin:0 0 3%!important}
  .options-upgrade .option-list{gap:1.6%!important}
  .options-upgrade .option-item{font-size:7.2px!important;line-height:1.08!important;gap:.35em!important}
  .options-upgrade .option-item b{font-size:1em!important}
  .options-upgrade .option-pain{margin-top:2%!important;padding:2%!important;font-size:6.7px!important;line-height:1.08!important}
  .options-upgrade .choice-mascot{display:none!important}

  .aurora-transition{aspect-ratio:auto!important;overflow:hidden!important}
  .aurora-transition .aurora-live-shell{grid-template-rows:9% minmax(0,1fr) 6% 7%!important}
  .aurora-live-top{padding:0 2.5%!important;gap:1%!important}
  .aurora-live-title strong{font-size:12px!important}.aurora-live-title span{font-size:7px!important;line-height:1.1!important}
  .aurora-live-open{font-size:9px!important;padding:.65em .9em!important}
  .aurora-live-help{left:2%!important;right:2%!important;bottom:2%!important;padding:8px 10px!important;border-radius:9px!important;font-size:8px!important;line-height:1.2!important}
  .aurora-recommendation-label{font-size:6px!important}.aurora-recommendation-value{font-size:8px!important}.aurora-recommendation-value small{font-size:5px!important}
  .customer-summary-label{font-size:5.5px!important}.customer-summary-value{font-size:6.5px!important}.copy-single-value,.copy-customer-summary{font-size:5px!important}
 }
 `;
 d.head.appendChild(style);

 if(window.innerWidth<=600){
  const name=cover.querySelector('.cover-customer-name');
  if(name){name.style.setProperty('bottom','29%','important');name.style.setProperty('z-index','10','important')}
  const address=grid.querySelector('.grid-address-tool');
  if(address){address.style.setProperty('position','absolute','important');address.style.setProperty('top','1%','important');address.style.setProperty('right','2.5%','important')}
  const phoneHeight=Math.max(680,Math.min(900,Math.round(window.innerHeight||760)));
  aurora.style.setProperty('height',phoneHeight+'px','important');
  aurora.style.setProperty('min-height',phoneHeight+'px','important');
  aurora.style.setProperty('aspect-ratio','auto','important');
  const savingsHeight=Math.max(560,Math.min(650,Math.round((window.innerHeight||760)*.78)));
  savings.style.setProperty('height',savingsHeight+'px','important');
  savings.style.setProperty('min-height',savingsHeight+'px','important');
  savings.style.setProperty('aspect-ratio','auto','important');
 }

 patched=true;
 resizeAll(ctx);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeAll(getDeck());base.style.visibility='visible'}));
 return true;
}

function waitForDeck(attempt=0){
 if(applyPrecisionFix()){
  setTimeout(()=>{applyPrecisionFix();resizeAll(getDeck())},900);
  return;
 }
 if(attempt<90)setTimeout(()=>waitForDeck(attempt+1),100);
 else base.style.visibility='visible';
}

base.addEventListener('load',()=>waitForDeck(),{once:true});
setTimeout(()=>waitForDeck(),120);
window.addEventListener('resize',()=>{
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{if(patched){applyPrecisionFix();resizeAll(getDeck())}},220);
},{passive:true});
setTimeout(()=>{base.style.visibility='visible'},10000);
</script>
</body>
</html>
