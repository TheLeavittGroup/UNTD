<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Daddy's Sales Deck</title><meta name="theme-color" content="#000"><style>*{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}body{margin:0;background:#000;font-family:Arial,Helvetica,sans-serif}.frame{display:block;width:100%;border:0}.deck-frame{height:915vw;background:#000}.divider{padding:34px 18px;text-align:center;background:linear-gradient(135deg,#06111f,#10243a);color:#fff;border-top:6px solid #ffd36c;border-bottom:1px solid #25415f}.divider h2{margin:0 0 7px;font-size:clamp(28px,5vw,54px)}.divider p{margin:0;color:#b8c8db;font-weight:700}.tool-frame{height:6100px;background:#06111f}@media(max-width:700px){.tool-frame{height:7600px}}</style></head><body><iframe id="deckFrame" class="frame deck-frame" title="Original Daddy's sales presentation" scrolling="no" src="../original.html"></iframe><section class="divider"><h2>Daddy's Closing Tool</h2><p>The complete 8-step closing system starts below.</p></section><iframe id="toolFrame" class="frame tool-frame" title="Daddy's interactive closing tool" scrolling="no" src="../closing-tool-full.html"></iframe><script>
const deckFrame=document.getElementById('deckFrame'),toolFrame=document.getElementById('toolFrame');
const reasons=[{key:'Control Energy Cost',title:'Control Energy Cost',desc:'Avoid annual rate increases and gain more control over where your power comes from.',icon:'chart'},{key:'Upgrade Your Home',title:'Upgrade Your Home',desc:'Position the home as energy efficient and more attractive to future buyers.',icon:'home'},{key:'Save Money',title:'Save Money',desc:'Replace a rising electric bill with a lower, more predictable energy cost.',icon:'money'},{key:'Help the Environment',title:'Help the Environment',desc:'Use cleaner renewable energy instead of dirtier utility power sources.',icon:'leaf'}];
function syncTool(reason){localStorage.setItem('daddySolarReason',reason);try{const d=toolFrame.contentDocument;if(!d)return;const map={'Control Energy Cost':'Rate protection','Upgrade Your Home':'Home value','Save Money':'Long-term savings','Help the Environment':'Environmental impact'};d.querySelectorAll('#priorityButtons button').forEach(b=>b.classList.toggle('active',b.dataset.p===map[reason]));const s=d.getElementById('discoverySummary');if(s)s.innerHTML='<strong>Primary reason selected in the presentation:</strong> '+reason+'. This should guide the education, proposal, and close.';const f=d.getElementById('educationFocus');if(f)f.textContent='Lead with '+reason.toLowerCase()+', then connect the numbers and recommendation back to that motivation.'}catch(e){}}
const iconSvg={chart:`<svg viewBox="0 0 64 64"><path d="M12 50V14M12 50H54" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M19 42l11-12 9 7 13-17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 20h8v8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`,home:`<svg viewBox="0 0 64 64"><path d="M10 31 32 13l22 18v22H10Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M25 53V36h14v17M45 20v-7h7v13" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>`,money:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-width="4"/><path d="M39 22c-2-3-5-4-9-4-6 0-10 3-10 8 0 11 20 5 20 15 0 5-4 8-10 8-4 0-8-2-10-5M32 13v38" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`,leaf:`<svg viewBox="0 0 64 64"><path d="M53 11C29 12 14 24 14 40c0 8 6 13 14 13 17 0 27-16 25-42Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M13 54c10-17 21-25 36-34" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`};
const visuals=[`<div class="hero-card rate-card"><div class="eyebrow">Utility rates trend upward</div><div class="hero-title">Take control of your energy cost.</div><div class="rate-chart"><svg viewBox="0 0 620 270"><defs><linearGradient id="rateLine" x1="0" x2="1"><stop stop-color="#70a9f4"/><stop offset="1" stop-color="#194dbc"/></linearGradient><linearGradient id="rateFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70a9f4" stop-opacity=".35"/><stop offset="1" stop-color="#70a9f4" stop-opacity="0"/></linearGradient></defs><g stroke="#d7e4f5"><path d="M50 225H585M50 175H585M50 125H585M50 75H585M50 25H585"/></g><path d="M55 215 155 178 255 135 355 92 455 62 565 34V225H55Z" fill="url(#rateFill)"/><path d="M55 215 155 178 255 135 355 92 455 62 565 34" fill="none" stroke="url(#rateLine)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fff" stroke="#2457c5" stroke-width="5"><circle cx="55" cy="215" r="10"/><circle cx="155" cy="178" r="10"/><circle cx="255" cy="135" r="10"/><circle cx="355" cy="92" r="10"/><circle cx="455" cy="62" r="10"/><circle cx="565" cy="34" r="10"/></g><g fill="#7285a4" font-size="15"><text x="50" y="252">Today</text><text x="262" y="252">10 years</text><text x="505" y="252">20+ years</text></g></svg></div><div class="hero-foot">Choose a more predictable path instead of accepting every future utility increase.</div></div>`,`<div class="hero-card home-value"><div class="home-scene"><svg viewBox="0 0 620 340"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9ecff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><linearGradient id="roof" x1="0" x2="1"><stop stop-color="#234f9f"/><stop offset="1" stop-color="#4f83d8"/></linearGradient></defs><rect width="620" height="340" rx="24" fill="url(#sky)"/><circle cx="520" cy="72" r="38" fill="#ffd65b"/><path d="M0 275 Q150 235 310 276 T620 270V340H0Z" fill="#b8d99c"/><path d="M125 286V155l120-88 122 88v131Z" fill="#fff7e8" stroke="#324969" stroke-width="5"/><path d="M106 164 245 55l141 109" fill="none" stroke="#324969" stroke-width="10" stroke-linecap="round"/><path d="M179 285v-82h58v82" fill="#d99055" stroke="#324969" stroke-width="5"/><rect x="275" y="175" width="59" height="43" rx="4" fill="#cfe9ff" stroke="#324969" stroke-width="5"/><path d="M160 122h170" stroke="url(#roof)" stroke-width="24" stroke-linecap="round"/><path d="M425 235V95" stroke="#2f5fbb" stroke-width="10" stroke-linecap="round"/><path d="m393 126 32-34 32 34" fill="none" stroke="#2f5fbb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="scene-copy"><div class="eyebrow">Energy-efficient upgrade</div><div class="hero-title">Increase your home's value and appeal.</div><div class="hero-foot">A modern solar-and-battery setup can help the home stand out to future buyers.</div></div></div>`,`<div class="hero-card savings-card"><div class="savings-top"><div class="dollar-orb">$</div><div><div class="eyebrow">Lower and more predictable</div><div class="hero-title">Save money on your electric bill.</div></div></div><div class="compare-row"><div class="compare-box bad"><span>Utility</span><strong>Higher & rising</strong><small>Rates can change every year</small></div><div class="big-arrow">→</div><div class="compare-box good"><span>Solar</span><strong>Lower & predictable</strong><small>Designed around your usage</small></div></div><div class="hero-foot">In many areas, solar can cost less than staying with the utility over time.</div></div>`,`<div class="hero-card environment-card"><div class="environment-bg"><svg viewBox="0 0 900 360" preserveAspectRatio="none"><defs><linearGradient id="envSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bfe1ff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#78bd55"/><stop offset="1" stop-color="#347d32"/></linearGradient></defs><rect width="900" height="360" fill="url(#envSky)"/><path d="M0 215Q150 165 300 212T600 206T900 205V360H0Z" fill="#9bd172"/><rect y="245" width="900" height="115" fill="url(#grass)"/><circle cx="765" cy="82" r="44" fill="#4c993d"/><rect x="755" y="110" width="20" height="95" fill="#7b5537"/><g transform="translate(470 140) skewX(-10)"><rect width="310" height="120" rx="5" fill="#173c76" stroke="#fff" stroke-width="6"/><g stroke="#78a8e8" stroke-width="4"><path d="M62 0v120M124 0v120M186 0v120M248 0v120M0 40h310M0 80h310"/></g></g></svg></div><div class="env-overlay"><div class="eyebrow">Cleaner power. Real impact.</div><div class="hero-title">Solar energy makes a difference.</div><div class="stat-grid"><div class="stat"><b>♻</b><strong>4.8 tons</strong><span>garbage recycled</span></div><div class="stat"><b>⚡</b><strong>1,718,000</strong><span>fewer smartphones charged</span></div><div class="stat"><b>◷</b><strong>35,495 miles</strong><span>not driven</span></div><div class="stat"><b>▣</b><strong>3.1 fewer</strong><span>cars on the road</span></div></div></div></div>`];
function buildWhy(main,d){main.innerHTML=`<div class="why-shell"><header><div class="we-mark">WE</div><h1>Why are people going solar?</h1></header><div class="why-body"><div class="why-buttons"></div><div class="why-visual"></div></div></div>`;const btnWrap=main.querySelector('.why-buttons'),visual=main.querySelector('.why-visual');reasons.forEach((r,i)=>{const b=d.createElement('button');b.className='why-btn';b.type='button';b.innerHTML=`<span class="why-icon">${iconSvg[r.icon]}</span><span class="why-copy"><strong>${r.title}</strong><small>${r.desc}</small></span>`;b.onclick=()=>activate(i);btnWrap.appendChild(b)});function activate(i){[...btnWrap.children].forEach((b,j)=>b.classList.toggle('active',i===j));visual.innerHTML=visuals[i];syncTool(reasons[i].key)}const saved=localStorage.getItem('daddySolarReason');activate(Math.max(0,reasons.findIndex(r=>r.key===saved)));}
function buildGrid(slide){slide.className='slide grid-v4';slide.innerHTML=`<div class="grid-shell"><div class="grid-top"><h1>The Grid</h1><p>The traditional way power is delivered is outdated, inefficient, and expensive. Every step adds equipment, labor, and energy loss — which is why rates keep increasing. <strong>Batteries cut out the middleman.</strong> That is why certain utilities, including APS and SRP, can offer a <strong>$40–$60 monthly bill reduction per battery</strong>.</p></div><div class="grid-steps">${gridSteps()}</div><div class="why-incentive"><div class="why-incentive-title">Why utilities offer a battery incentive</div><ul><li>Reduces peak demand and expensive grid strain</li><li>Delays costly infrastructure upgrades and maintenance</li><li>Creates a more reliable and resilient power system</li><li>Helps control long-term utility costs for everyone</li></ul></div></div>`}
function gridSteps(){const items=[['Generation',`<svg viewBox="0 0 120 95"><rect x="5" y="72" width="110" height="15" rx="4" fill="#8fa1b6"/><path d="M20 72V38h22v34M51 72V27h18v45M78 72V45h22v27" fill="#9aa9ba"/><path d="M24 38c-10-17 8-26 15-13 4-17 25-13 23 3 15-5 25 13 12 22" fill="#d3dae2"/></svg>`],['Transmission',`<svg viewBox="0 0 120 95"><path d="M20 86 40 10 60 86M60 86 82 18 102 86" fill="none" stroke="#56677c" stroke-width="5"/><path d="M14 47h52M26 30h30M54 50h55M68 34h28" stroke="#56677c" stroke-width="4"/><path d="M40 10v76M82 18v68" stroke="#56677c" stroke-width="3"/></svg>`],['Distribution',`<svg viewBox="0 0 120 95"><path d="M25 86V18M82 86V28" stroke="#735639" stroke-width="7"/><path d="M10 34h40M66 43h34" stroke="#735639" stroke-width="6"/><path d="M12 34c25 18 51 6 70 9" fill="none" stroke="#303d51" stroke-width="3"/></svg>`],['Transformer',`<svg viewBox="0 0 120 95"><rect x="26" y="28" width="68" height="54" rx="8" fill="#54735e"/><rect x="34" y="35" width="52" height="40" rx="5" fill="#6e9277"/><path d="M38 18v12M52 18v12M68 18v12M82 18v12" stroke="#374b3d" stroke-width="5"/><path d="M20 84h80" stroke="#44556a" stroke-width="5"/></svg>`],['Your Home',`<svg viewBox="0 0 120 95"><path d="M18 84V44l42-31 42 31v40Z" fill="#f1dfc4" stroke="#53657b" stroke-width="5"/><path d="M12 48 60 10l48 38" fill="none" stroke="#53657b" stroke-width="7"/><rect x="49" y="58" width="22" height="26" fill="#b67b58"/><rect x="76" y="50" width="16" height="14" fill="#bfe0f8"/></svg>`],['Battery',`<svg viewBox="0 0 120 95"><rect x="35" y="15" width="50" height="68" rx="10" fill="#fff" stroke="#3e5c71" stroke-width="5"/><rect x="43" y="23" width="34" height="52" rx="6" fill="#4caf60"/><path d="M58 32v15H50l14 18V50h8Z" fill="#fff"/><rect x="50" y="8" width="20" height="8" rx="3" fill="#3e5c71"/></svg>`]];return items.map((x,i)=>`<div class="grid-step ${i===5?'smart':''}"><div class="step-num">${i+1}</div><div class="step-art">${x[1]}</div><strong>${x[0]}</strong></div>`).join('')}
function setupDeck(){const d=deckFrame.contentDocument;if(!d)return;const slides=[...d.querySelectorAll('.slide')],whySlides=slides.filter(s=>s.querySelector('.reason-list'));if(whySlides.length<4)return;const style=d.createElement('style');style.textContent=`.why-shell,.grid-shell{position:absolute;inset:0;background:#fff;color:#111}.why-shell{padding:2.6% 3.4% 2.4%}.why-shell header{height:15%;display:flex;align-items:center;gap:5%}.why-shell h1{font-size:clamp(38px,4.6vw,72px);font-weight:500;letter-spacing:-.045em;margin:0}.we-mark{width:7.2%;aspect-ratio:1;border:4px solid #111;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(20px,2.2vw,35px)}.why-body{height:85%;display:grid;grid-template-columns:36% 64%;gap:3%;padding-top:1.5%}.why-buttons{display:grid;grid-template-rows:repeat(4,1fr);gap:2.2%;min-height:0}.why-btn{border:1px solid #e1e6ee;background:#fff;border-radius:18px;padding:2.4% 4%;display:grid;grid-template-columns:17% 1fr;align-items:center;text-align:left;color:#9aa8bd;box-shadow:0 5px 14px rgba(28,50,81,.035);transition:.2s;min-height:0}.why-btn.active{color:#1d54bd;border:3px solid #1e57c6;box-shadow:0 10px 22px rgba(30,87,198,.12);background:linear-gradient(180deg,#fff,#f8fbff)}.why-btn:not(.active){opacity:.43}.why-icon{width:84%;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;padding:18%}.why-icon svg{width:100%;height:100%}.why-copy strong{display:block;font-size:clamp(18px,1.65vw,28px);line-height:1.05}.why-copy small{display:block;margin-top:5px;font-size:clamp(11px,.98vw,16px);line-height:1.22;color:#66768e}.why-visual{min-width:0;min-height:0}.hero-card{height:100%;border-radius:26px;overflow:hidden;background:linear-gradient(145deg,#f7fbff,#eaf2ff);box-shadow:0 14px 30px rgba(26,52,91,.1),inset 0 0 0 1px #d7e3f3;padding:4%;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:clamp(12px,1vw,16px);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#6a82a7}.hero-title{font-size:clamp(30px,3.55vw,56px);font-weight:850;line-height:.98;letter-spacing:-.04em;color:#194dad}.hero-foot{font-size:clamp(13px,1.08vw,18px);line-height:1.3;color:#526b91}.rate-card{gap:2.5%}.rate-chart{height:62%;margin:1% 0}.rate-chart svg{width:100%;height:100%}.home-value{display:grid;grid-template-columns:55% 45%;gap:2%;padding:2.5%}.home-scene{height:100%;border-radius:20px;overflow:hidden}.home-scene svg{width:100%;height:100%}.scene-copy{display:flex;flex-direction:column;justify-content:center;gap:5%}.savings-card{gap:5%}.savings-top{display:grid;grid-template-columns:22% 1fr;align-items:center;gap:4%}.dollar-orb{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#edf5ff,#d9e9ff);font-size:clamp(70px,8vw,120px);font-weight:700;color:#2255b6;box-shadow:inset 0 0 0 1px #c9dafa}.compare-row{display:grid;grid-template-columns:1fr 9% 1fr;align-items:center}.compare-box{padding:6%;border-radius:22px;text-align:center;background:#fff;border:1px solid #d5e1f0}.compare-box span{display:block;font-size:clamp(11px,.9vw,14px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7a8da9}.compare-box strong{display:block;font-size:clamp(18px,1.8vw,28px);margin:5px 0;color:#203e76}.compare-box small{font-size:clamp(10px,.85vw,13px);color:#687993}.compare-box.good{background:#eff9ef;border-color:#c9e1c8}.big-arrow{text-align:center;font-size:clamp(34px,3vw,48px);color:#7191cc}.environment-card{padding:0;position:relative}.environment-bg{position:absolute;inset:0}.environment-bg svg{width:100%;height:100%}.env-overlay{position:relative;z-index:1;height:100%;padding:4%;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.22) 36%,rgba(255,255,255,.96) 70%)}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2%;margin-top:3%}.stat{background:rgba(255,255,255,.95);border-radius:18px;padding:8% 6%;text-align:center;box-shadow:0 8px 18px rgba(29,61,103,.12)}.stat b{display:block;font-size:clamp(22px,2.1vw,34px)}.stat strong{display:block;font-size:clamp(16px,1.55vw,25px);color:#184bab}.stat span{display:block;margin-top:5px;font-size:clamp(10px,.82vw,13px);color:#52647d}.grid-v4{background:#eef5fb!important}.grid-shell{padding:3% 3.4%;background:linear-gradient(180deg,#dceaf8,#eef5fb 38%,#fff 38%)}.grid-top h1{font-size:clamp(38px,4.5vw,70px);margin:0;color:#13223a}.grid-top p{font-size:clamp(14px,1.35vw,22px);line-height:1.32;margin:1% 0 0;color:#263d5c}.grid-steps{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2%;margin-top:2.4%;height:43%}.grid-step{background:#fff;border:1px solid #d5dfeb;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 20px rgba(25,48,80,.07)}.grid-step.smart{background:linear-gradient(180deg,#eff9ed,#e3f3df);border-color:#bddbb6}.step-num{position:absolute;top:8%;left:8%;width:24px;height:24px;border-radius:50%;background:#133b7a;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.step-art{width:74%;height:54%;display:grid;place-items:center}.step-art svg{width:100%;height:100%}.grid-step>strong{font-size:clamp(14px,1.2vw,20px);color:#17355f}.grid-step.smart>strong{color:#1f6a32}.why-incentive{margin-top:2%;padding:1.4% 2%;border-radius:18px;background:#f7faff;border:1px solid #d7e3f2;display:grid;grid-template-columns:31% 69%;gap:2%;align-items:center}.why-incentive-title{font-size:clamp(18px,1.8vw,29px);font-weight:850;color:#17489b}.why-incentive ul{margin:0;padding-left:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px}.why-incentive li{font-size:clamp(12px,1vw,16px);line-height:1.22;color:#38506d}@media(max-width:1100px){.why-shell{padding:2.2% 3.1%}.why-body{grid-template-columns:37% 63%;gap:2%}.why-buttons{gap:1.6%}.why-btn{padding:1.8% 3.5%;grid-template-columns:15% 1fr}.why-copy strong{font-size:clamp(17px,1.5vw,24px)}.why-copy small{font-size:clamp(10px,.88vw,14px)}.stat-grid{gap:1.3%}.grid-steps{gap:.8%}.step-art{width:70%;height:50%}.why-incentive{grid-template-columns:29% 71%}}`;d.head.appendChild(style);buildWhy(whySlides[0],d);whySlides.slice(1,4).forEach(s=>s.remove());const remaining=[...d.querySelectorAll('.slide')];const grid=remaining.find(s=>/The Grid/i.test(s.textContent||''));if(grid)buildGrid(grid);setTimeout(()=>deckFrame.style.height=d.documentElement.scrollHeight+'px',80)}
deckFrame.addEventListener('load',setupDeck);toolFrame.addEventListener('load',()=>{const saved=localStorage.getItem('daddySolarReason');if(saved)syncTool(saved);try{setTimeout(()=>toolFrame.style.height=toolFrame.contentDocument.documentElement.scrollHeight+'px',100)}catch(e){}});
</script></body></html>
