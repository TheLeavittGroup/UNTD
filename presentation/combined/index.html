<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Daddy's Sales Deck</title><meta name="theme-color" content="#000"><style>*{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}body{margin:0;background:#000;font-family:Arial,Helvetica,sans-serif}.frame{display:block;width:100%;border:0}.deck-frame{height:915vw;background:#000}.divider{padding:34px 18px;text-align:center;background:linear-gradient(135deg,#06111f,#10243a);color:#fff;border-top:6px solid #ffd36c;border-bottom:1px solid #25415f}.divider h2{margin:0 0 7px;font-size:clamp(28px,5vw,54px)}.divider p{margin:0;color:#b8c8db;font-weight:700}.tool-frame{height:6100px;background:#06111f}@media(max-width:700px){.tool-frame{height:7600px}}</style></head><body><iframe id="deckFrame" class="frame deck-frame" title="Original Daddy's sales presentation" scrolling="no" src="../original.html"></iframe><section class="divider"><h2>Daddy's Closing Tool</h2><p>The complete 8-step closing system starts below.</p></section><iframe id="toolFrame" class="frame tool-frame" title="Daddy's interactive closing tool" scrolling="no" src="../closing-tool-full.html"></iframe><script>
const deckFrame=document.getElementById('deckFrame'),toolFrame=document.getElementById('toolFrame');
const reasonMap=['Control Energy Cost','Upgrade Your Home','Save Money','Help the Environment'];
function syncTool(reason){localStorage.setItem('daddySolarReason',reason);try{const d=toolFrame.contentDocument;if(!d)return;const map={'Control Energy Cost':'Rate protection','Upgrade Your Home':'Home value','Save Money':'Long-term savings','Help the Environment':'Environmental impact'};d.querySelectorAll('#priorityButtons button').forEach(b=>b.classList.toggle('active',b.dataset.p===map[reason]));const s=d.getElementById('discoverySummary');if(s)s.innerHTML='<strong>Primary reason selected in the presentation:</strong> '+reason+'. This should guide the education, proposal, and close.';const f=d.getElementById('educationFocus');if(f)f.textContent='Lead with '+reason.toLowerCase()+', then connect the numbers and recommendation back to that motivation.'}catch(e){}}
function setupDeck(){const d=deckFrame.contentDocument;if(!d)return;const slides=[...d.querySelectorAll('.slide')],whySlides=slides.filter(s=>s.querySelector('.reason-list'));if(whySlides.length<4)return;const main=whySlides[0],reasons=[...main.querySelectorAll('.reason')],style=d.createElement('style');style.textContent=`
.reason{cursor:pointer;transition:.2s;border:2px solid transparent;border-radius:16px;padding:1.7% 4% 1.7% 6%!important;margin:0!important;min-height:0}.reason:hover{transform:translateX(4px)}.reason.active{opacity:1;border-color:#8da6e8;box-shadow:0 8px 20px rgba(34,88,199,.1);background:linear-gradient(180deg,#fff,#fbfcff)}.reason:not(.active){opacity:.16}.reason:focus{outline:3px solid #2258c7;outline-offset:3px}.reason.active:before{left:2px!important;top:10%!important;bottom:10%!important;border-radius:99px;width:5px!important;background:#4167d9!important}.reason h3{font-size:clamp(16px,1.8vw,28px)!important;line-height:1.05}.reason p{font-size:clamp(11px,1.08vw,16px)!important;line-height:1.18!important;margin-top:3px!important}.reasons{grid-template-columns:41% 59%;padding-top:5.8%;height:100%}.reason-list{padding:2% 3.5% 2% 0!important;height:88%;display:flex!important;flex-direction:column;justify-content:space-between;gap:1%!important}.visual{height:100%;padding:0 2% 2%;display:flex;align-items:center;justify-content:center;overflow:hidden}.custom-visual{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;padding:1.5%}.control-wrap{gap:3%}.control-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}.control-top strong{font-size:clamp(22px,2.5vw,38px);color:#2757b6}.control-top span{display:block;font-size:clamp(11px,1vw,15px);letter-spacing:.08em;text-transform:uppercase;color:#6d83a9;font-weight:700}.control-chip{padding:8px 12px;border-radius:99px;background:#eff5ff;color:#2757b6;font-weight:700;font-size:clamp(11px,.95vw,14px);border:1px solid #cddaf5}.chart-shell{width:100%;height:64%;border-radius:22px;background:linear-gradient(#f8fbff,#eef5ff);box-shadow:inset 0 0 0 1px #d9e5fb;padding:12px}.chart-shell svg{width:100%;height:100%}.control-caption{width:100%;color:#46628f;font-size:clamp(12px,1.05vw,16px);line-height:1.25}.home-wrap{gap:4%;padding:1% 3%}.home-card{width:100%;height:76%;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;padding:4%;border-radius:26px;background:linear-gradient(135deg,#f7fbff,#eaf3ff);box-shadow:inset 0 0 0 1px #d9e5fb}.home-icon{width:100%;height:80%}.home-copy strong{font-size:clamp(30px,3.8vw,56px);line-height:.94;color:#2757b6}.home-copy span{display:block;margin-top:12px;font-size:clamp(12px,1.1vw,17px);line-height:1.3;color:#5d7399}.money-wrap{gap:3%;padding:1% 3%}.money-hero{width:100%;display:grid;grid-template-columns:125px 1fr;align-items:center;gap:16px}.money-icon{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#edf5ff,#dbe9ff);display:grid;place-items:center;font-size:86px;font-weight:700;color:#2757b6;box-shadow:inset 0 0 0 1px #cfdef9}.money-copy strong{display:block;font-size:clamp(28px,3.5vw,52px);line-height:.95;color:#2757b6}.money-copy span{display:block;margin-top:7px;color:#5e7299;font-size:clamp(12px,1vw,16px)}.money-row{width:100%;display:grid;grid-template-columns:1fr 45px 1fr;align-items:center}.money-pill{border-radius:18px;padding:12px;background:#f2f7ff;box-shadow:inset 0 0 0 1px #d9e5fb;text-align:center}.money-pill label{display:block;font-size:11px;text-transform:uppercase;color:#7b8eaf;font-weight:700}.money-pill b{display:block;font-size:clamp(16px,1.6vw,24px);color:#243f80}.money-arrow{font-size:36px;color:#7b95cf;text-align:center}.money-caption{text-align:center;color:#46628f;font-size:clamp(12px,1vw,16px)}.env-wrap{gap:2%;padding:0 2% 1%}.env-head{text-align:center}.env-head strong{font-size:clamp(21px,2.4vw,36px);color:#2757b6}.env-head span{display:block;margin-top:5px;font-size:clamp(11px,.95vw,14px);color:#6b7fa4}.env-grid{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}.env-stat{min-height:96px;border-radius:18px;background:linear-gradient(#f8fbff,#eef5ff);box-shadow:inset 0 0 0 1px #d9e5fb;padding:9px;display:flex;align-items:center;gap:10px;text-align:left}.env-icon{flex:0 0 38px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e5efff;color:#2757b6;font-size:20px}.env-stat b{font-size:clamp(20px,2.2vw,34px);line-height:.95;color:#264ea7}.env-stat em{display:block;font-style:normal;font-size:clamp(13px,1.3vw,19px);color:#264ea7;font-weight:700}.env-stat span{font-size:clamp(10px,.9vw,13px);line-height:1.15;color:#5e7299}.battery-grid-slide{padding:3.2% 4%!important;background:linear-gradient(180deg,#deebf8 0,#eff5fb 44%,#fff 45%)!important}.battery-grid-slide h1{font-size:clamp(34px,4vw,62px);margin:0;color:#142238}.battery-grid-slide .lead{font-size:clamp(14px,1.4vw,23px);line-height:1.32;margin:1% 0 2%;max-width:96%;color:#263a55}.grid-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:1%;}.grid-step{background:rgba(255,255,255,.82);border:1px solid #d3deeb;border-radius:18px;padding:10% 7%;text-align:center;box-shadow:0 10px 20px rgba(24,45,75,.06)}.grid-step svg{width:56px;height:56px}.grid-step h3{font-size:clamp(14px,1.25vw,21px);margin:7px 0 3px;color:#162b48}.grid-step p{font-size:clamp(10px,.92vw,14px);line-height:1.2;margin:0;color:#596d87}.grid-step b{display:block;margin-top:7px;font-size:clamp(9px,.82vw,12px);color:#bd4a34;text-transform:uppercase}.grid-bottom{display:grid;grid-template-columns:1fr 1.12fr;gap:1.5%;margin-top:1.8%}.grid-card{background:#fff;border:1px solid #d3deeb;border-radius:20px;padding:3%;box-shadow:0 10px 20px rgba(24,45,75,.06)}.grid-card h2{font-size:clamp(20px,2vw,32px);margin:0 0 8px;color:#142238}.grid-card p,.grid-card li{font-size:clamp(11px,1vw,16px);line-height:1.28;color:#334a67}.grid-card ul{margin:0;padding-left:20px}.incentive{display:inline-block;padding:7px 12px;border-radius:99px;background:#ecf7ec;border:1px solid #c9e1c7;color:#21602d;font-weight:800;font-size:clamp(11px,1vw,15px);margin-bottom:8px}.battery-mini{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center}.battery-box{height:130px;border-radius:16px;background:#eef5ff;border:1px solid #d5e1f1;display:grid;place-items:center}.battery-box svg{width:105px;height:105px}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.benefits div{padding:8px;border-radius:12px;background:#f6f9fd;border:1px solid #e0e8f1;text-align:center}.benefits strong{display:block;font-size:clamp(11px,1vw,15px);color:#183b65}.benefits span{font-size:clamp(9px,.78vw,12px);color:#60738b}@media(max-width:1100px){.reason-list{height:90%;}.env-stat{min-height:82px}.grid-flow{gap:.7%}.grid-step{padding:8% 5%}.grid-bottom{margin-top:1.2%}}
`;d.head.appendChild(style);
const visualTemplates=[
`<div class="custom-visual control-wrap"><div class="control-top"><div><span>Utility rates trend upward</span><strong>Control Energy Costs</strong></div><div class="control-chip">More choice. More control.</div></div><div class="chart-shell"><svg viewBox="0 0 540 280"><defs><linearGradient id="lg" x1="0" x2="1"><stop stop-color="#6ca5ef"/><stop offset="1" stop-color="#2a56c3"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bc0f4" stop-opacity=".35"/><stop offset="1" stop-color="#9bc0f4" stop-opacity="0"/></linearGradient></defs><g stroke="#d7e2f5"><path d="M52 236H510M52 182H510M52 128H510M52 74H510M52 20H510"/></g><path d="M52 208L150 166 248 94 346 72 444 54 510 40V236H52Z" fill="url(#fg)"/><path d="M52 208L150 166 248 94 346 72 444 54 510 40" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/><g fill="#fff" stroke="#2b58c5" stroke-width="4"><circle cx="52" cy="208" r="8"/><circle cx="150" cy="166" r="8"/><circle cx="248" cy="94" r="8"/><circle cx="346" cy="72" r="8"/><circle cx="444" cy="54" r="8"/><circle cx="510" cy="40" r="8"/></g><g fill="#7f91af" font-size="13"><text x="52" y="260">2020</text><text x="245" y="260">2030</text><text x="445" y="260">2040</text></g></svg></div><div class="control-caption">Choose where your power comes from and build a more predictable path instead of accepting annual utility increases.</div></div>`,
`<div class="custom-visual home-wrap"><div class="home-card"><svg class="home-icon" viewBox="0 0 300 250"><defs><linearGradient id="hg" x1="0" x2="1" y2="1"><stop stop-color="#8db8f5"/><stop offset="1" stop-color="#2d59c5"/></linearGradient></defs><path d="M54 190V110L126 52 196 110V190M104 190V135H146V190M207 196V44M170 79L207 42 244 79" fill="none" stroke="url(#hg)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="home-copy"><strong>Increased<br>home value</strong><span>Energy-efficient upgrades can help your home stand out and feel more attractive to future buyers.</span></div></div></div>`,
`<div class="custom-visual money-wrap"><div class="money-hero"><div class="money-icon">$</div><div class="money-copy"><strong>Save Money<br>on Your Electric Bill</strong><span>Replace rising utility costs with a more predictable payment path.</span></div></div><div class="money-row"><div class="money-pill"><label>Utility</label><b>Higher & rising</b></div><div class="money-arrow">→</div><div class="money-pill"><label>Solar</label><b>Lower & predictable</b></div></div><div class="money-caption">In many areas, solar can cost less than staying with the utility over time.</div></div>`,
`<div class="custom-visual env-wrap"><div class="env-head"><strong>Solar Energy Makes a Difference.</strong><span>Cleaner energy reduces waste, emissions, and dependence on dirtier power sources.</span></div><div class="env-grid"><div class="env-stat"><div class="env-icon">♻</div><div><b>4.8</b><em>tons</em><span>of garbage recycled</span></div></div><div class="env-stat"><div class="env-icon">⚡</div><div><b>1,718,000</b><em>fewer</em><span>smartphones charged</span></div></div><div class="env-stat"><div class="env-icon">◷</div><div><b>35,495</b><em>miles</em><span>not driven</span></div></div><div class="env-stat"><div class="env-icon">▣</div><div><b>3.1</b><em>fewer</em><span>cars on the road</span></div></div></div></div>`];
function activate(i){reasons.forEach((r,j)=>{r.classList.toggle('active',i===j);r.setAttribute('aria-pressed',i===j)});const v=main.querySelector('.visual');if(v)v.innerHTML=visualTemplates[i];syncTool(reasonMap[i])}reasons.forEach((r,i)=>{r.tabIndex=0;r.setAttribute('role','button');r.onclick=()=>activate(i);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(i)}}});whySlides.slice(1,4).forEach(s=>s.remove());
const grid=[...d.querySelectorAll('.slide')].find(s=>s.querySelector('h1')?.textContent.trim()==='The Grid'||s.classList.contains('grid-slide'));if(grid){grid.className='slide battery-grid-slide';grid.innerHTML=`<h1>The Grid</h1><p class="lead">The traditional power-delivery system is outdated, inefficient, and expensive to maintain. Every step adds equipment, labor, and energy loss — and that pressure causes rate increases. Utilities are now rewarding batteries because stored energy helps modernize and stabilize the grid.</p><div class="grid-flow">${[['Generation','Power is created at large plants.','High production cost'],['Transmission','Power travels long distances.','Energy loss + upkeep'],['Distribution','Local lines feed neighborhoods.','Aging infrastructure'],['Transformer','Voltage is stepped down.','Equipment upgrades'],['Your Home','You pay for the full chain.','Rates keep climbing']].map((x,i)=>`<div class="grid-step"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="27" fill="#eaf1fb" stroke="#42658f" stroke-width="3"/><text x="36" y="43" text-anchor="middle" font-size="22" font-weight="800" fill="#284b76">${i+1}</text></svg><h3>${x[0]}</h3><p>${x[1]}</p><b>${x[2]}</b></div>`).join('')}</div><div class="grid-bottom"><div class="grid-card"><h2>Why this drives rate increases</h2><ul><li>Multiple expensive layers stand between the power plant and the home.</li><li>Utilities must fund repairs, peak demand, replacements, and grid upgrades.</li><li>Those costs are recovered through higher monthly rates.</li></ul></div><div class="grid-card"><div class="battery-mini"><div><div class="incentive">⚡ Utility battery incentive: $40–$60/month</div><h2>Why utilities are making a change</h2><p>Battery owners can send stored energy back when the grid is under the most pressure. That helps utilities reduce peak strain, avoid costly capacity upgrades, and cover system needs more efficiently.</p></div><div class="battery-box"><svg viewBox="0 0 100 120"><rect x="18" y="12" width="64" height="96" rx="12" fill="#fff" stroke="#36577f" stroke-width="4"/><rect x="82" y="45" width="8" height="30" rx="3" fill="#36577f"/><rect x="27" y="22" width="46" height="76" rx="7" fill="#62aa6a"/><path d="M47 36v22H37l18 25V61h10z" fill="#fff"/></svg></div></div><div class="benefits"><div><strong>Peak relief</strong><span>Use stored power during demand spikes</span></div><div><strong>Grid support</strong><span>Reduce stress on utility infrastructure</span></div><div><strong>Home benefit</strong><span>Incentive plus backup resilience</span></div></div></div></div>`}
const saved=localStorage.getItem('daddySolarReason');activate(Math.max(0,reasonMap.indexOf(saved)));setTimeout(()=>deckFrame.style.height=d.documentElement.scrollHeight+'px',80)}
deckFrame.addEventListener('load',setupDeck);toolFrame.addEventListener('load',()=>{const s=localStorage.getItem('daddySolarReason');if(s)syncTool(s);try{setTimeout(()=>toolFrame.style.height=toolFrame.contentDocument.documentElement.scrollHeight+'px',100)}catch(e){}});
</script></body></html>
