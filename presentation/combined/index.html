<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddy's Sales Deck</title>
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}body{margin:0;background:#000;font-family:Arial,Helvetica,sans-serif}.frame{display:block;width:100%;border:0}.deck-frame{height:915vw;background:#000}.divider{padding:34px 18px;text-align:center;background:linear-gradient(135deg,#06111f,#10243a);color:#fff;border-top:6px solid #ffd36c;border-bottom:1px solid #25415f}.divider h2{margin:0 0 7px;font-size:clamp(28px,5vw,54px)}.divider p{margin:0;color:#b8c8db;font-weight:700}.tool-frame{height:6100px;background:#06111f}@media(max-width:700px){.tool-frame{height:7600px}}
</style>

<body>
<iframe id="deckFrame" class="frame deck-frame" title="Original Daddy's sales presentation" scrolling="no" src="../original.html"></iframe>
<section class="divider"><h2>Daddy's Closing Tool</h2><p>The complete 8-step closing system starts below.</p></section>
<iframe id="toolFrame" class="frame tool-frame" title="Daddy's interactive closing tool" scrolling="no" src="../closing-tool-full.html"></iframe>
<script>
const deckFrame=document.getElementById('deckFrame');
const toolFrame=document.getElementById('toolFrame');
const reasonMap=['Control Energy Cost','Upgrade Your Home','Save Money','Help the Environment'];
function syncTool(reason){localStorage.setItem('daddySolarReason',reason);try{const d=toolFrame.contentDocument;if(!d)return;const map={'Control Energy Cost':'Rate protection','Upgrade Your Home':'Home value','Save Money':'Long-term savings','Help the Environment':'Environmental impact'};d.querySelectorAll('#priorityButtons button').forEach(b=>b.classList.toggle('active',b.dataset.p===map[reason]));const s=d.getElementById('discoverySummary');if(s)s.innerHTML='<strong>Primary reason selected in the presentation:</strong> '+reason+'. This should guide the education, proposal, and close.';const f=d.getElementById('educationFocus');if(f)f.textContent='Lead with '+reason.toLowerCase()+', then connect the numbers and recommendation back to that motivation.'}catch(e){}}
function setupDeck(){const d=deckFrame.contentDocument;if(!d)return;const slides=[...d.querySelectorAll('.slide')];const whySlides=slides.filter(s=>s.querySelector('.reason-list'));if(whySlides.length<4)return;const main=whySlides[0],reasons=[...main.querySelectorAll('.reason')];const style=d.createElement('style');style.textContent=`
.reason{cursor:pointer;transition:.2s;border:2px solid transparent;border-radius:15px;padding:1.05% 3.5% 1.05% 5.4%!important;margin:0!important;min-height:0}.reason:hover{transform:translateX(4px)}.reason.active{opacity:1;border-color:#7f9ee6;box-shadow:0 7px 18px rgba(34,88,199,.1);background:linear-gradient(180deg,#fff,#fbfcff)}.reason:not(.active){opacity:.16}.reason:focus{outline:3px solid #2258c7;outline-offset:2px}.reason.active:before{left:2px!important;top:10%!important;bottom:10%!important;border-radius:99px;width:5px!important;background:#4167d9!important}.reason h3{font-size:clamp(15px,1.58vw,25px)!important;line-height:1.03!important;margin:0!important}.reason p{font-size:clamp(10px,.94vw,14px)!important;line-height:1.13!important;margin:3px 0 0!important}.reasons{grid-template-columns:40.5% 59.5%;padding-top:5.2%!important;height:100%}.reason-list{padding:1.3% 3.1% 1.5% 0!important;height:83%!important;display:flex!important;flex-direction:column;justify-content:space-between;gap:.45%!important}.visual{height:100%;padding:0 1.8% 1.5%;display:flex;align-items:center;justify-content:center;overflow:hidden}.custom-visual{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;padding:1.3%}.control-wrap{gap:2.6%}.control-top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}.control-top strong{font-size:clamp(21px,2.4vw,37px);color:#2757b6}.control-top span{display:block;font-size:clamp(10px,.95vw,14px);letter-spacing:.08em;text-transform:uppercase;color:#6d83a9;font-weight:700}.control-chip{padding:7px 11px;border-radius:99px;background:#eff5ff;color:#2757b6;font-weight:700;font-size:clamp(10px,.9vw,13px);border:1px solid #cddaf5}.chart-shell{width:100%;height:63%;border-radius:20px;background:linear-gradient(#f8fbff,#eef5ff);box-shadow:inset 0 0 0 1px #d9e5fb;padding:11px}.chart-shell svg{width:100%;height:100%}.control-caption{width:100%;color:#46628f;font-size:clamp(11px,.98vw,15px);line-height:1.2}.home-wrap{gap:3%;padding:1% 2.5%}.home-card{width:100%;height:77%;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;padding:3.5%;border-radius:24px;background:linear-gradient(135deg,#f7fbff,#eaf3ff);box-shadow:inset 0 0 0 1px #d9e5fb}.home-icon{width:100%;height:82%}.home-copy strong{font-size:clamp(29px,3.7vw,54px);line-height:.94;color:#2757b6}.home-copy span{display:block;margin-top:10px;font-size:clamp(11px,1vw,16px);line-height:1.25;color:#5d7399}.money-wrap{gap:2.5%;padding:1% 2.6%}.money-hero{width:100%;display:grid;grid-template-columns:116px 1fr;align-items:center;gap:14px}.money-icon{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#edf5ff,#dbe9ff);display:grid;place-items:center;font-size:78px;font-weight:700;color:#2757b6;box-shadow:inset 0 0 0 1px #cfdef9}.money-copy strong{display:block;font-size:clamp(27px,3.4vw,50px);line-height:.95;color:#2757b6}.money-copy span{display:block;margin-top:6px;color:#5e7299;font-size:clamp(11px,.95vw,15px)}.money-row{width:100%;display:grid;grid-template-columns:1fr 40px 1fr;align-items:center}.money-pill{border-radius:17px;padding:10px;background:#f2f7ff;box-shadow:inset 0 0 0 1px #d9e5fb;text-align:center}.money-pill label{display:block;font-size:10px;text-transform:uppercase;color:#7b8eaf;font-weight:700}.money-pill b{display:block;font-size:clamp(15px,1.5vw,22px);color:#243f80}.money-arrow{font-size:33px;color:#7b95cf;text-align:center}.money-caption{text-align:center;color:#46628f;font-size:clamp(11px,.95vw,15px)}.env-wrap{gap:1.4%;padding:0 1.7% .5%}.env-head{text-align:center}.env-head strong{font-size:clamp(20px,2.3vw,35px);color:#2757b6}.env-head span{display:block;margin-top:4px;font-size:clamp(10px,.9vw,13px);color:#6b7fa4}.env-grid{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:7px 9px}.env-stat{min-height:78px;border-radius:16px;background:linear-gradient(#f8fbff,#eef5ff);box-shadow:inset 0 0 0 1px #d9e5fb;padding:7px 8px;display:flex;align-items:center;gap:8px;text-align:left}.env-icon{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e5efff;color:#2757b6;font-size:18px}.env-stat b{font-size:clamp(18px,2vw,31px);line-height:.92;color:#264ea7}.env-stat em{display:block;font-style:normal;font-size:clamp(12px,1.18vw,18px);color:#264ea7;font-weight:700}.env-stat span{font-size:clamp(9px,.82vw,12px);line-height:1.1;color:#5e7299}.battery-grid-slide{padding:3.3% 4.2%!important;background:linear-gradient(180deg,#dfeaf7 0%,#eef4fb 45%,#fff 45%)!important}.battery-grid-slide h1{font-size:clamp(36px,4.2vw,66px);margin:0;color:#142238}.battery-grid-slide .lead{font-size:clamp(15px,1.45vw,24px);line-height:1.3;margin:1.2% 0 2.2%;max-width:96%;color:#263a55}.grid-flow{display:grid;grid-template-columns:repeat(6,1fr);gap:1%;align-items:stretch}.grid-step{background:rgba(255,255,255,.88);border:1px solid #d3deeb;border-radius:18px;padding:7% 5%;text-align:center;box-shadow:0 10px 20px rgba(24,45,75,.06);display:flex;flex-direction:column;justify-content:center;align-items:center}.grid-step svg{width:76px;height:76px}.grid-step h3{font-size:clamp(14px,1.22vw,20px);margin:9px 0 0;color:#162b48}.grid-step.smart{background:linear-gradient(180deg,#f0f9ef,#e5f4df);border-color:#c6dfbd}.grid-step.smart h3{color:#1e6731}.incentive-bar{margin-top:2.2%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;background:linear-gradient(135deg,#123e7a,#092757);color:#fff;border-radius:20px;padding:1.6% 2.2%;box-shadow:0 12px 24px rgba(11,42,87,.18)}.incentive-money{font-size:clamp(26px,3.2vw,48px);font-weight:900;color:#65dd74;white-space:nowrap}.incentive-copy{font-size:clamp(13px,1.22vw,20px);line-height:1.28}.incentive-copy strong{display:block;font-size:clamp(16px,1.5vw,24px);margin-bottom:4px}.simple-note{margin-top:1.4%;font-size:clamp(12px,1.08vw,17px);line-height:1.3;color:#334a67;text-align:center}@media(max-width:1100px){.reason-list{height:84%!important}.env-stat{min-height:70px}.grid-step svg{width:64px;height:64px}.grid-flow{gap:.7%}.incentive-bar{margin-top:1.6%}}
`;d.head.appendChild(style);
const visualTemplates=[`<div class="custom-visual control-wrap"><div class="control-top"><div><span>Utility rates trend upward</span><strong>Control Energy Costs</strong></div><div class="control-chip">More choice. More control.</div></div><div class="chart-shell"><svg viewBox="0 0 540 280"><defs><linearGradient id="lg" x1="0" x2="1"><stop stop-color="#6ca5ef"/><stop offset="1" stop-color="#2a56c3"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9bc0f4" stop-opacity=".35"/><stop offset="1" stop-color="#9bc0f4" stop-opacity="0"/></linearGradient></defs><g stroke="#d7e2f5"><path d="M52 236H510M52 182H510M52 128H510M52 74H510M52 20H510"/></g><path d="M52 208L150 166 248 94 346 72 444 54 510 40V236H52Z" fill="url(#fg)"/><path d="M52 208L150 166 248 94 346 72 444 54 510 40" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/><g fill="#fff" stroke="#2b58c5" stroke-width="4"><circle cx="52" cy="208" r="8"/><circle cx="150" cy="166" r="8"/><circle cx="248" cy="94" r="8"/><circle cx="346" cy="72" r="8"/><circle cx="444" cy="54" r="8"/><circle cx="510" cy="40" r="8"/></g><g fill="#7f91af" font-size="13"><text x="52" y="260">2020</text><text x="245" y="260">2030</text><text x="445" y="260">2040</text></g></svg></div><div class="control-caption">Choose where your power comes from and build a more predictable path instead of accepting annual utility increases.</div></div>`,`<div class="custom-visual home-wrap"><div class="home-card"><svg class="home-icon" viewBox="0 0 300 250"><defs><linearGradient id="hg" x1="0" x2="1" y2="1"><stop stop-color="#8db8f5"/><stop offset="1" stop-color="#2d59c5"/></linearGradient></defs><path d="M54 190V110L126 52 196 110V190M104 190V135H146V190M207 196V44M170 79L207 42 244 79" fill="none" stroke="url(#hg)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="home-copy"><strong>Increased<br>home value</strong><span>Energy-efficient upgrades can help your home stand out and feel more attractive to future buyers.</span></div></div></div>`,`<div class="custom-visual money-wrap"><div class="money-hero"><div class="money-icon">$</div><div class="money-copy"><strong>Save Money<br>on Your Electric Bill</strong><span>Replace rising utility costs with a more predictable payment path.</span></div></div><div class="money-row"><div class="money-pill"><label>Utility</label><b>Higher & rising</b></div><div class="money-arrow">→</div><div class="money-pill"><label>Solar</label><b>Lower & predictable</b></div></div><div class="money-caption">In many areas, solar can cost less than staying with the utility over time.</div></div>`,`<div class="custom-visual env-wrap"><div class="env-head"><strong>Solar Energy Makes a Difference.</strong><span>Cleaner energy reduces waste, emissions, and dependence on dirtier power sources.</span></div><div class="env-grid"><div class="env-stat"><div class="env-icon">♻</div><div><b>4.8</b><em>tons</em><span>of garbage recycled</span></div></div><div class="env-stat"><div class="env-icon">⚡</div><div><b>1,718,000</b><em>fewer</em><span>smartphones charged</span></div></div><div class="env-stat"><div class="env-icon">◷</div><div><b>35,495</b><em>miles</em><span>not driven</span></div></div><div class="env-stat"><div class="env-icon">▣</div><div><b>3.1</b><em>fewer</em><span>cars on the road</span></div></div></div></div>`];
function activate(i){reasons.forEach((r,j)=>{r.classList.toggle('active',i===j);r.setAttribute('aria-pressed',i===j?'true':'false')});const v=main.querySelector('.visual');if(v)v.innerHTML=visualTemplates[i];syncTool(reasonMap[i])}reasons.forEach((r,i)=>{r.tabIndex=0;r.setAttribute('role','button');r.addEventListener('click',()=>activate(i));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(i)}})});const gridSlide=whySlides[3].nextElementSibling;whySlides.slice(1,4).forEach(s=>s.remove());if(gridSlide){gridSlide.classList.add('battery-grid-slide');gridSlide.innerHTML=`<h1>The Grid</h1><div class="lead">The traditional way power is delivered is outdated, inefficient, and expensive. Every extra step adds equipment, energy loss, and maintenance — which is why utility rates keep increasing. Batteries help reduce that strain, which is why utilities can offer a <strong>$40–$60 monthly incentive</strong>.</div><div class="grid-flow"><div class="grid-step"><svg viewBox="0 0 80 80"><rect x="12" y="23" width="56" height="43" rx="4" fill="#333c49"/><rect x="20" y="35" width="9" height="31" fill="#202834"/><rect x="35" y="29" width="9" height="37" fill="#202834"/><rect x="50" y="42" width="9" height="24" fill="#202834"/><path d="M23 23V12M39 23V8M55 23V15" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round"/></svg><h3>Generation</h3></div><div class="grid-step"><svg viewBox="0 0 80 80"><path d="M20 70 32 10 44 70M36 10 52 70M15 38h49M24 25h31M18 54h42" fill="none" stroke="#3e4a5d" stroke-width="4" stroke-linecap="round"/></svg><h3>Transmission</h3></div><div class="grid-step"><svg viewBox="0 0 80 80"><path d="M21 68V17M59 68V17M21 31h38M27 43h26M40 17v51" fill="none" stroke="#5a4a39" stroke-width="4" stroke-linecap="round"/><path d="M12 68h56" stroke="#4c7a42" stroke-width="5" stroke-linecap="round"/></svg><h3>Distribution</h3></div><div class="grid-step"><svg viewBox="0 0 80 80"><rect x="19" y="17" width="42" height="48" rx="7" fill="#667b70" stroke="#34483f" stroke-width="3"/><path d="M27 30h26M27 40h26M27 50h26" stroke="#dce8df" stroke-width="4" stroke-linecap="round"/><path d="M25 11v8M40 11v8M55 11v8" stroke="#34483f" stroke-width="4" stroke-linecap="round"/></svg><h3>Transformer</h3></div><div class="grid-step"><svg viewBox="0 0 80 80"><path d="M13 69V34L40 15 67 34v35Z" fill="#e9e1d2" stroke="#4c5665" stroke-width="4" stroke-linejoin="round"/><path d="M31 69V47h18v22" fill="#b77a52" stroke="#4c5665" stroke-width="3"/><rect x="20" y="40" width="12" height="12" fill="#82b5d7"/><rect x="49" y="40" width="12" height="12" fill="#82b5d7"/></svg><h3>Your Home</h3></div><div class="grid-step smart"><svg viewBox="0 0 80 80"><rect x="23" y="13" width="34" height="56" rx="7" fill="#fff" stroke="#2f6b3e" stroke-width="4"/><rect x="57" y="31" width="6" height="20" rx="2" fill="#2f6b3e"/><rect x="29" y="20" width="22" height="42" rx="4" fill="#56b765"/><path d="M41 27v13h-7l10 14V42h7z" fill="#fff"/></svg><h3>The Smarter Way</h3></div></div><div class="incentive-bar"><div class="incentive-money">$40–$60 / month</div><div class="incentive-copy"><strong>Why the utility offers an incentive</strong>Batteries store power locally and can help during high-demand hours. That reduces grid strain, delays expensive infrastructure upgrades, and helps utilities manage costs more efficiently.</div></div><div class="simple-note">Instead of relying on every step of the old grid at the worst possible time, the battery gives both the homeowner and the utility a smarter, more flexible option.</div>`}const saved=localStorage.getItem('daddySolarReason');activate(Math.max(0,reasonMap.indexOf(saved)));setTimeout(()=>{deckFrame.style.height=d.documentElement.scrollHeight+'px'},80)}
deckFrame.addEventListener('load',setupDeck);toolFrame.addEventListener('load',()=>{const saved=localStorage.getItem('daddySolarReason');if(saved)syncTool(saved);try{setTimeout(()=>{toolFrame.style.height=toolFrame.contentDocument.documentElement.scrollHeight+'px'},100)}catch(e){}});
</script>
