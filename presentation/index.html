<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Daddy's Proposal Tool</title>
  <meta name="theme-color" content="#000000">
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#000}
    body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .deck-wrap{position:relative;width:100%;max-width:1500px;height:min(815vw,12225px);margin:0 auto;background:#000;overflow:hidden}
    .deck-wrap iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .tools-head{text-align:center;padding:58px 20px 28px;background:#050507;border-top:8px solid #f4c76b}
    .tools-head h2{margin:0 0 10px;font-size:clamp(32px,6vw,68px)}
    .tools-head p{max-width:850px;margin:auto;color:#bbb;line-height:1.5}
    .tools-frame{display:block;width:100%;height:2300px;border:0;background:#050507}
    .floating{position:fixed;z-index:100;right:10px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px}
    .floating a{padding:10px 13px;border-radius:999px;text-decoration:none;font-weight:950;box-shadow:0 8px 28px rgba(0,0,0,.55)}
    .top-button{background:#17181d;color:#fff;border:1px solid #484950}
    .tools-button{background:#f4c76b;color:#111}
    @media(max-width:700px){
      .deck-wrap{height:815vw}
      .tools-frame{height:2800px}
      .floating{right:7px}
      .floating a{padding:9px 10px;font-size:11px}
    }
  </style>
</head>
<body id="top">
  <main class="deck-wrap" aria-label="OWE Arizona sales deck">
    <iframe title="OWE Arizona sales deck" src="https://untd.solar/joinus/wp-content/uploads/2024/03/Owe-Arizona-PP-.pdf?v=20260714#view=FitH&toolbar=0&navpanes=0"></iframe>
  </main>

  <section class="tools-head" id="tools">
    <h2>Calculators, Auto-Texts & Rep Tools</h2>
    <p>The calculator, customer snapshots, rep notes, quote details, follow-up copy, personalization and next-step tools remain available below.</p>
  </section>

  <iframe class="tools-frame" title="Daddy's calculators and rep tools" src="../contact/"></iframe>

  <nav class="floating" aria-label="Proposal shortcuts">
    <a class="top-button" href="#top">Top</a>
    <a class="tools-button" href="#tools">Tools & Calculators</a>
  </nav>
</body>
</html>
