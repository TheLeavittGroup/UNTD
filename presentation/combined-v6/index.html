<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000}#base{display:block;width:100%;height:22000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" src="../combined-v5/?v=stability-fix" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
function getDeck(){
 try{
  const docs=[];let doc=base.contentDocument;
  while(doc){docs.push(doc);const frame=doc.getElementById('base');if(!frame||!frame.contentDocument)break;doc=frame.contentDocument}
  const outer=docs[docs.length-1],deckFrame=outer&&outer.getElementById('deckFrame'),deck=deckFrame&&deckFrame.contentDocument;
  return {docs,outer,deckFrame,deck};
 }catch(e){return {}}
}
function resizeAll(ctx){
 try{
  const {docs,deckFrame,deck}=ctx;
  if(deckFrame&&deck)deckFrame.style.height=deck.documentElement.scrollHeight+'px';
  if(docs)for(let i=docs.length-1;i>0;i--){const f=docs[i-1].getElementById('base');if(f)f.style.height=docs[i].documentElement.scrollHeight+'px'}
  if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px';
 }catch(e){}
}
function fixAurora(d){
 const aurora=d.querySelector('.aurora-transition');if(!aurora)return false;
 if(!d.getElementById('auroraStableStyles')){
  const style=d.createElement('style');style.id='auroraStableStyles';style.textContent=`
   .aurora-transition{aspect-ratio:4/3!important;min-height:760px!important;height:auto!important;padding:0!important;background:#f4f4f6!important;overflow:hidden!important}
   .aurora-live-shell{position:absolute!important;inset:0!important;display:grid!important;grid-template-rows:10% minmax(0,1fr) 6%!important;background:#f4f4f6!important}
   .aurora-live-top{grid-row:1!important}
   .aurora-live-stage{grid-row:2!important;position:relative!important;min-height:0!important;background:#fff!important}
   .aurora-sizing-bar{grid-row:3!important;display:grid!important;grid-template-columns:1.15fr 1fr 1.3fr!important;gap:1px!important;min-height:0!important;background:#dddde4!important;border-top:1px solid #d5d5dc!important;border-bottom:0!important;z-index:5!important}
   .aurora-sizing-item{min-height:0!important;padding:0 .9em!important}
   .aurora-sizing-item label{font-size:clamp(8px,.62vw,11px)!important}
   .aurora-sizing-item input{padding:.3em .55em!important;font-size:clamp(10px,.78vw,13px)!important}
   .aurora-sizing-result{font-size:clamp(10px,.82vw,14px)!important}.aurora-sizing-result small{font-size:clamp(7px,.52vw,9px)!important}
  `;d.head.appendChild(style)
 }
 const shell=aurora.querySelector('.aurora-live-shell');
 const stage=aurora.querySelector('.aurora-live-stage');
 const bar=aurora.querySelector('.aurora-sizing-bar');
 if(shell&&stage&&bar&&stage.nextElementSibling!==bar)shell.appendChild(bar);
 aurora.dataset.stableAurora='1';
 return true;
}
function fixSavings(d){
 const savings=[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));if(!savings)return false;
 if(savings.dataset.calculatorStable==='1')return false;
 const oldCard=savings.querySelector('.input-card');if(!oldCard)return false;
 const card=oldCard.cloneNode(true);oldCard.replaceWith(card);
 let totalBtn=savings.querySelector('#utility25Button');
 if(totalBtn){const clean=totalBtn.cloneNode(true);totalBtn.replaceWith(clean);totalBtn=clean}else{
  const oldRate=savings.querySelector('#rateResult');
  if(oldRate){totalBtn=d.createElement('button');totalBtn.type='button';totalBtn.id='utility25Button';totalBtn.textContent='Total 25-Year Utility Cost';oldRate.replaceWith(totalBtn)}
 }
 if(!d.getElementById('stableCalculatorStyles')){
  const style=d.createElement('style');style.id='stableCalculatorStyles';style.textContent=`
   #utility25Button{width:100%;margin-top:7px;border:0;border-radius:12px;padding:10px 9px;background:#174f91;color:#fff;font-size:clamp(9px,.76vw,12px);line-height:1.15;font-weight:950;cursor:pointer;box-shadow:0 7px 16px rgba(23,79,145,.22)}
   #utility25Button:active{transform:scale(.98)}#utility25Button.result{background:#123b74}
  `;d.head.appendChild(style)
 }
 const entries=[...card.querySelectorAll('.month-entry')],bill=card.querySelector('#recentBill'),kwh=card.querySelector('#recentKwh'),buttons=[...card.querySelectorAll('.mode-toggle button')];
 if(!entries.length||!bill||!kwh)return false;
 let mode=(buttons.find(b=>b.classList.contains('active'))||buttons[0]||{}).dataset?.mode||'usage';
 const money=n=>Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):'$0';
 const setText=(id,text)=>{const el=savings.querySelector('#'+id)||d.getElementById(id);if(el)el.textContent=text};
 let lastMonthly=0;
 const resetTotal=()=>{if(totalBtn){totalBtn.classList.remove('result');totalBtn.textContent='Total 25-Year Utility Cost'}};
 const clear=()=>{lastMonthly=0;['monthlyAvg','y5','y10','y15','y25'].forEach(id=>setText(id,'$0'));resetTotal()};
 const calculate=()=>{
  const vals=entries.map(el=>parseFloat(el.value)||0),b=parseFloat(bill.value),k=parseFloat(kwh.value),current=(b>0&&k>0)?b/k:0;
  let annual=0,monthly=0;
  if(mode==='usage'){
   annual=vals.reduce((a,v)=>a+v,0);setText('annualUsage',Math.round(annual).toLocaleString()+' kWh');
   if(!(annual>0&&current>0)){clear();return}
   monthly=annual*(current+.16)/12;
  }else{
   const annualBills=vals.reduce((a,v)=>a+v,0);annual=current>0?annualBills/current:0;setText('annualUsage',Math.round(annual).toLocaleString()+' kWh');
   if(!(annualBills>0&&current>0)){clear();return}
   monthly=(annualBills+annual*.16)/12;
  }
  lastMonthly=monthly;setText('monthlyAvg',money(monthly));
  [[5,'y5'],[10,'y10'],[15,'y15'],[25,'y25']].forEach(([yr,id])=>setText(id,money(monthly*Math.pow(1.06,yr))));
  const label=savings.querySelector('.graph-label');if(label)label.textContent='WITHOUT SOLAR • '+money(monthly)+'/MO';
  resetTotal();
 };
 buttons.forEach(btn=>btn.addEventListener('click',()=>{
  mode=btn.dataset.mode;buttons.forEach(b=>b.classList.toggle('active',b===btn));
  const title=card.querySelector('#modeTitle');if(title)title.textContent=mode==='usage'?'Enter monthly electricity use':'Enter monthly power bills';
  entries.forEach(el=>{el.value='';el.placeholder=mode==='usage'?'kWh':'$'});setText('annualUsage','0 kWh');clear();
 }));
 [...entries,bill,kwh].forEach(el=>el.addEventListener('input',calculate));
 if(totalBtn)totalBtn.addEventListener('click',()=>{
  calculate();if(!(lastMonthly>0)){totalBtn.textContent='Enter all monthly and latest bill details first';return}
  let total=0;for(let year=0;year<25;year++)total+=lastMonthly*12*Math.pow(1.06,year);
  totalBtn.classList.add('result');totalBtn.textContent=money(total)+' total over 25 years';
 });
 savings.dataset.calculatorStable='1';
 return true;
}
function patchGrid(d){
 const grid=d.querySelector('.slide.grid-v4,.slide.grid-slide,.slide.grid-live-retry')||[...d.querySelectorAll('.slide')].find(s=>{const h=s.querySelector('h1');return h&&/^The Grid$/i.test(h.textContent.trim())});
 if(!grid)return false;
 if(!grid.classList.contains('grid-live-retry'))return false;
 grid.style.setProperty('background','#fff','important');
 const backs=[...grid.querySelectorAll('.grid-retry-face.back strong')];if(backs[1])backs[1].textContent='The large metal poles and lines that cause all those fires.';
 return true;
}
function patchDeck(){
 const ctx=getDeck(),d=ctx.deck;if(!d)return false;
 let changed=false;
 changed=fixAurora(d)||changed;
 changed=fixSavings(d)||changed;
 changed=patchGrid(d)||changed;
 const net=[...d.querySelectorAll('.slide')].find(s=>/The Power of Net Metering/i.test(s.textContent||''));if(net)net.style.setProperty('background','#fff','important');
 if(changed)resizeAll(ctx);
 return changed;
}
function install(){
 let tries=0;const run=()=>{patchDeck();tries++;if(tries<16)setTimeout(run,500);else resizeAll(getDeck())};run();
}
base.addEventListener('load',install);window.addEventListener('resize',()=>setTimeout(()=>resizeAll(getDeck()),120));install();
</script>
</body>
</html>
