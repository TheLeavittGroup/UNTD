<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IID Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:28000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" scrolling="no" title="IID Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
base.src='../iid-sales-deck/?build=iid-savings-v4&refresh='+Date.now();
let timer=0;

function setHeight(frame,height){
 const next=Math.ceil(height||0),current=parseInt(frame.style.height,10)||0;
 if(next>0&&Math.abs(next-current)>4)frame.style.height=next+'px';
}

function getContext(){
 try{
  const docs=[];let doc=base.contentDocument;
  while(doc){
   docs.push(doc);
   const frame=doc.getElementById('base');
   if(!frame||!frame.contentDocument)break;
   doc=frame.contentDocument;
  }
  const outer=docs[docs.length-1];
  const deckFrame=outer&&outer.getElementById('deckFrame');
  const deck=deckFrame&&deckFrame.contentDocument;
  return{docs,deckFrame,deck};
 }catch(e){return{}}
}

function resizeAll(ctx){
 try{
  const{docs,deckFrame,deck}=ctx;
  if(deckFrame&&deck)setHeight(deckFrame,deck.documentElement.scrollHeight);
  if(docs)for(let i=docs.length-1;i>0;i--){
   const frame=docs[i-1].getElementById('base');
   if(frame)setHeight(frame,docs[i].documentElement.scrollHeight);
  }
  if(base.contentDocument)setHeight(base,base.contentDocument.documentElement.scrollHeight);
 }catch(e){}
}

function numberValue(input){
 const value=parseFloat(String(input.value||'').replace(/[^0-9.\-]/g,''));
 return Number.isFinite(value)?Math.max(0,value):0;
}

function visible(input){
 const style=input.ownerDocument.defaultView.getComputedStyle(input);
 return style.display!=='none'&&style.visibility!=='hidden'&&input.offsetParent!==null;
}

function installIIDCalculator(savings){
 let inputCard=savings.querySelector('.input-card');
 const output=savings.querySelector('.monthly-card strong');
 if(!inputCard||!output)return false;
 if(!inputCard.querySelector('.mode-toggle')||inputCard.querySelectorAll('.month-entry').length<12)return false;

 savings.dataset.iidV2OwnsCalculator='true';

 const subtitle=savings.querySelector('.monthly-card span');
 if(subtitle)subtitle.remove();
 const result=savings.querySelector('.rate-result');
 if(result){result.textContent='';result.style.display='none'}

 const liveRate=inputCard.querySelector('#iidRateCents');
 if(inputCard.dataset.iidV2CalculatorReady==='true'&&typeof inputCard._iidCalculate==='function'&&liveRate===inputCard._iidRateInput&&liveRate?.isConnected){
  inputCard._iidCalculate();
  return true;
 }

 const cleanCard=inputCard.cloneNode(true);
 inputCard.replaceWith(cleanCard);
 inputCard=cleanCard;
 inputCard.dataset.iidV2CalculatorReady='true';

 const rateInputs=inputCard.querySelector('.rate-inputs');
 if(!rateInputs)return;
 rateInputs.innerHTML='<label>IID rate ($/kWh)<input id="iidRateCents" type="number" inputmode="decimal" min="0" step="0.001" value="0.28" aria-label="Editable IID rate in dollars per kilowatt-hour"></label>';
 rateInputs.style.gridTemplateColumns='1fr';

 const rateInput=rateInputs.querySelector('#iidRateCents');
 rateInput.readOnly=false;
 rateInput.disabled=false;
 rateInput.removeAttribute('readonly');
 rateInput.removeAttribute('disabled');

 const entries=[...inputCard.querySelectorAll('.month-entry')];
 const buttons=[...inputCard.querySelectorAll('.mode-toggle button')];
 const title=inputCard.querySelector('#modeTitle');
 const annualUsageEl=inputCard.querySelector('#annualUsage');
 const graph=savings.querySelector('.savings-graph');
 const red=savings.querySelector('.graph-red');
 const yellow=savings.querySelector('.graph-yellow');
 const graphLabel=savings.querySelector('.graph-label');
 let mode=(buttons.find(button=>button.classList.contains('active'))?.dataset.mode)||'usage';

 const money=value=>Number.isFinite(value)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value):'$0';

 function updateGraph(monthly){
  if(!graph)return;
  graph.style.opacity='1';
  const level=Math.max(12,Math.min(88,22+(monthly/20)));
  if(red)red.style.clipPath='polygon(0 '+Math.max(35,95-level)+'%,100% 5%,100% 100%,0 100%)';
  if(yellow)yellow.style.width=Math.max(35,Math.min(78,42+(monthly/35)))+'%';
  if(graphLabel)graphLabel.textContent=monthly>0?'WITHOUT SOLAR • '+money(monthly)+'/MO':'WITHOUT SOLAR';
 }

 function calculate(){
  const values=entries.map(input=>numberValue(input));
  const enteredRate=numberValue(rateInput);
  let annualUsage=0;
  let baseMonthly=0;

  if(mode==='bills'){
   const annualBills=values.reduce((sum,value)=>sum+value,0);
   annualUsage=enteredRate>0?annualBills/enteredRate:0;
   baseMonthly=annualBills/12;
  }else{
   annualUsage=values.reduce((sum,value)=>sum+value,0);
   baseMonthly=annualUsage*enteredRate/12;
  }

  if(annualUsageEl)annualUsageEl.textContent=Math.round(annualUsage).toLocaleString('en-US')+' kWh';
  const monthlyBill=(baseMonthly>0&&enteredRate>0)?baseMonthly*1.15:0;
  output.textContent=money(monthlyBill);

  [[5,'y5'],[10,'y10'],[15,'y15'],[25,'y25']].forEach(([years,id])=>{
   const future=savings.querySelector('#'+id);
   if(future)future.textContent=money(monthlyBill*Math.pow(1.15,years/5));
  });

  updateGraph(monthlyBill);
 }

 buttons.forEach(button=>button.addEventListener('click',()=>{
  mode=button.dataset.mode||'usage';
  buttons.forEach(item=>item.classList.toggle('active',item===button));
  if(title)title.textContent=mode==='bills'?'Enter monthly power bills':'Enter monthly electricity use';
  entries.forEach(input=>{input.value='';input.placeholder=mode==='bills'?'$':'kWh'});
  if(annualUsageEl)annualUsageEl.textContent='0 kWh';
  calculate();
 }));

 [...entries,rateInput].forEach(input=>{
  input.addEventListener('input',calculate);
  input.addEventListener('change',calculate);
 });

 inputCard._iidRateInput=rateInput;
 inputCard._iidCalculate=calculate;
 calculate();
 return true;
}

function patch(){
 const ctx=getContext(),d=ctx.deck;
 if(!d)return false;
 const savings=d.querySelector('.slide.savings-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
 if(!savings)return false;

 const paragraph=savings.querySelector('.savings-head p')||[...savings.querySelectorAll('p')].find(p=>/utility prices|solar rate|fixed rate/i.test(p.textContent||''));
 if(paragraph)paragraph.textContent='IID rates stayed relatively stable for years—until recent increases totaling 59%. Your solar rate stays fixed.';

 if(!installIIDCalculator(savings))return false;
 resizeAll(ctx);
 requestAnimationFrame(()=>requestAnimationFrame(()=>resizeAll(getContext())));
 return true;
}

function wait(attempt=0){
 if(patch()){
  setTimeout(patch,700);
  setTimeout(patch,1600);
  return;
 }
 if(attempt<120)setTimeout(()=>wait(attempt+1),100);
}

base.addEventListener('load',()=>wait(),{once:true});
setTimeout(()=>wait(),120);
window.addEventListener('resize',()=>{
 clearTimeout(timer);
 timer=setTimeout(()=>{patch();resizeAll(getContext())},200);
},{passive:true});
</script>
</body>
</html>
