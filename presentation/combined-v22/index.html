<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:32000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" src="../combined-v21/?build=annual-usage-direct-v22-move-copy" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(frame=>{try{if(frame.contentDocument)walkDocs(frame.contentDocument,docs)}catch(e){}})}catch(e){}return docs}
function addSimpleTools(d){
 try{
  if(!d||d.getElementById('simpleUsageTools'))return;
  const savings=d.querySelector('.slide.savings-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
  if(!savings)return;
  const entries=[...savings.querySelectorAll('.month-entry')];
  if(entries.length!==12)return;
  const annualTotal=savings.querySelector('.annual-total');
  if(!annualTotal||!annualTotal.parentNode)return;
  const style=d.createElement('style');style.id='simpleUsageToolsStyles';style.textContent=`
   .simple-tools{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin:8px 0 10px}.simple-tool{border:1px solid #d7dee8;border-radius:12px;background:#f7f9fc;padding:10px}.simple-tool-title{font-size:10px;font-weight:950;color:#173b74;text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px}.simple-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}.simple-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.simple-tool label{display:flex;flex-direction:column;gap:3px;font-size:8px;font-weight:850;color:#45546b}.simple-tool input{width:100%;height:32px;border:1px solid #c8d2df;border-radius:7px;background:#fff;color:#111;padding:0 9px;font-size:14px;font-weight:900;outline:none}.simple-tool input:focus{border-color:#2258c7;box-shadow:0 0 0 2px rgba(34,88,199,.1)}.simple-tool button{height:32px;border:0;border-radius:7px;background:#2258c7;color:#fff;padding:0 12px;font-size:9px;font-weight:950;white-space:nowrap}.simple-battery-result{margin-top:7px;padding:7px 9px;border-radius:7px;background:#102f5b;color:#fff;font-size:9px;font-weight:850;line-height:1.2;text-align:center}.simple-battery-result strong{font-size:14px}.simple-note{margin:5px 0 0!important;color:#768397!important;font-size:6.5px!important;line-height:1.2!important;font-weight:700!important;text-align:center}@media(max-width:600px){.simple-tools{grid-template-columns:1fr 1fr;gap:5px;margin:4px 0 5px}.simple-tool{padding:5px;border-radius:7px}.simple-tool-title{font-size:5.8px;margin-bottom:4px}.simple-row,.simple-grid{gap:4px}.simple-tool label{font-size:4.8px;gap:2px}.simple-tool input{height:21px;border-radius:5px;padding:0 5px;font-size:8px}.simple-tool button{height:21px;border-radius:5px;padding:0 6px;font-size:5px}.simple-battery-result{margin-top:4px;padding:4px 5px;border-radius:5px;font-size:5px}.simple-battery-result strong{font-size:8px}.simple-note{font-size:4.2px!important;margin-top:3px!important}}`;
  d.head.appendChild(style);
  const tools=d.createElement('div');tools.id='simpleUsageTools';tools.className='simple-tools';tools.innerHTML=`<div class="simple-tool"><div class="simple-tool-title">Annual usage</div><div class="simple-row"><label>Total annual kWh<input id="directAnnualUsageInput" type="number" inputmode="decimal" min="0" step="1" placeholder="12-month kWh"></label><button type="button" id="applyDirectAnnualUsage">Apply</button></div></div><div class="simple-tool"><div class="simple-tool-title">Battery sizing</div><div class="simple-grid"><label>Highest demand (kW)<input id="batteryDemandKw" type="number" inputmode="decimal" min="0" step="0.1" placeholder="9.6"></label><label>On-peak usage (kWh)<input id="batteryOnPeakKwh" type="number" inputmode="decimal" min="0" step="1" placeholder="331"></label></div><div class="simple-battery-result" id="batterySizingResult">Enter demand + on-peak usage</div><p class="simple-note">Demand determines Powerwall/inverter count. Extra energy capacity uses Expansion units.</p></div>`;
  annualTotal.parentNode.insertBefore(tools,annualTotal.nextSibling);
  const annualInput=tools.querySelector('#directAnnualUsageInput'),applyButton=tools.querySelector('#applyDirectAnnualUsage');
  const applyAnnual=()=>{const annual=parseFloat(annualInput.value);if(!(annual>0))return;const usageButton=savings.querySelector('.mode-toggle button[data-mode="usage"]');if(usageButton&&!usageButton.classList.contains('active'))usageButton.click();const monthly=annual/12;entries.forEach((el,i)=>{const value=i===11?annual-(monthly*11):monthly;el.value=(Math.round(value*10)/10).toString()});entries.forEach(el=>el.dispatchEvent(new Event('input',{bubbles:true})));const annualDisplay=savings.querySelector('#annualUsage');if(annualDisplay)annualDisplay.textContent=Math.round(annual).toLocaleString('en-US')+' kWh'};
  applyButton.addEventListener('click',applyAnnual);annualInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyAnnual()}});
  const demand=tools.querySelector('#batteryDemandKw'),onPeak=tools.querySelector('#batteryOnPeakKwh'),result=tools.querySelector('#batterySizingResult');
  const calc=()=>{const demandKw=Math.max(0,parseFloat(demand.value)||0),onPeakKwh=Math.max(0,parseFloat(onPeak.value)||0);if(!(demandKw>0)&&!(onPeakKwh>0)){result.textContent='Enter demand + on-peak usage';return}const powerwalls=Math.max(1,demandKw>0?Math.ceil(demandKw/11.5):1);const baseEnergy=powerwalls*405;const expansions=onPeakKwh>baseEnergy?Math.ceil((onPeakKwh-baseEnergy)/405):0;let text=`<strong>${powerwalls} Powerwall${powerwalls===1?'':'s'}</strong>`;if(expansions>0)text+=` + <strong>${expansions} Expansion${expansions===1?'':'s'}</strong>`;result.innerHTML=`Recommended: ${text}`};
  demand.addEventListener('input',calc);onPeak.addEventListener('input',calc);
 }catch(e){}
}
function applyHiddenMonthlyIncrease(d){
 try{
  const savings=d.querySelector('.slide.savings-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
  if(!savings)return;
  const entries=[...savings.querySelectorAll('.month-entry')],bill=savings.querySelector('#recentBill'),kwh=savings.querySelector('#recentKwh'),monthlyOut=savings.querySelector('#monthlyAvg');
  if(entries.length!==12||!bill||!kwh||!monthlyOut)return;
  const update=()=>{setTimeout(()=>{
   const b=parseFloat(bill.value)||0,k=parseFloat(kwh.value)||0,rate=(b>0&&k>0)?b/k:0;
   const active=savings.querySelector('.mode-toggle button.active'),mode=(active&&active.dataset.mode)||'usage';
   let baseMonthly=0;
   if(mode==='usage'){
    const annual=entries.reduce((sum,el)=>sum+(parseFloat(el.value)||0),0);
    if(annual>0&&rate>0)baseMonthly=annual*rate/12;
   }else{
    const annualBills=entries.reduce((sum,el)=>sum+(parseFloat(el.value)||0),0);
    if(annualBills>0)baseMonthly=annualBills/12;
   }
   if(baseMonthly>0){
    const adjusted=baseMonthly*1.16;
    monthlyOut.textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(adjusted);
    const graphLabel=savings.querySelector('.graph-label');if(graphLabel)graphLabel.textContent='WITHOUT SOLAR • '+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(adjusted)+'/MO';
   }
  },25)};
  if(!savings.dataset.hidden16Bound){
   savings.dataset.hidden16Bound='1';
   [...entries,bill,kwh].forEach(el=>el.addEventListener('input',update));
   savings.querySelectorAll('.mode-toggle button').forEach(btn=>btn.addEventListener('click',update));
  }
  update();
 }catch(e){}
}
function updateMovingSlide(d){
 try{
  const moving=d.querySelector('.slide.move')||[...d.querySelectorAll('.slide')].find(s=>/Moving with Solar|What happens if I move\?/i.test(s.textContent||''));
  if(!moving)return;
  const title=moving.querySelector('.title,h1');if(title)title.textContent='What happens if I move?';
  const list=moving.querySelector('ul');
  if(list)list.innerHTML='<li><strong>It stays with the home.</strong> Nothing has to be removed or moved with you.</li><li><strong>The new homeowner simply calls us and transfers the power agreement into their name</strong> — similar to putting the utility bill in their name.</li><li><strong>It does not complicate the move.</strong> The home simply keeps its lower-cost way of getting power.</li><li><strong>Battery backup + a lower power bill are strong selling features</strong> that can make the home more attractive to buyers.</li>';
 }catch(e){}
}
function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function patch(){try{const docs=walkDocs(base.contentDocument,[]);docs.forEach(addSimpleTools);docs.forEach(applyHiddenMonthlyIncrease);docs.forEach(updateMovingSlide)}catch(e){}resize()}
base.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500)});setInterval(patch,1500);window.addEventListener('resize',()=>setTimeout(resize,120));
</script>
</body>
</html>
