<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Daddy's Sales Deck</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;min-height:100%}
#base{display:block;width:100%;height:22000px;border:0;background:#000;visibility:hidden}
</style>
</head>
<body>
<iframe id="base" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const BUILD='20260715-stable-4';
const base=document.getElementById('base');
base.src='../combined-v5/?build='+BUILD;
let resizeTimer=0;
let patched=false;

function getDeck(){
 try{
  const docs=[];
  let doc=base.contentDocument;
  while(doc){
   docs.push(doc);
   const frame=doc.getElementById('base');
   if(!frame||!frame.contentDocument)break;
   doc=frame.contentDocument;
  }
  const outer=docs[docs.length-1];
  const deckFrame=outer&&outer.getElementById('deckFrame');
  const deck=deckFrame&&deckFrame.contentDocument;
  return{docs,deckFrame,deck};
 }catch(e){return{}}
}

function setHeight(frame,height){
 const next=Math.ceil(height||0);
 const current=parseInt(frame.style.height,10)||0;
 if(next>0&&Math.abs(next-current)>4)frame.style.height=next+'px';
}

function resizeAll(ctx){
 try{
  const{docs,deckFrame,deck}=ctx;
  if(deckFrame&&deck)setHeight(deckFrame,deck.documentElement.scrollHeight);
  if(docs){
   for(let i=docs.length-1;i>0;i--){
    const frame=docs[i-1].getElementById('base');
    if(frame)setHeight(frame,docs[i].documentElement.scrollHeight);
   }
  }
  if(base.contentDocument)setHeight(base,base.contentDocument.documentElement.scrollHeight);
 }catch(e){}
}

function patchDeck(){
 const ctx=getDeck();
 const d=ctx.deck;
 if(!d)return false;

 if(!d.getElementById('stableLiveDeckV12')){
  const style=d.createElement('style');
  style.id='stableLiveDeckV12';
  style.textContent=`
   .installer-links{aspect-ratio:16/9!important;height:auto!important;min-height:0!important;padding:0!important;overflow:hidden!important}
   .installer-links .installer-shell{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:grid!important;grid-template-rows:64% 36%!important;overflow:hidden!important}
   .installer-links .installer-top{min-height:0!important;overflow:hidden!important;padding:2.25% 3.4% .7%!important}
   .installer-links .installer-head{gap:1.6%!important}
   .installer-links h1{font-size:clamp(28px,3.55vw,55px)!important;line-height:1!important}
   .installer-links .installer-mark{width:6.2%!important;border-width:4px!important}
   .installer-links .credential-grid{min-height:0!important;margin-top:1.15%!important;gap:.75%!important}
   .installer-links .credential-btn{min-height:0!important;padding:2.3%!important;border-radius:11px!important}
   .installer-links .credential-logo small{margin-top:4%!important}
   .installer-links .tap-note{margin-top:.35%!important;font-size:clamp(8px,.62vw,10px)!important}
   .installer-links .az-facts{min-height:0!important;overflow:hidden!important;padding:1% 3.2% 1.25%!important;justify-content:center!important}
   .installer-links .az-facts-title{margin-bottom:.65%!important;font-size:clamp(12px,1.15vw,18px)!important;line-height:1.05!important}
   .installer-links .fact-grid{gap:.65%!important;min-height:0!important}
   .installer-links .fact-card{min-height:0!important;padding:3% 2.2%!important;border-radius:10px!important}
   .installer-links .fact-icon{font-size:clamp(16px,1.55vw,24px)!important;margin-bottom:2.5%!important}
   .installer-links .fact-card strong{font-size:clamp(10px,1vw,16px)!important;line-height:1.02!important}
   .installer-links .fact-card span{margin-top:3%!important;font-size:clamp(7px,.56vw,9px)!important;line-height:1.12!important}
   .savings-graph{opacity:.3!important;transform:none!important;visibility:visible!important;transition:opacity .2s ease!important}
   .savings-graph.chart-ready{opacity:1!important}
   .savings-graph .graph-red{transition:height .25s ease,clip-path .25s ease!important}
   .savings-graph .graph-yellow{transition:width .25s ease!important}
   .aurora-transition .aurora-live-shell{grid-template-rows:10% minmax(0,1fr) 6%!important}
   .aurora-recommendation-bar{grid-row:3!important;min-height:0!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;background:#fff!important;border-top:1px solid #d8dde5!important;box-shadow:0 -5px 14px rgba(20,43,73,.07)!important;z-index:5!important;color:#162b47!important}
   .aurora-recommendation-item{min-width:0!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:.55em!important;padding:0 1em!important;text-align:left!important}
   .aurora-recommendation-item+.aurora-recommendation-item{border-left:1px solid #e0e5ec!important}
   .aurora-recommendation-label{font-size:clamp(8px,.62vw,11px)!important;line-height:1!important;font-weight:900!important;color:#708096!important;white-space:nowrap!important}
   .aurora-recommendation-value{font-size:clamp(12px,1.05vw,17px)!important;line-height:1!important;font-weight:950!important;color:#174f91!important;white-space:nowrap!important}
   .aurora-recommendation-value small{display:block!important;margin-top:2px!important;font-size:clamp(6px,.48vw,8px)!important;line-height:1!important;font-weight:750!important;color:#8491a1!important}

   .maintenance.support-page{padding:3.1% 4.5%!important;background:linear-gradient(145deg,#f7fbff,#eaf3ff)!important;color:#162b47!important}
   .maintenance.support-page h1{margin:0 0 1.5%!important;font-size:clamp(30px,4vw,62px)!important;line-height:1!important;color:#172b48!important}
   .maintenance.support-page .maint-grid{height:81%!important;display:grid!important;grid-template-columns:36% minmax(0,1fr)!important;gap:2.3%!important;align-items:stretch!important}
   .maintenance.support-page .maint-list{min-height:0!important;display:grid!important;align-content:center!important;gap:6%!important;padding:2% 3% 2% 1%!important;font-size:clamp(13px,1.5vw,23px)!important;line-height:1.18!important;color:#4c617d!important}
   .maintenance.support-page .maint-list div{display:flex!important;align-items:flex-start!important;gap:.7em!important}
   .maintenance.support-page .maint-list div:before{content:'✓'!important;display:grid!important;place-items:center!important;flex:0 0 auto!important;width:1.55em!important;height:1.55em!important;margin:0!important;border-radius:50%!important;background:#dcecff!important;color:#1760b5!important;font-size:.78em!important;font-weight:950!important}
   .support-hub{width:100%!important;height:100%!important;margin:0!important;border:1px solid #cbd9e9!important;border-radius:24px!important;background:#fff!important;color:#162b47!important;box-shadow:0 18px 38px rgba(31,67,113,.14)!important;padding:3%!important;display:grid!important;grid-template-rows:auto minmax(0,1fr) auto auto!important;gap:2.2%!important;overflow:hidden!important;place-items:stretch!important;align-items:stretch!important;justify-items:stretch!important}
   .support-hub-head{width:100%!important;display:flex!important;align-items:flex-end!important;justify-content:space-between!important;gap:1em!important}
   .support-hub-head strong{font-size:clamp(18px,2vw,31px)!important;line-height:1!important;color:#174f91!important}
   .support-hub-head span{font-size:clamp(8px,.72vw,11px)!important;line-height:1.2!important;font-weight:800!important;color:#75869a!important;text-align:right!important}
   .support-contact-grid{width:100%!important;height:100%!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:2%!important;min-height:0!important}
   .support-contact{min-width:0!important;display:flex!important;flex-direction:column!important;justify-content:center!important;padding:5% 6%!important;border:1px solid #dbe5f0!important;border-radius:15px!important;background:#f6faff!important;color:#17375f!important;text-decoration:none!important;box-shadow:0 7px 16px rgba(26,55,91,.07)!important;transition:transform .15s ease,background .15s ease,border-color .15s ease!important}
   .support-contact:active{transform:scale(.98)!important;background:#eaf3ff!important;border-color:#8db9eb!important}
   .support-contact-name{font-size:clamp(10px,.95vw,15px)!important;line-height:1!important;font-weight:950!important;color:#526b88!important}
   .support-contact-phone{display:block!important;margin-top:4%!important;font-size:clamp(17px,1.8vw,28px)!important;line-height:1!important;font-weight:950!important;color:#174f91!important;letter-spacing:-.025em!important}
   .support-contact-purpose{display:block!important;margin-top:4%!important;font-size:clamp(7px,.62vw,10px)!important;line-height:1.15!important;font-weight:750!important;color:#7a899b!important}
   .support-text-button{width:100%!important;border:0!important;border-radius:13px!important;padding:2.6% 3%!important;background:#174f91!important;color:#fff!important;font-size:clamp(11px,1.05vw,17px)!important;line-height:1!important;font-weight:950!important;cursor:pointer!important;box-shadow:0 9px 20px rgba(23,79,145,.22)!important}
   .support-text-button:active{transform:scale(.99)!important;background:#123b74!important}
   .support-emergency{font-size:clamp(7px,.58vw,9px)!important;line-height:1.15!important;font-weight:800!important;color:#7c8796!important;text-align:center!important}
   @media(max-width:760px){.aurora-recommendation-item{padding:0 .45em!important;gap:.25em!important}.aurora-recommendation-label{white-space:normal!important}.aurora-recommendation-value{font-size:clamp(9px,2.1vw,13px)!important}.maintenance.support-page{padding:2.5% 3.2%!important}.maintenance.support-page .maint-grid{grid-template-columns:34% minmax(0,1fr)!important;gap:1.3%!important}.support-hub{border-radius:15px!important;padding:2.2%!important}.support-contact{padding:3.5% 4%!important;border-radius:10px!important}.support-hub-head span{display:none!important}}
  `;
  d.head.appendChild(style);
 }

 const installer=[...d.querySelectorAll('.slide')].find(s=>/Arizona.?s Largest Installer/i.test(s.textContent||'')&&/1000\+ installs/i.test(s.textContent||''));
 if(installer){
  installer.classList.add('installer-links');
  installer.style.removeProperty('aspect-ratio');
  installer.style.removeProperty('height');
  installer.style.removeProperty('min-height');
  installer.style.removeProperty('padding-bottom');
  const shell=installer.querySelector('.installer-shell');
  if(shell){
   shell.style.removeProperty('grid-template-rows');
   shell.style.removeProperty('height');
  }
 }

 const maintenance=[...d.querySelectorAll('.slide')].find(s=>/Maintenance and Monitoring/i.test(s.textContent||''));
 if(maintenance&&!maintenance.dataset.supportHubReady){
  maintenance.classList.add('support-page');
  const phone=maintenance.querySelector('.phone');
  if(phone){
   phone.className='phone support-hub';
   phone.innerHTML=`<div class="support-hub-head"><strong>Home Energy Support</strong><span>Tap any number to call<br>or send all contacts by text.</span></div><div class="support-contact-grid"><a class="support-contact" href="tel:+16238505700"><span class="support-contact-name">Our World Energy</span><span class="support-contact-phone">(623) 850-5700</span><span class="support-contact-purpose">Installation, monitoring and service</span></a><a class="support-contact" href="tel:+18335863677"><span class="support-contact-name">Enfin Support</span><span class="support-contact-phone">(833) 586-3677</span><span class="support-contact-purpose">Financing and account support</span></a><a class="support-contact" href="tel:+18553391831"><span class="support-contact-name">Palmetto LightReach</span><span class="support-contact-phone">(855) 339-1831</span><span class="support-contact-purpose">Welcome call and account support</span></a><a class="support-contact" href="tel:+18445626725"><span class="support-contact-name">GoodLeap Support</span><span class="support-contact-phone">(844) 562-6725</span><span class="support-contact-purpose">Loan, payment and account support</span></a></div><button class="support-text-button" id="textCustomerSupport" type="button">Text Support Info to Customer</button><div class="support-emergency">Power outage or electrical emergency: contact the local utility first. Call 911 for immediate danger.</div>`;
  }
  const textButton=maintenance.querySelector('#textCustomerSupport');
  if(textButton){
   textButton.addEventListener('click',()=>{
    const view=d.defaultView||window;
    const entered=view.prompt('Enter the customer mobile number:','');
    if(!entered)return;
    const digits=entered.replace(/\D/g,'');
    if(digits.length<10||digits.length>15){view.alert('Please enter a valid customer mobile number.');return}
    const message=`Here are your solar support contacts:\n\nOur World Energy — installation, monitoring & service: (623) 850-5700\nEnfin — financing & account support: (833) 586-3677\nPalmetto LightReach — welcome call & account support: (855) 339-1831\nGoodLeap — loan, payment & account support: (844) 562-6725\n\nFor a utility outage, contact your electric utility directly. Save this message for future reference.`;
    const isIOS=/iPad|iPhone|iPod/i.test(view.navigator.userAgent)||(view.navigator.platform==='MacIntel'&&view.navigator.maxTouchPoints>1);
    const link=d.createElement('a');
    link.href='sms:'+digits+(isIOS?'&':'?')+'body='+encodeURIComponent(message);
    link.target='_top';
    link.style.display='none';
    d.body.appendChild(link);
    link.click();
    link.remove();
   });
  }
  maintenance.dataset.supportHubReady='1';
 }

 const aurora=d.querySelector('.aurora-transition');
 if(aurora){
  const shell=aurora.querySelector('.aurora-live-shell');
  if(shell&&!shell.querySelector('#auroraRecommendationBar')){
   const bar=d.createElement('div');
   bar.id='auroraRecommendationBar';
   bar.className='aurora-recommendation-bar';
   bar.innerHTML=`<div class="aurora-recommendation-item"><span class="aurora-recommendation-label">Annual Usage</span><span class="aurora-recommendation-value" id="recommendedAnnualUsage">—<small>From utility inputs</small></span></div><div class="aurora-recommendation-item"><span class="aurora-recommendation-label">Recommended Batteries</span><span class="aurora-recommendation-value" id="recommendedBatteryCount">—<small>11.5 kWh each</small></span></div><div class="aurora-recommendation-item"><span class="aurora-recommendation-label">Recommended Panels</span><span class="aurora-recommendation-value" id="recommendedPanelCount">—<small>400W backup/recharge</small></span></div>`;
   shell.appendChild(bar);
  }
 }

 const savings=[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
 if(savings&&!savings.dataset.stableOutputsBound){
  const graph=savings.querySelector('.savings-graph');
  const entries=[...savings.querySelectorAll('.month-entry')];
  const bill=savings.querySelector('#recentBill');
  const kwh=savings.querySelector('#recentKwh');
  const red=graph&&graph.querySelector('.graph-red');
  const yellow=graph&&graph.querySelector('.graph-yellow');
  const label=graph&&graph.querySelector('.graph-label');
  const annualOutput=d.getElementById('recommendedAnnualUsage');
  const batteryOutput=d.getElementById('recommendedBatteryCount');
  const panelOutput=d.getElementById('recommendedPanelCount');

  const getUtilityData=()=>{
   const values=entries.map(el=>parseFloat(el.value)||0);
   const b=parseFloat((bill||{}).value)||0;
   const k=parseFloat((kwh||{}).value)||0;
   const rate=b>0&&k>0?b/k:0;
   const mode=(savings.querySelector('.mode-toggle button.active')||{}).dataset?.mode||'usage';
   let annual=0;
   let monthly=0;
   if(mode==='usage'){
    annual=values.reduce((a,v)=>a+v,0);
    if(annual>0&&rate>0)monthly=annual*(rate+.16)/12;
   }else{
    const annualBills=values.reduce((a,v)=>a+v,0);
    annual=rate>0?annualBills/rate:0;
    if(annualBills>0&&rate>0)monthly=(annualBills+annual*.16)/12;
   }
   return{values,b,k,annual,monthly};
  };

  const updateOutputs=()=>{
   const data=getUtilityData();
   if(graph){
    const hasInput=data.values.some(v=>v>0)||data.b>0||data.k>0;
    graph.classList.toggle('chart-ready',hasInput);
    if(data.monthly>0){
     const intensity=Math.max(0,Math.min(1,(data.monthly-100)/650));
     if(red)red.style.height=(68+intensity*14)+'%';
     if(yellow)yellow.style.width=(62+intensity*5)+'%';
     if(label)label.textContent='WITHOUT SOLAR • '+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(data.monthly)+'/MO';
    }
   }

   if(!annualOutput||!batteryOutput||!panelOutput)return;
   if(!(data.annual>0)){
    annualOutput.firstChild.nodeValue='—';
    batteryOutput.firstChild.nodeValue='—';
    panelOutput.firstChild.nodeValue='—';
    return;
   }
   const batteries=Math.max(1,Math.ceil(data.annual/30000));
   const panels=batteries*4;
   annualOutput.firstChild.nodeValue=Math.round(data.annual).toLocaleString()+' kWh';
   batteryOutput.firstChild.nodeValue=batteries+' '+(batteries===1?'battery':'batteries');
   panelOutput.firstChild.nodeValue=panels+' panels';
  };

  [...entries,bill,kwh].filter(Boolean).forEach(el=>el.addEventListener('input',updateOutputs));
  savings.querySelectorAll('.mode-toggle button').forEach(btn=>btn.addEventListener('click',()=>setTimeout(updateOutputs,0)));
  savings.dataset.stableOutputsBound='1';
  updateOutputs();
 }

 patched=true;
 resizeAll(ctx);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeAll(getDeck());base.style.visibility='visible'}));
 return true;
}

function waitForDeck(attempt=0){
 if(patchDeck())return;
 if(attempt<60)setTimeout(()=>waitForDeck(attempt+1),100);
 else base.style.visibility='visible';
}

base.addEventListener('load',()=>waitForDeck(),{once:true});
setTimeout(()=>waitForDeck(),100);
window.addEventListener('resize',()=>{
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{if(patched)resizeAll(getDeck())},180);
},{passive:true});
setTimeout(()=>{base.style.visibility='visible'},7000);
</script>
</body>
</html>
