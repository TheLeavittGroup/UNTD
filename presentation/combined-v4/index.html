<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000}#base{display:block;width:100%;height:16000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" src="../combined-v3/" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
function resize(){try{base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function install(){
 const v3=base.contentDocument;if(!v3)return;
 const v2Frame=v3.getElementById('base');if(!v2Frame)return;
 const patch=()=>{
  const v2=v2Frame.contentDocument;if(!v2)return;
  const outerFrame=v2.getElementById('base');if(!outerFrame)return;
  const patchOuter=()=>{
   const outer=outerFrame.contentDocument;if(!outer)return;
   const deckFrame=outer.getElementById('deckFrame');if(!deckFrame)return;
   const apply=()=>{
    const d=deckFrame.contentDocument;if(!d)return;
    const options=[...d.querySelectorAll('.slide')].find(s=>/The Options/i.test(s.textContent||'')&&/Have Your Own Grid/i.test(s.textContent||''));
    if(options){
     const style=d.createElement('style');
     style.textContent=`
       .options-upgrade .option{padding:1.8% 2.35%!important;position:relative!important;overflow:visible!important}
       .options-upgrade .option-list{gap:2.25%!important}
       .options-upgrade .option-item{font-size:clamp(12px,1.18vw,19px)!important;line-height:1.18!important}
       .options-upgrade .option-pain{margin-top:6%!important;padding:3.2% 4%!important}
       .options-upgrade .option.solar .option-pain{transform:translateY(5%)}
       .choice-mascot{position:absolute;left:-4%;right:auto;top:auto;bottom:-3.5%;z-index:8;display:flex;align-items:flex-end;gap:.45em;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));pointer-events:none}
       .choice-face{width:clamp(48px,5vw,76px);height:clamp(48px,5vw,76px);border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,3.2vw,50px);background:#fff;border:3px solid rgba(255,255,255,.9)}
       .choice-bubble{position:relative;padding:.55em .8em;border-radius:16px;background:#fff;color:#13243a;font-size:clamp(11px,1vw,16px);font-weight:950;white-space:nowrap;border:2px solid rgba(19,36,58,.12);margin-bottom:18%}
       .choice-bubble:after{content:"";position:absolute;left:-9px;bottom:9px;border-width:7px 10px 7px 0;border-style:solid;border-color:transparent #fff transparent transparent}
       .choice-mascot.dev{left:auto;right:-4%;top:auto;bottom:-3.5%;flex-direction:row-reverse}
       .choice-mascot.dev .choice-bubble{background:#fff0f0;color:#7f1717;border-color:rgba(127,23,23,.16)}
       .choice-mascot.dev .choice-bubble:after{left:auto;right:-9px;border-width:7px 0 7px 10px;border-color:transparent transparent transparent #fff0f0}
       .choice-mascot.dev .choice-face{background:#ffe4e4;border-color:#fff0f0}
       @media(max-width:1100px){.choice-mascot{left:-2.5%;bottom:-2.5%}.choice-mascot.dev{left:auto;right:-2.5%;bottom:-2.5%}.choice-bubble{padding:.45em .65em;margin-bottom:14%}}
     `;
     d.head.appendChild(style);
     const solar=options.querySelector('.option.solar');
     if(solar){
       solar.innerHTML=`<div class="choice-mascot angel"><div class="choice-face">😇</div><div class="choice-bubble">Pick me!</div></div><h2>Have Your Own Grid</h2><div class="option-list"><div class="option-item"><b>✓</b><span>No cost or debt</span></div><div class="option-item"><b>✓</b><span>Buy power at a fixed price for a fraction of what your neighbors pay</span></div><div class="option-item"><b>✓</b><span>25-year price and performance guarantee</span></div><div class="option-item"><b>✓</b><span>25-year added roof, grid, and solar-system coverage for the home</span></div><div class="option-item"><b>✓</b><span>Take control of whatever the utility decides to do in the future</span></div><div class="option-item"><b>✓</b><span>Battery homes sell faster and for more</span></div><div class="option-item"><b>✓</b><span>If it doesn't work, you don't pay for it</span></div></div><div class="option-pain">Your lights and A/C stay on—and your food stays cold when the grid goes down.</div>`;
     }
     const stay=options.querySelector('.option.stay');
     if(stay&&!stay.querySelector('.choice-mascot')){
       stay.insertAdjacentHTML('afterbegin','<div class="choice-mascot dev"><div class="choice-face">😈</div><div class="choice-bubble">No, pick me!</div></div>');
     }
    }

    const savings=[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
    if(savings&&!savings.querySelector('#utility25Button')){
     const calcStyle=d.createElement('style');
     calcStyle.textContent=`
       #utility25Button{width:100%;margin-top:7px;border:0;border-radius:12px;padding:10px 9px;background:#174f91;color:#fff;font-size:clamp(9px,.76vw,12px);line-height:1.15;font-weight:950;cursor:pointer;box-shadow:0 7px 16px rgba(23,79,145,.22);transition:.16s transform,.16s background}
       #utility25Button:active{transform:scale(.98)}
       #utility25Button.result{background:#123b74}
     `;
     d.head.appendChild(calcStyle);
     const oldRate=savings.querySelector('#rateResult');
     if(oldRate){
      const button=d.createElement('button');
      button.type='button';button.id='utility25Button';button.textContent='Calculate 25-Year Utility Cost';
      oldRate.replaceWith(button);
      const resetButton=()=>{button.classList.remove('result');button.textContent='Calculate 25-Year Utility Cost'};
      const dollars=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
      button.addEventListener('click',()=>{
       const entries=[...savings.querySelectorAll('.month-entry')];
       const bill=parseFloat((savings.querySelector('#recentBill')||{}).value);
       const kwh=parseFloat((savings.querySelector('#recentKwh')||{}).value);
       const current=(bill>0&&kwh>0)?bill/kwh:0;
       const mode=(savings.querySelector('.mode-toggle button.active')||{}).dataset?.mode||'usage';
       const vals=entries.map(el=>parseFloat(el.value)||0);
       let monthly=0;
       if(mode==='usage'){
        const annual=vals.reduce((a,v)=>a+v,0);
        if(!(annual>0&&current>0)){button.textContent='Enter the monthly usage and latest bill details first';return}
        monthly=annual*(current+.16)/12;
       }else{
        const annualBills=vals.reduce((a,v)=>a+v,0);
        const annual=current>0?annualBills/current:0;
        if(!(annualBills>0&&current>0)){button.textContent='Enter the monthly bills and latest bill details first';return}
        monthly=(annualBills+annual*.16)/12;
       }
       let total=0;
       for(let year=0;year<25;year++)total+=monthly*12*Math.pow(1.06,year);
       button.classList.add('result');
       button.textContent=dollars(total)+' total over 25 years';
      });
      savings.querySelectorAll('input,.mode-toggle button').forEach(el=>el.addEventListener(el.tagName==='BUTTON'?'click':'input',()=>setTimeout(resetButton,0)));
     }
    }
    setTimeout(()=>{try{outer.getElementById('deckFrame').style.height=d.documentElement.scrollHeight+'px';outerFrame.style.height=outer.documentElement.scrollHeight+'px';v2Frame.style.height=v2.documentElement.scrollHeight+'px';resize()}catch(e){}},100);
   };
   deckFrame.addEventListener('load',apply,{once:true});apply();
  };
  outerFrame.addEventListener('load',patchOuter,{once:true});patchOuter();
 };
 v2Frame.addEventListener('load',patch,{once:true});patch();
}
base.addEventListener('load',install);window.addEventListener('resize',()=>setTimeout(resize,100));
</script>
</body>
</html>
