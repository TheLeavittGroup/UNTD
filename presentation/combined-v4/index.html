<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000}#base{display:block;width:100%;height:18000px;border:0;background:#000;visibility:hidden}</style>
</head>
<body>
<iframe id="base" src="../combined-v3/?v=aurora-new-project" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
const AURORA_URL='https://v2.aurorasolar.com/new-project';
let resizeTimer=0;
function setHeight(frame,height){
 const next=Math.ceil(height||0);
 const current=parseInt(frame.style.height,10)||0;
 if(next>0&&Math.abs(current-next)>3)frame.style.height=next+'px';
}
function resize(){
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{
  try{setHeight(base,base.contentDocument.documentElement.scrollHeight)}catch(e){}
 },60);
}
function reveal(){requestAnimationFrame(()=>requestAnimationFrame(()=>{base.style.visibility='visible'}))}
function install(){
 const v3=base.contentDocument;if(!v3){reveal();return}
 const v2Frame=v3.getElementById('base');if(!v2Frame){reveal();return}
 const patch=()=>{
  const v2=v2Frame.contentDocument;if(!v2){reveal();return}
  const outerFrame=v2.getElementById('base');if(!outerFrame){reveal();return}
  const patchOuter=()=>{
   const outer=outerFrame.contentDocument;if(!outer){reveal();return}
   const deckFrame=outer.getElementById('deckFrame');if(!deckFrame){reveal();return}
   const apply=()=>{
    const d=deckFrame.contentDocument;if(!d){reveal();return}
    const options=[...d.querySelectorAll('.slide')].find(s=>/The Options/i.test(s.textContent||'')&&/Have Your Own Grid/i.test(s.textContent||''));
    if(options){
     const style=d.createElement('style');
     style.textContent=`
       .options-upgrade .option{padding:1.8% 2.35%!important;position:relative!important;overflow:visible!important}
       .options-upgrade .option-list{gap:2.25%!important}
       .options-upgrade .option-item{font-size:clamp(12px,1.18vw,19px)!important;line-height:1.18!important}
       .options-upgrade .option-pain{margin-top:6%!important;padding:3.2% 4%!important}
       .options-upgrade .option.solar .option-pain{transform:translateY(5%)}
       .choice-mascot{position:absolute;left:-4%;right:auto;top:auto;bottom:-3.5%;z-index:8;display:flex;align-items:flex-end;gap:.45em;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));pointer-events:none}
       .choice-face{width:clamp(48px,5vw,76px);height:clamp(48px,5vw,76px);border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,3.2vw,50px);background:#fff;border:3px solid rgba(255,255,255,.9)}
       .choice-bubble{position:relative;padding:.55em .8em;border-radius:16px;background:#fff;color:#13243a;font-size:clamp(11px,1vw,16px);font-weight:950;white-space:nowrap;border:2px solid rgba(19,36,58,.12);margin-bottom:18%}
       .choice-bubble:after{content:"";position:absolute;left:-9px;bottom:9px;border-width:7px 10px 7px 0;border-style:solid;border-color:transparent #fff transparent transparent}
       .choice-mascot.dev{left:auto;right:-4%;top:auto;bottom:-3.5%;flex-direction:row-reverse}
       .choice-mascot.dev .choice-bubble{background:#fff0f0;color:#7f1717;border-color:rgba(127,23,23,.16)}
       .choice-mascot.dev .choice-bubble:after{left:auto;right:-9px;border-width:7px 0 7px 10px;border-color:transparent transparent transparent #fff0f0}
       .choice-mascot.dev .choice-face{background:#ffe4e4;border-color:#fff0f0}
       @media(max-width:1100px){.choice-mascot{left:-2.5%;bottom:-2.5%}.choice-mascot.dev{left:auto;right:-2.5%;bottom:-2.5%}.choice-bubble{padding:.45em .65em;margin-bottom:14%}}
     `;
     d.head.appendChild(style);
     const solar=options.querySelector('.option.solar');
     if(solar){
       solar.innerHTML=`<div class="choice-mascot angel"><div class="choice-face">😇</div><div class="choice-bubble">Pick me!</div></div><h2>Have Your Own Grid</h2><div class="option-list"><div class="option-item"><b>✓</b><span>No cost or debt</span></div><div class="option-item"><b>✓</b><span>Buy power at a fixed price for a fraction of what your neighbors pay</span></div><div class="option-item"><b>✓</b><span>25-year price and performance guarantee</span></div><div class="option-item"><b>✓</b><span>25-year added roof, grid, and solar-system coverage for the home</span></div><div class="option-item"><b>✓</b><span>Take control of whatever the utility decides to do in the future</span></div><div class="option-item"><b>✓</b><span>Battery homes sell faster and for more</span></div><div class="option-item"><b>✓</b><span>If it doesn't work, you don't pay for it</span></div></div><div class="option-pain">Your lights and A/C stay on—and your food stays cold when the grid goes down.</div>`;
     }
     const stay=options.querySelector('.option.stay');
     if(stay&&!stay.querySelector('.choice-mascot')){
       stay.insertAdjacentHTML('afterbegin','<div class="choice-mascot dev"><div class="choice-face">😈</div><div class="choice-bubble">No, pick me!</div></div>');
     }

     let aurora=d.querySelector('.aurora-transition');
     if(!aurora){
      aurora=d.createElement('section');
      aurora.className='slide aurora-transition';
      options.insertAdjacentElement('afterend',aurora);
     }
     if(!d.getElementById('auroraLiveStyles')){
      const auroraStyle=d.createElement('style');
      auroraStyle.id='auroraLiveStyles';
      auroraStyle.textContent=`
       .aurora-transition{padding:0!important;background:#f4f4f6!important;color:#111!important;overflow:hidden!important}
       .aurora-live-shell{position:absolute;inset:0;background:#f4f4f6;display:grid;grid-template-rows:10% 1fr}
       .aurora-live-top{display:flex;align-items:center;justify-content:space-between;gap:2%;padding:0 2.4%;background:#fff;border-bottom:1px solid #d9d9df;box-shadow:0 4px 15px rgba(0,0,0,.08);z-index:3}
       .aurora-live-title strong{display:block;font-size:clamp(16px,1.55vw,25px);color:#18181d}
       .aurora-live-title span{display:block;margin-top:2px;font-size:clamp(10px,.82vw,14px);font-weight:750;color:#70707a}
       .aurora-live-open{display:inline-flex;align-items:center;gap:.5em;padding:.72em 1.05em;border-radius:999px;background:#86155f;color:#fff!important;text-decoration:none;font-size:clamp(11px,1vw,16px);font-weight:950;box-shadow:0 8px 22px rgba(134,21,95,.24);white-space:nowrap}
       .aurora-live-open:after{content:'↗'}
       .aurora-live-stage{position:relative;min-height:0;background:#fff}
       .aurora-live-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
       .aurora-live-help{position:absolute;left:2%;bottom:2%;z-index:4;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.96);border:1px solid #d5d5dc;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:clamp(9px,.72vw,12px);font-weight:800;color:#5d5d67}
       .aurora-live-help a{color:#86155f!important;font-weight:950;text-decoration:underline}
       .aurora-sizing-strip{width:100%;min-height:84px;margin:0 0 12px;background:#fff;border-top:1px solid #d9d9df;border-bottom:1px solid #d9d9df;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 8px 20px rgba(0,0,0,.09);color:#15243a}
       .aurora-size-cell{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 22px;text-align:left}
       .aurora-size-cell+.aurora-size-cell{border-left:1px solid #dde3ea}
       .aurora-size-label{font-size:clamp(10px,.82vw,14px);font-weight:850;color:#68798d;white-space:nowrap}
       .aurora-size-value{font-size:clamp(18px,1.7vw,28px);font-weight:950;color:#174f91;white-space:nowrap}
       .aurora-size-value small{display:block;margin-top:2px;font-size:clamp(8px,.62vw,11px);font-weight:750;color:#7a8796}
       @media(max-width:760px){.aurora-sizing-strip{min-height:72px}.aurora-size-cell{padding:12px 9px;gap:6px;flex-direction:column;align-items:flex-start}.aurora-size-cell+.aurora-size-cell{border-left:1px solid #dde3ea}.aurora-size-label{white-space:normal}}
      `;
      d.head.appendChild(auroraStyle);
     }
     aurora.innerHTML=`<div class="aurora-live-shell"><header class="aurora-live-top"><div class="aurora-live-title"><strong>Create the Homeowner's Aurora Project</strong><span>Enter the property address, confirm Residential, name the project, and create it.</span></div><a class="aurora-live-open" href="${AURORA_URL}" target="_blank" rel="noopener noreferrer">Open Aurora New Project</a></header><div class="aurora-live-stage"><iframe class="aurora-live-frame" src="${AURORA_URL}" title="Aurora Solar New Project" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="aurora-live-help">Aurora may block its logged-in workspace from displaying inside another website. <a href="${AURORA_URL}" target="_blank" rel="noopener noreferrer">Open the New Project page directly</a>.</div></div></div>`;

     let sizing=d.querySelector('.aurora-sizing-strip');
     if(!sizing){
      sizing=d.createElement('section');
      sizing.className='aurora-sizing-strip';
      sizing.innerHTML=`<div class="aurora-size-cell"><span class="aurora-size-label">Annual Usage</span><span class="aurora-size-value" id="auroraAnnualResult">—<small>Calculated from utility inputs</small></span></div><div class="aurora-size-cell"><span class="aurora-size-label">Battery Count</span><span class="aurora-size-value" id="auroraBatteryResult">—<small>11.5 kWh batteries</small></span></div><div class="aurora-size-cell"><span class="aurora-size-label">Panel Count</span><span class="aurora-size-value" id="auroraPanelResult">—<small>400W backup/recharge panels</small></span></div>`;
      aurora.insertAdjacentElement('afterend',sizing);
     }
    }

    const savings=[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
    const updateSizing=()=>{
     if(!savings)return;
     const entries=[...savings.querySelectorAll('.month-entry')];
     const bill=parseFloat((savings.querySelector('#recentBill')||{}).value);
     const kwh=parseFloat((savings.querySelector('#recentKwh')||{}).value);
     const current=(bill>0&&kwh>0)?bill/kwh:0;
     const mode=(savings.querySelector('.mode-toggle button.active')||{}).dataset?.mode||'usage';
     const vals=entries.map(el=>parseFloat(el.value)||0);
     let annual=0;
     if(mode==='usage')annual=vals.reduce((a,v)=>a+v,0);
     else annual=current>0?vals.reduce((a,v)=>a+v,0)/current:0;
     const annualEl=d.getElementById('auroraAnnualResult');
     const batteryEl=d.getElementById('auroraBatteryResult');
     const panelEl=d.getElementById('auroraPanelResult');
     if(!annualEl||!batteryEl||!panelEl)return;
     if(!(annual>0)){
      annualEl.firstChild.nodeValue='—';batteryEl.firstChild.nodeValue='—';panelEl.firstChild.nodeValue='—';return;
     }
     const batteries=Math.max(1,Math.ceil(annual/30000));
     const panels=batteries*4;
     annualEl.firstChild.nodeValue=Math.round(annual).toLocaleString()+' kWh';
     batteryEl.firstChild.nodeValue=String(batteries);
     panelEl.firstChild.nodeValue=String(panels);
    };

    if(savings&&!savings.querySelector('#utility25Button')){
     const calcStyle=d.createElement('style');
     calcStyle.textContent=`
       #utility25Button{width:100%;margin-top:7px;border:0;border-radius:12px;padding:10px 9px;background:#174f91;color:#fff;font-size:clamp(9px,.76vw,12px);line-height:1.15;font-weight:950;cursor:pointer;box-shadow:0 7px 16px rgba(23,79,145,.22);transition:.16s transform,.16s background}
       #utility25Button:active{transform:scale(.98)}
       #utility25Button.result{background:#123b74}
     `;
     d.head.appendChild(calcStyle);
     const oldRate=savings.querySelector('#rateResult');
     if(oldRate){
      const button=d.createElement('button');
      button.type='button';button.id='utility25Button';button.textContent='Total 25-Year Utility Cost';
      oldRate.replaceWith(button);
      const resetButton=()=>{button.classList.remove('result');button.textContent='Total 25-Year Utility Cost'};
      const dollars=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
      button.addEventListener('click',()=>{
       const entries=[...savings.querySelectorAll('.month-entry')];
       const bill=parseFloat((savings.querySelector('#recentBill')||{}).value);
       const kwh=parseFloat((savings.querySelector('#recentKwh')||{}).value);
       const current=(bill>0&&kwh>0)?bill/kwh:0;
       const mode=(savings.querySelector('.mode-toggle button.active')||{}).dataset?.mode||'usage';
       const vals=entries.map(el=>parseFloat(el.value)||0);
       let monthly=0;
       if(mode==='usage'){
        const annual=vals.reduce((a,v)=>a+v,0);
        if(!(annual>0&&current>0)){button.textContent='Enter the monthly usage and latest bill details first';return}
        monthly=annual*(current+.16)/12;
       }else{
        const annualBills=vals.reduce((a,v)=>a+v,0);
        const annual=current>0?annualBills/current:0;
        if(!(annualBills>0&&current>0)){button.textContent='Enter the monthly bills and latest bill details first';return}
        monthly=(annualBills+annual*.16)/12;
       }
       let total=0;
       for(let year=0;year<25;year++)total+=monthly*12*Math.pow(1.06,year);
       button.classList.add('result');
       button.textContent=dollars(total)+' total over 25 years';
      });
      savings.querySelectorAll('input,.mode-toggle button').forEach(el=>el.addEventListener(el.tagName==='BUTTON'?'click':'input',()=>setTimeout(()=>{resetButton();updateSizing()},0)));
     }
    }else if(savings){
     savings.querySelectorAll('input,.mode-toggle button').forEach(el=>el.addEventListener(el.tagName==='BUTTON'?'click':'input',()=>setTimeout(updateSizing,0)));
    }
    updateSizing();

    setTimeout(()=>{
     try{
      setHeight(deckFrame,d.documentElement.scrollHeight);
      setHeight(outerFrame,outer.documentElement.scrollHeight);
      setHeight(v2Frame,v2.documentElement.scrollHeight);
      resize();
      setTimeout(reveal,120);
     }catch(e){reveal()}
    },220);
   };
   deckFrame.addEventListener('load',apply,{once:true});apply();
  };
  outerFrame.addEventListener('load',patchOuter,{once:true});patchOuter();
 };
 v2Frame.addEventListener('load',patch,{once:true});patch();
}
base.addEventListener('load',install,{once:true});
window.addEventListener('resize',resize,{passive:true});
setTimeout(reveal,2500);
</script>
</body>
</html>
