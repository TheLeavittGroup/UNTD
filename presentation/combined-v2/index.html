<!doctype html>
<html lang="en">
<head>

<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000}#base{display:block;width:100%;height:16000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" src="../combined/" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
function resize(){try{base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function install(){
  const outer=base.contentDocument;if(!outer)return;

  const enhance=()=>{
    const d=deckFrame.contentDocument;if(!d)return;
    const slide=[...d.querySelectorAll('.slide')].find(s=>/The Power of Net Metering/i.test(s.textContent||''));
    if(!slide)return;
    const style=d.createElement('style');
    style.textContent=`
      .net-simple{padding:0!important;background:linear-gradient(145deg,#edf6ff,#dcecff 56%,#f8fbff)!important;color:#12233d}.net-simple-shell{position:absolute;inset:0;padding:4% 4.3%;display:flex;flex-direction:column}.net-simple h1{font-size:clamp(42px,5vw,78px);line-height:.95;letter-spacing:-.05em;margin:0;color:#132a4d}.simple-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 14% 1fr;gap:2.3%;align-items:center;margin-top:4%}.simple-card{height:100%;border-radius:30px;background:rgba(255,255,255,.96);border:1px solid #cbd9ea;box-shadow:0 18px 38px rgba(31,67,113,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7% 6%}.simple-card.buy{background:linear-gradient(155deg,#fff,#edf9ef)}.simple-icon{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;background:#e7f1ff;color:#1c55ad;font-size:45px;font-weight:900;margin-bottom:5%}.buy .simple-icon{background:#e5f4e7;color:#28783a}.simple-card h2{font-size:clamp(28px,3vw,48px);line-height:1.02;letter-spacing:-.03em;margin:0;color:#17375f;max-width:92%}.simple-label{margin-top:7%;font-size:clamp(13px,1.15vw,18px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#657b98}.simple-rate{margin-top:1%;font-size:clamp(62px,7vw,108px);line-height:.88;font-weight:900;color:#1852aa}.buy .simple-rate{color:#27823d}.simple-unit{font-size:clamp(17px,1.5vw,24px);font-weight:800;color:#344b68;margin-top:2%}.simple-note{font-size:clamp(14px,1.3vw,21px);line-height:1.3;color:#526985;margin-top:5%;max-width:92%}.battery-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#345b8c}.battery-orb{width:100%;aspect-ratio:1;border-radius:32%;background:linear-gradient(145deg,#1d4f96,#0d2d5e);display:grid;place-items:center;box-shadow:0 18px 36px rgba(14,48,101,.23)}.battery-orb svg{width:72%;height:72%}.battery-center strong{display:block;margin-top:18%;font-size:clamp(15px,1.       .installer-links{padding:0!important;background:#fff!important;color:#111}.installer-shell{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) 30%;overflow:hidden}.installer-top{padding:3.2% 4.3% 1.6%;display:flex;flex-direction:column;min-height:0}.installer-head{display:flex;align-items:center;gap:2.2%}.installer-mark{width:7%;aspect-ratio:1;border:5px solid #111;border-radius:50%;display:grid;place-items:center;font-size:clamp(17px,2.1vw,31px);font-weight:950;flex:0 0 auto}.installer-links h1{font-size:clamp(32px,4vw,62px);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:900}.installer-links h1 strong{text-decoration:underline}.credential-grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:1.25%;margin-top:2.2%;min-height:0}.credential-btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#17375f;border:2px solid #d6dfeb;border-radius:18px;background:#fff;box-shadow:0 10px 24px rgba(24,54,91,.1);padding:5%;transition:.18s transform,.18s box-shadow,.18s border-color;overflow:hidden;min-width:0}.credential-btn:active{transform:scale(.97);box-shadow:0 7px 16px rgba(24,54,91,.14);border-color:#2258c7}.credential-logo{width:100%;font-weight:950;line-height:1.02}.credential-logo small{display:block;margin-top:7%;font-size:clamp(8px,.72vw,12px);font-weight:800;letter-spacing:.03em;color:#65758b}.google-word{font-size:clamp(19px,2vw,32px);letter-spacing:-.06em}.google-word span:nth-child(1),.google-word span:nth-child(4){color:#4285f4}.google-word span:nth-child(2),.google-word span:nth-child(6){color:#ea4335}.google-word span:nth-child(3){color:#fbbc05}.google-word span:nth-child(5){color:#34a853}.stars{display:block;margin-top:5%;font-size:clamp(14px,1.45vw,23px);color:#f5c400;letter-spacing:.02em}.stars b{color:#2458b7;margin-left:3%;font-size:.78em}.top100{font-size:clamp(16px,1.75vw,28px);color:#178cc7}.top100 em{font-style:normal;color:#f0b500}.stevie{font-size:clamp(15px,1.6vw,25px);color:#75613b}.stevie b{display:block;color:#a98d45;font-size:1.2em}.inc5000{font-family:Georgia,serif;font-size:clamp(23px,2.55vw,40px);color:#111;letter-spacing:-.06em}.bbb{font-size:clamp(14px,1.55vw,25px);color:#145477}.bbb b{display:inline-block;margin-left:4%;padding:4% 6%;border-radius:9px;background:#145477;color:#fff;font-size:1.25em}.nabcep{font-size:clamp(14px,1.6vw,26px);color:#176a9d}.nabcep b{display:block;color:#d88925;font-size:1.2em}.tap-note{text-align:center;margin-top:1%;font-size:clamp(9px,.75vw,12px);font-weight:800;color:#63758a}.az-facts{position:relative;isolation:isolate;padding:2.1% 4.3% 2.5%;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-top:1px solid rgba(17,54,97,.12)}.az-facts:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(150deg,rgba(255,255,255,.84),rgba(255,255,255,.74)),linear-gradient(165deg,transparent 0 47%,#bf1e2e 47% 51%,#fed700 51% 55%,#003d77 55% 100%)}.az-facts:after{content:"★";position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);font-size:clamp(105px,13vw,205px);color:rgba(191,30,46,.09);z-index:-1}.az-facts-title{text-align:center;font-size:clamp(16px,1.55vw,25px);font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#a61725;margin-bottom:1.4%}.fact-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2%}.fact-card{min-width:0;border:1px solid rgba(31,73,122,.16);border-radius:16px;background:rgba(255,255,255,.76);backdrop-filter:blur(5px);box-shadow:0 9px 20px rgba(29,58,92,.09);padding:7% 5.5%;text-align:center}.fact-icon{font-size:clamp(21px,2.2vw,34px);line-height:1;margin-bottom:5%}.fact-card strong{display:block;font-size:clamp(13px,1.35vw,21px);line-height:1.05;color:#142d50}.fact-card span{display:block;margin-top:5%;font-size:clamp(8px,.7vw,11px);line-height:1.2;font-weight:750;color:#5a6f88}
      .savings-upgrade{padding:0!important;background:linear-gradient(180deg,#fff,#f7fbff)!important;color:#142d50}.savings-shell{position:absolute;inset:0;padding:2.5% 3.2%;display:grid;grid-template-rows:auto 31% 1fr;gap:1.6%}.savings-head{text-align:center}.savings-head h1{margin:0;font-size:clamp(30px,3.6vw,56px);line-height:1.02;font-weight:500;color:#17263a}.savings-head p{margin:.7% 0 0;font-size:clamp(13px,1.25vw,20px);font-weight:750;color:#65758a}.savings-graph{position:relative;border-radius:22px;background:linear-gradient(180deg,#f9fbfe,#edf3fa);border:1px solid #d9e2ed;overflow:hidden}.graph-red{position:absolute;left:3%;right:3%;bottom:10%;height:72%;background:#e65c40;clip-path:polygon(0 82%,100% 5%,100% 100%,0 100%)}.graph-yellow{position:absolute;left:3%;bottom:10%;width:65%;height:17%;border-radius:6px;background:#f6c238;color:#fff;font-size:clamp(14px,1.75vw,27px);font-weight:950;display:grid;place-items:center;box-shadow:0 8px 18px rgba(122,85,0,.18)}.graph-label{position:absolute;right:4%;top:9%;font-size:clamp(12px,1.1vw,18px);font-weight:900;color:#c84d38}.calc-zone{display:grid;grid-template-columns:32% 27% 1fr;gap:1.4%;min-height:0}.input-card,.monthly-card,.future-card{border-radius:22px;background:#fff;border:1px solid #d6e0ec;box-shadow:0 12px 28px rgba(26,55,91,.1);padding:5%;min-height:0}.input-card{display:flex;flex-direction:column;justify-content:center}.input-title{font-size:clamp(13px,1.2vw,19px);font-weight:950;color:#234d85;margin-bottom:4%}.input-row{display:grid;grid-template-columns:1fr;gap:7px}.input-row label{display:block;font-size:clamp(10px,.8vw,13px);font-weight:850;color:#5d718a}.input-row input{width:100%;margin-top:4px;border:1px solid #cbd7e5;border-radius:11px;padding:9px 10px;font-size:clamp(13px,1.15vw,18px);font-weight:850;color:#17375f;background:#f8fbff;outline:none}.input-row input:focus{border-color:#2a69c7;box-shadow:0 0 0 3px rgba(42,105,199,.12)}.monthly-card{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(145deg,#123b74,#1d5db0);color:#fff}.monthly-card small{font-size:clamp(10px,.9vw,14px);font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#bcd8ff}.monthly-card strong{font-size:clamp(47px,5.6vw,86px);line-height:.9;margin:5% 0 3%;letter-spacing:-.055em;color:#fff}.monthly-card span{font-size:clamp(11px,.95vw,15px);font-weight:750;color:#d4e6ff}.future-card{display:flex;flex-direction:column;justify-content:center}.future-title{font-size:clamp(13px,1.2vw,19px);font-weight:950;color:#234d85;margin-bottom:4%}.future-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.future-box{border-radius:13px;background:#f4f8fd;border:1px solid #dce6f1;padding:8px;text-align:center}.future-box span{display:block;font-size:clamp(9px,.72vw,12px);font-weight:850;color:#60768f}.future-box strong{display:block;margin-top:3px;font-size:clamp(18px,1.75vw,28px);color:#17375f}.rate-result{margin-top:8px;text-align:center;font-size:clamp(9px,.72vw,12px);font-weight:800;color:#6b7f96}
      @media(max-width:1100px){.net-simple-shell{padding:3.3% 3.6%}.simple-grid{margin-top:3%;gap:1.6%}.simple-card{padding:5.5% 4.5%}.simple-icon{width:68px;height:68px;font-size:38px}.demand-line{margin-top:2.2%}.installer-top{padding:2.7% 3.5% 1.2%}.credential-grid{margin-top:1.8%;gap:.9%}.credential-btn{border-radius:14px;padding:3.5%}.az-facts{padding:1.7% 3.5% 2.1%}.fact-grid{gap:.8%}.fact-card{border-radius:13px;padding:5% 3.5%}.savings-shell{padding:2.1% 2.8%;grid-template-rows:auto 28% 1fr}.calc-zone{gap:1%}.input-card,.monthly-card,.future-card{border-radius:17px;padding:4%}}
    `;
    d.head.appendChild(style);
    slide.className='slide net-simple';
    slide.innerHTML=`<div class="net-simple-shell"><h1>The Power of Net Metering.</h1><div class="simple-grid"><section class="simple-card sell"><div class="simple-icon">↗</div><h2>Sell stored energy back</h2><div class="simple-label">APS export rate</div><div class="simple-rate">≈4.8¢</div><div class="simple-unit">per kWh</div><div class="simple-note">Export extra battery energy back to APS.</div></section><div class="battery-center"><div class="battery-orb"><svg viewBox="0 0 100 100"><rect x="22" y="12" width="56" height="76" rx="12" fill="#fff"/><rect x="41" y="5" width="18" height="9" rx="3" fill="#fff"/><path d="M48 28v20H36l20 25V52h12Z" fill="#4bbf64"/></svg></div><strong>Battery decides<br>when to buy or sell.</strong></div><section class="simple-card buy"><div class="simple-icon">↓</div><h2>Buy cheap energy and store it</h2><div class="simple-label">APS off-peak rate</div><div class="simple-rate">≈4.72¢</div><div class="simple-unit">per kWh</div><div class="simple-note">Summer 5.943¢ + winter 3.495¢, averaged.</div></section></div><div class="demand-line">Use the battery during the <span>4–7 p.m. APS demand window</span> to remove demand charges.</div></div>`;
    const installer=[...d.querySelectorAll('.slide')].find(s=>/Arizona.?s Largest Installer/i.test(s.textContent||''));
    if(installer){installer.className='slide installer-links';installer.innerHTML=`<div class="installer-shell"><div class="installer-top"><div class="installer-head"><div class="installer-mark">WE</div><h1>Arizona’s Largest Installer: <strong>1000+</strong> installs a month</h1></div><div class="credential-grid"><a class="credential-btn" href="https://www.google.com/maps/search/?api=1&query=Our+World+Energy+Peoria+AZ" target="_blank" rel="noopener"><div class="credential-logo"><div class="google-word"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><span class="stars">★★★★★ <b>4.8</b></span><small>Google Reviews</small></div></a><a class="credential-btn" href="https://www.google.com/search?q=site%3Asolarpowerworldonline.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo top100"><em>☀</em> Top 100<br>Installers<small>Solar Power World</small></div></a><a class="credential-btn" href="https://www.google.com/search?q=site%3Astevieawards.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo stevie"><b>Silver</b>Stevie Winner<small>Customer Service Award</small></div></a><a class="credential-btn" href="https://www.google.com/search?q=site%3Ainc.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo inc5000">Inc.<br>5000<small>Fastest-Growing Companies</small></div></a><a class="credential-btn" href="https://www.bbb.org/search?find_country=USA&find_text=Our%20World%20Energy&page=1" target="_blank" rel="noopener"><div class="credential-logo bbb">BBB Accredited <b>A+</b><small>Better Business Bureau</small></div></a><a class="credential-btn" href="https://directories.nabcep.org/" target="_blank" rel="noopener"><div class="credential-logo nabcep"><b>NABCEP</b>Certified<small>PV Installation Professional</small></div></a></div><div class="tap-note">Tap any credential to open its supporting source.</div></div><section class="az-facts"><div class="az-facts-title">Built in Arizona. Built to handle everything in-house.</div><div class="fact-grid"><div class="fact-card"><div class="fact-icon">📍</div><strong>Founded in Arizona</strong><span>Local roots and local accountability</span></div><div class="fact-card"><div class="fact-icon">🏢</div><strong>HQ in Peoria</strong><span>Arizona-based operations center</span></div><div class="fact-card"><div class="fact-icon">⚙️</div><strong>Vertically Integrated</strong><span>One company from sale through service</span></div><div class="fact-card"><div class="fact-icon">👥</div><strong>400+ Employees</strong><span>A full team supporting every project</span></div><div class="fact-card"><div class="fact-icon">✓</div><strong>No Subcontractors</strong><span>Installation stays with our own crews</span></div></div></section></div>`}
    const savings=[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
    if(savings){
      savings.className='slide savings-upgrade';
      savings.innerHTML=`<div class="savings-shell"><div class="savings-head"><h1>Be your own power company and charge yourself less</h1><p>Utility prices can increase <strong>5%–7% each year</strong>. Your solar rate stays predictable.</p></div><div class="savings-graph"><div class="graph-label">WITHOUT SOLAR</div><div class="graph-red"></div><div class="graph-yellow">WITH SOLAR</div></div><div class="calc-zone"><section class="input-card"><div class="input-title">Enter the homeowner’s usage</div><div class="input-row"><label>Annual usage<input id="annualKwh" type="number" inputmode="decimal" placeholder="e.g. 18000"></label><label>Latest bill<input id="recentBill" type="number" inputmode="decimal" placeholder="e.g. 350"></label><label>kWh on latest bill<input id="recentKwh" type="number" inputmode="decimal" placeholder="e.g. 1800"></label></div></section><section class="monthly-card"><small>Estimated monthly utility bill</small><strong id="monthlyAvg">$0</strong><span>Based on annual usage and current utility pricing</span></section><section class="future-card"><div class="future-title">Where that monthly bill can go</div><div class="future-grid"><div class="future-box"><span>Year 5</span><strong id="y5">$0</strong></div><div class="future-box"><span>Year 10</span><strong id="y10">$0</strong></div><div class="future-box"><span>Year 15</span><strong id="y15">$0</strong></div><div class="future-box"><span>Year 25</span><strong id="y25">$0</strong></div></div><div class="rate-result" id="rateResult">Enter all three numbers to calculate.</div></section></div></div>`;
      const annual=d.getElementById('annualKwh'),bill=d.getElementById('recentBill'),kwh=d.getElementById('recentKwh');
      const money=n=>Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):'$0';
      const calc=()=>{const a=parseFloat(annual.value),b=parseFloat(bill.value),k=parseFloat(kwh.value);if(!(a>0&&b>0&&k>0)){['monthlyAvg','y5','y10','y15','y25'].forEach(id=>d.getElementById(id).textContent='$0');d.getElementById('rateResult').textContent='Enter all three numbers to calculate.';return}const current=b/k;const adjusted=current+.16;const monthly=a*adjusted/12;d.getElementById('monthlyAvg').textContent=money(monthly);const growth=.06;[[5,'y5'],[10,'y10'],[15,'y15'],[25,'y25']].forEach(([yr,id])=>d.getElementById(id).textContent=money(monthly*Math.pow(1+growth,yr)));d.getElementById('rateResult').textContent='Current bill rate: '+(current*100).toFixed(1)+'¢/kWh';};
      [annual,bill,kwh].forEach(el=>el.addEventListener('input',calc));
    }
    setTimeout(()=>{try{outer.getElementById('deckFrame').style.height=d.documentElement.scrollHeight+'px';resize()}catch(e){}},80);
  };
  deckFrame.addEventListener('load',enhance,{once:true});enhance();setTimeout(resize,250);
}
base.addEventListener('load',install);window.addEventListener('resize',()=>setTimeout(resize,100));
</script>
