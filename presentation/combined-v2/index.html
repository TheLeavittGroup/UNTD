<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daddy's Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000}#base{display:block;width:100%;height:16000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" src="../combined/" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
function resize(){try{base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function install(){
  const outer=base.contentDocument;if(!outer)return;
  const deckFrame=outer.getElementById('deckFrame');if(!deckFrame)return;
  const enhance=()=>{
    const d=deckFrame.contentDocument;if(!d)return;
    const slide=[...d.querySelectorAll('.slide')].find(s=>/The Power of Net Metering/i.test(s.textContent||''));
    if(!slide)return;
    const style=d.createElement('style');
    style.textContent=`
      .net-simple{padding:0!important;background:linear-gradient(145deg,#edf6ff,#dcecff 56%,#f8fbff)!important;color:#12233d}
      .net-simple-shell{position:absolute;inset:0;padding:4% 4.3%;display:flex;flex-direction:column}
      .net-simple h1{font-size:clamp(42px,5vw,78px);line-height:.95;letter-spacing:-.05em;margin:0;color:#132a4d}
      .simple-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 14% 1fr;gap:2.3%;align-items:center;margin-top:4%}
      .simple-card{height:100%;border-radius:30px;background:rgba(255,255,255,.96);border:1px solid #cbd9ea;box-shadow:0 18px 38px rgba(31,67,113,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7% 6%}
      .simple-card.buy{background:linear-gradient(155deg,#fff,#edf9ef)}
      .simple-icon{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;background:#e7f1ff;color:#1c55ad;font-size:45px;font-weight:900;margin-bottom:5%}
      .buy .simple-icon{background:#e5f4e7;color:#28783a}
      .simple-card h2{font-size:clamp(28px,3vw,48px);line-height:1.02;letter-spacing:-.03em;margin:0;color:#17375f;max-width:92%}
      .simple-label{margin-top:7%;font-size:clamp(13px,1.15vw,18px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#657b98}
      .simple-rate{margin-top:1%;font-size:clamp(62px,7vw,108px);line-height:.88;font-weight:900;color:#1852aa}
      .buy .simple-rate{color:#27823d}
      .simple-unit{font-size:clamp(17px,1.5vw,24px);font-weight:800;color:#344b68;margin-top:2%}
      .simple-note{font-size:clamp(14px,1.3vw,21px);line-height:1.3;color:#526985;margin-top:5%;max-width:92%}
      .battery-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#345b8c}
      .battery-orb{width:100%;aspect-ratio:1;border-radius:32%;background:linear-gradient(145deg,#1d4f96,#0d2d5e);display:grid;place-items:center;box-shadow:0 18px 36px rgba(14,48,101,.23)}
      .battery-orb svg{width:72%;height:72%}
      .battery-center strong{display:block;margin-top:18%;font-size:clamp(15px,1.35vw,22px);line-height:1.2;color:#294e7e}
      .demand-line{margin-top:3%;padding:1.6% 2.4%;border-radius:18px;background:#143b73;color:#fff;text-align:center;font-size:clamp(17px,1.65vw,27px);font-weight:800;box-shadow:0 10px 24px rgba(17,56,113,.16)}
      .demand-line span{color:#93eda1}
      .installer-links{padding:0!important;background:linear-gradient(160deg,#fff 0 56%,#f6f7fb 56% 100%)!important;color:#111}
      .installer-shell{position:absolute;inset:0;padding:4% 4.5%;display:flex;flex-direction:column}
      .installer-head{display:flex;align-items:center;gap:2.2%}
      .installer-mark{width:8%;aspect-ratio:1;border:5px solid #111;border-radius:50%;display:grid;place-items:center;font-size:clamp(18px,2.3vw,34px);font-weight:950;flex:0 0 auto}
      .installer-links h1{font-size:clamp(35px,4.35vw,68px);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:900}
      .installer-links h1 strong{text-decoration:underline}
      .credential-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2.2%;margin-top:4%;min-height:0}
      .credential-btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#17375f;border:2px solid #d6dfeb;border-radius:24px;background:#fff;box-shadow:0 14px 32px rgba(24,54,91,.1);padding:6%;transition:.18s transform,.18s box-shadow,.18s border-color;overflow:hidden}
      .credential-btn:active{transform:scale(.97);box-shadow:0 7px 16px rgba(24,54,91,.14);border-color:#2258c7}
      .credential-logo{width:100%;font-weight:950;line-height:1.02}
      .credential-logo small{display:block;margin-top:7%;font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.04em;color:#65758b}
      .google-word{font-size:clamp(30px,3.2vw,50px);letter-spacing:-.06em}
      .google-word span:nth-child(1),.google-word span:nth-child(4){color:#4285f4}.google-word span:nth-child(2),.google-word span:nth-child(6){color:#ea4335}.google-word span:nth-child(3){color:#fbbc05}.google-word span:nth-child(5){color:#34a853}
      .stars{display:block;margin-top:5%;font-size:clamp(20px,2.1vw,34px);color:#f5c400;letter-spacing:.04em}.stars b{color:#2458b7;margin-left:4%;font-size:.78em}
      .top100{font-size:clamp(25px,2.75vw,44px);color:#178cc7}.top100 em{font-style:normal;color:#f0b500}
      .stevie{font-size:clamp(22px,2.3vw,38px);color:#75613b}.stevie b{display:block;color:#a98d45;font-size:1.25em}
      .inc5000{font-family:Georgia,serif;font-size:clamp(36px,4vw,62px);color:#111;letter-spacing:-.06em}
      .bbb{font-size:clamp(22px,2.35vw,38px);color:#145477}.bbb b{display:inline-block;margin-left:5%;padding:4% 6%;border-radius:12px;background:#145477;color:#fff;font-size:1.3em}
      .nabcep{font-size:clamp(22px,2.4vw,40px);color:#176a9d}.nabcep b{display:block;color:#d88925;font-size:1.24em}
      .tap-note{text-align:center;margin-top:1.6%;font-size:clamp(11px,1vw,16px);font-weight:800;color:#63758a}
      @media(max-width:1100px){.net-simple-shell{padding:3.3% 3.6%}.simple-grid{margin-top:3%;gap:1.6%}.simple-card{padding:5.5% 4.5%}.simple-icon{width:68px;height:68px;font-size:38px}.demand-line{margin-top:2.2%}.installer-shell{padding:3.2% 3.7%}.credential-grid{margin-top:3%;gap:1.6%}.credential-btn{border-radius:18px;padding:4%}}
    `;
    d.head.appendChild(style);
    slide.className='slide net-simple';
    slide.innerHTML=`<div class="net-simple-shell">
      <h1>The Power of Net Metering.</h1>
      <div class="simple-grid">
        <section class="simple-card sell">
          <div class="simple-icon">↗</div>
          <h2>Sell stored energy back</h2>
          <div class="simple-label">APS export rate</div>
          <div class="simple-rate">≈4.8¢</div>
          <div class="simple-unit">per kWh</div>
          <div class="simple-note">Export extra battery energy back to APS.</div>
        </section>
        <div class="battery-center">
          <div class="battery-orb"><svg viewBox="0 0 100 100"><rect x="22" y="12" width="56" height="76" rx="12" fill="#fff"/><rect x="41" y="5" width="18" height="9" rx="3" fill="#fff"/><path d="M48 28v20H36l20 25V52h12Z" fill="#4bbf64"/></svg></div>
          <strong>Battery decides<br>when to buy or sell.</strong>
        </div>
        <section class="simple-card buy">
          <div class="simple-icon">↓</div>
          <h2>Buy cheap energy and store it</h2>
          <div class="simple-label">APS off-peak rate</div>
          <div class="simple-rate">≈4.72¢</div>
          <div class="simple-unit">per kWh</div>
          <div class="simple-note">Summer 5.943¢ + winter 3.495¢, averaged.</div>
        </section>
      </div>
      <div class="demand-line">Use the battery during the <span>4–7 p.m. APS demand window</span> to remove demand charges.</div>
    </div>`;

    const installer=[...d.querySelectorAll('.slide')].find(s=>/Arizona.?s Largest Installer/i.test(s.textContent||''));
    if(installer){
      installer.className='slide installer-links';
      installer.innerHTML=`<div class="installer-shell">
        <div class="installer-head"><div class="installer-mark">WE</div><h1>Arizona’s Largest Installer: <strong>1000+</strong> installs a month</h1></div>
        <div class="credential-grid">
          <a class="credential-btn" href="https://www.google.com/maps/search/?api=1&query=Our+World+Energy+Peoria+AZ" target="_blank" rel="noopener"><div class="credential-logo"><div class="google-word"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><span class="stars">★★★★★ <b>4.8</b></span><small>Google Reviews</small></div></a>
          <a class="credential-btn" href="https://www.google.com/search?q=site%3Asolarpowerworldonline.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo top100"><em>☀</em> Top 100<br>Installers<small>Solar Power World</small></div></a>
          <a class="credential-btn" href="https://www.google.com/search?q=site%3Astevieawards.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo stevie"><b>Silver</b>Stevie Winner<small>Customer Service Award</small></div></a>
          <a class="credential-btn" href="https://www.google.com/search?q=site%3Ainc.com+%22Our+World+Energy%22" target="_blank" rel="noopener"><div class="credential-logo inc5000">Inc.<br>5000<small>Fastest-Growing Companies</small></div></a>
          <a class="credential-btn" href="https://www.bbb.org/search?find_country=USA&find_text=Our%20World%20Energy&page=1" target="_blank" rel="noopener"><div class="credential-logo bbb">BBB Accredited <b>A+</b><small>Better Business Bureau</small></div></a>
          <a class="credential-btn" href="https://directories.nabcep.org/" target="_blank" rel="noopener"><div class="credential-logo nabcep"><b>NABCEP</b>Certified<small>PV Installation Professional</small></div></a>
        </div>
        <div class="tap-note">Tap any credential to open its supporting source.</div>
      </div>`;
    }
    setTimeout(()=>{try{outer.getElementById('deckFrame').style.height=d.documentElement.scrollHeight+'px';resize()}catch(e){}},80);
  };
  deckFrame.addEventListener('load',enhance,{once:true});enhance();
  setTimeout(resize,250);
}
base.addEventListener('load',install);
window.addEventListener('resize',()=>setTimeout(resize,100));
</script>
</body>
</html>
