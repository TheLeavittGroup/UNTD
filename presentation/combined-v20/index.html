<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Daddy's Sales Deck</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:34000px;border:0;background:#000}</style></head><body><iframe id="base" src="../combined-v19/?build=aps-image-clean-v20&refresh=1" scrolling="no" title="Daddy's Sales Deck"></iframe><script>const base=document.getElementById('base');function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)walkDocs(f.contentDocument,docs)}catch(e){}})}catch(e){}return docs}function removeBadRates(d){try{d.querySelectorAll('#apsRatePlanSlide,#apsCurrentRatePlanSlide,.aps-rate-slide').forEach(el=>el.remove());[...d.querySelectorAll('.slide')].forEach(slide=>{if(slide.classList.contains('aps-rate-image-slide')||slide.classList.contains('aps-rate-shot-slide'))return;const text=(slide.textContent||'').replace(/\s+/g,' ');if(/APS Current Pricing|APS Current Rate Plan|APS Current Rate Plan Pricing/i.test(text)&&/Time-of-Use 4pm-7pm Weekdays with Demand Charge/i.test(text))slide.remove();if(/Summer Rates/i.test(text)&&/Winter Rates/i.test(text)&&/Time-of-Use 4pm-7pm/i.test(text))slide.remove()})}catch(e){}}function forceImageLayout(d){try{if(!d.getElementById('apsImageCleanStyles')){const style=d.createElement('style');style.id='apsImageCleanStyles';style.textContent='.aps-rate-image-slide,.aps-rate-shot-slide{background:#fff!important;color:#202124!important;padding:0!important;margin:0 0 18px 0!important;overflow:visible!important;height:auto!important;min-height:auto!important;aspect-ratio:auto!important;display:block!important}.aps-rate-image-shell{width:100%!important;max-width:none!important;margin:0!important;display:block!important}.aps-rate-image-shell h1{display:none!important}.aps-rate-image-slide img,.aps-rate-shot-slide img{display:block!important;width:100%!important;height:auto!important;max-width:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important}#apsRateImageSlides{display:block!important;width:100%!important;height:auto!important;overflow:visible!important}';d.head.appendChild(style)}}catch(e){}}function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}function patch(){try{const docs=walkDocs(base.contentDocument,[]);docs.forEach(removeBadRates);docs.forEach(forceImageLayout)}catch(e){}resize()}base.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500);setTimeout(patch,5000)});setInterval(patch,1200);window.addEventListener('resize',()=>setTimeout(resize,100));</script></body></html>
