const base=document.getElementById('base');const generationCopy='Those two round balls in between San Diego and Los Angeles.';const MISSION='WE ARE THE 1%. FROM INCOME TO IMPACT. RUNNING WITH THE REAL ONES TO CONSTRUCT THE WORLD WE WANT TO EXPERIENCE.';const replacements=[['Big breasts you see when driving from San Diego to Newport.',generationCopy],['Those giant spinny fans you see when driving from San Diego to Newport.',generationCopy],['Those giant spinny fans photobombing the drive from San Diego to Newport.',generationCopy],['Those giant power pinwheels you see on the drive from San Diego to Newport.',generationCopy]];
function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)walkDocs(f.contentDocument,docs)}catch(e){}})}catch(e){}return docs}

function ensureSharedStyles(d){if(!d||d.getElementById('daddyV21Styles'))return;const s=d.createElement('style');s.id='daddyV21Styles';s.textContent=`.mission-cover{position:relative!important;overflow:hidden!important;background:radial-gradient(circle at 72% 34%,rgba(255,255,255,.06),transparent 30%),linear-gradient(115deg,#050607,#171717)!important;color:#fff!important;padding:0!important}.mission-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7%;z-index:2}.mission-kicker{position:absolute;left:5%;top:8%;font-size:clamp(10px,.85vw,14px);font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)}.mission-word{margin:0 0 .35em!important;color:#fff!important;font-size:clamp(48px,6.6vw,102px)!important;line-height:.9!important;letter-spacing:-.055em!important;font-weight:950!important;text-transform:uppercase;text-align:center}.mission-line{font-size:clamp(17px,1.55vw,25px)!important;line-height:1.28!important;font-weight:950!important;text-transform:uppercase;color:#fff!important;text-align:center;max-width:86%}.mission-logo-box{position:absolute;right:5%;bottom:7%;width:clamp(150px,19vw,300px);aspect-ratio:2.45/1;background:#fff;display:flex;align-items:center;justify-content:center}.mission-logo-mark{color:#090909;font-weight:950;font-size:clamp(22px,3vw,46px)}.mission-cover .owe,.mission-cover>h1,.mission-cover #customerNameInput,.mission-cover [id*='customerName'],.mission-cover [class*='customer-name'],.mission-cover [class*='customerName']{display:none!important}.agenda-slide{background:linear-gradient(145deg,#070708,#141414 58%,#050506)!important;color:#fff!important;padding:5.2% 6%!important}.agenda-wrap{height:100%;display:grid;grid-template-columns:.88fr 1.12fr;gap:5%;align-items:center}.agenda-copy .eyebrow{display:inline-flex;padding:.55em .9em;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff;font-size:clamp(10px,.9vw,14px);letter-spacing:.14em;text-transform:uppercase;font-weight:950}.agenda-copy h1{margin:.42em 0 0!important;color:#fff!important;font-size:clamp(46px,5.9vw,86px)!important;line-height:.9!important;font-weight:950!important}.agenda-copy p{color:#c9c7c2!important;font-size:clamp(15px,1.35vw,21px)!important;font-weight:750!important}.agenda-steps{display:grid;gap:1em}.agenda-step{display:grid;grid-template-columns:auto 1fr;gap:1em;align-items:center;padding:1em 1.1em;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.06)}.agenda-num{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#090909;font-size:22px;font-weight:950}.agenda-step h3{margin:0!important;color:#fff!important}.agenda-step p{margin:.28em 0 0!important;color:#aaa7a0!important;font-weight:750!important}.agenda-close{grid-column:1/-1;padding:1em;border:1px solid rgba(255,255,255,.18);border-radius:20px;color:#fff;text-align:center;font-weight:850}`;d.head.appendChild(s)}
function replaceMissionCover(d){if(!d||d.getElementById('oweMissionCover'))return;const cover=[...d.querySelectorAll('.slide')].find(s=>/More power to\s*you/i.test(s.textContent||''));if(!cover)return;ensureSharedStyles(d);cover.id='oweMissionCover';cover.classList.add('mission-cover');const stage=d.createElement('div');stage.className='mission-stage';stage.innerHTML=`<div class="mission-kicker">Our World Energy</div><h1 class="mission-word">Mission Statement</h1><div class="mission-line">${MISSION}</div><div class="mission-logo-box"><div class="mission-logo-mark">UNTD SLR</div></div>`;cover.insertBefore(stage,cover.firstChild)}
function addAgendaSlide(d){if(!d||d.getElementById('todayReviewAgendaSlide'))return;const slides=[...d.querySelectorAll('.slide')];if(!slides.length)return;ensureSharedStyles(d);const slide=d.createElement('section');slide.className='slide agenda-slide';slide.id='todayReviewAgendaSlide';slide.innerHTML=`<div class="agenda-wrap"><div class="agenda-copy"><div class="eyebrow">Today's Review</div><h1>Here’s what we’ll cover.</h1><p>I’ll keep this simple and walk through everything in order so you can see exactly what your utility is doing, what your options are, and whether this actually makes sense for your home.</p></div><div class="agenda-steps"><div class="agenda-step"><div class="agenda-num">1</div><div><h3>Your utility & current bill</h3><p>We’ll look at how you’re buying power today and where the cost is coming from.</p></div></div><div class="agenda-step"><div class="agenda-num">2</div><div><h3>The solution</h3><p>We’ll show how the system is designed around your home and usage.</p></div></div><div class="agenda-step"><div class="agenda-num">3</div><div><h3>Your numbers</h3><p>We’ll compare the current utility path against the proposed monthly cost and long-term savings.</p></div></div><div class="agenda-step"><div class="agenda-num">4</div><div><h3>Qualification & next steps</h3><p>If everything makes sense and the home qualifies, we’ll complete the required documents and submit the project for utility review and approval.</p></div></div></div><div class="agenda-close">If everything makes sense and aligns, we’ll complete the necessary documents and submit the project to the utility for review and approval.</div></div>`;const first=slides[0];if(first.nextSibling)first.parentNode.insertBefore(slide,first.nextSibling);else first.parentNode.appendChild(slide)}
function removeRateSlides(d){try{const explicit=d.getElementById('apsOfficialRateLinkSlide');if(explicit)explicit.remove();[...d.querySelectorAll('.slide')].forEach(s=>{if(/APS Current Rate Plan Pricing|Current rate plan pricing/i.test(s.textContent||''))s.remove()})}catch(e){}}
function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
