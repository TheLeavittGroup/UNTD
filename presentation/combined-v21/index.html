<body>
<iframe id="base" src="../combined-v16/?build=official-aps-rate-link-v21-agenda-mission" scrolling="no" title="Daddy's Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
const APS_RATE_URL='https://www.aps.com/en/Residential/Service-Plans/Compare-Service-Plans/Time-of-Use-4pm-7pm-Weekdays-with-Demand-Charge';
const generationCopy='Those two round balls in between San Diego and Los Angeles.';
const MISSION='WE ARE THE 1%. FROM INCOME TO IMPACT. RUNNING WITH THE REAL ONES TO CONSTRUCT THE WORLD WE WANT TO EXPERIENCE.';
const replacements=[
 ['Big breasts you see when driving from San Diego to Newport.',generationCopy],
 ['Those giant spinny fans you see on the drive and say, yep, that is electricity.',generationCopy],
 ['Those giant spinny fans photobombing the drive from San Diego to Newport.',generationCopy],
 ['Those giant power pinwheels you see on the drive from San Diego to Newport.',generationCopy]
];
function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(frame=>{try{if(frame.contentDocument)walkDocs(frame.contentDocument,docs)}catch(e){}})}catch(e){}return docs}
function cleanDoc(doc){try{const walker=doc.createTreeWalker(doc.body||doc,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){let text=node.nodeValue||'';replacements.forEach(([oldText,newText])=>{if(text.includes(oldText))text=text.replaceAll(oldText,newText)});node.nodeValue=text}}catch(e){}}
function ensureSharedStyles(d){if(!d||d.getElementById('daddyV21Styles'))return;const style=d.createElement('style');style.id='daddyV21Styles';style.textContent=`
 .mission-cover{position:relative!important;overflow:hidden!important;background:radial-gradient(circle at 70% 34%,rgba(255,255,255,.07),transparent 31%),linear-gradient(115deg,#050607 0%,#0c0e10 48%,#171717 100%)!important;color:#fff!important;padding:0!important;isolation:isolate}.mission-cover:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(94deg,rgba(255,255,255,.025) 0 1px,transparent 1px 9px);opacity:.55;pointer-events:none}.mission-cover .mission-stage{position:absolute;inset:0;display:grid;place-items:center;padding:8% 5%;z-index:2}.mission-cover .mission-word{position:relative;z-index:3;margin:0!important;color:#fff!important;font-size:clamp(48px,8.2vw,128px)!important;line-height:.82!important;letter-spacing:-.065em!important;font-weight:950!important;text-transform:uppercase;text-align:center;white-space:nowrap;text-shadow:0 8px 35px rgba(0,0,0,.45)}.mission-cover .mission-ribbon{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.12em;z-index:1;overflow:hidden}.mission-cover .mission-line{font-size:clamp(13px,1.55vw,24px)!important;line-height:1.02!important;font-weight:950!important;letter-spacing:.005em!important;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.94)!important;text-align:center}.mission-cover .mission-line:nth-child(2){transform:translateX(-3%)}.mission-cover .mission-line:nth-child(3){transform:translateX(3%)}.mission-cover .mission-kicker{position:absolute;left:5%;top:8%;z-index:4;font-size:clamp(10px,.85vw,14px);font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72)}.mission-cover .owe{z-index:5!important;right:5%!important;bottom:7%!important;left:auto!important;top:auto!important;transform:none!important;color:#fff!important}.mission-cover>h1{display:none!important}
 .agenda-slide{background:radial-gradient(circle at 82% 8%,rgba(245,207,112,.16),transparent 34%),linear-gradient(145deg,#070708,#141414 58%,#050506)!important;color:#fff!important;padding:5.2% 6%!important;overflow:hidden!important}
 .agenda-wrap{height:100%;display:grid;grid-template-columns:.88fr 1.12fr;gap:5%;align-items:center}.agenda-copy .eyebrow{display:inline-flex;padding:.55em .9em;border:1px solid rgba(245,207,112,.45);border-radius:999px;color:#f5cf70;background:rgba(245,207,112,.08);font-size:clamp(10px,.9vw,14px);letter-spacing:.14em;text-transform:uppercase;font-weight:950}.agenda-copy h1{margin:.42em 0 0!important;color:#fff!important;font-size:clamp(46px,5.9vw,86px)!important;line-height:.9!important;letter-spacing:-.06em!important;font-weight:950!important}.agenda-copy p{margin:1em 0 0;color:#c9c7c2!important;font-size:clamp(15px,1.35vw,21px)!important;line-height:1.38!important;font-weight:750!important;max-width:33em!important}.agenda-steps{display:grid;gap:1em}.agenda-step{display:grid;grid-template-columns:auto 1fr;gap:1em;align-items:center;padding:1em 1.1em;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.06);box-shadow:0 22px 60px rgba(0,0,0,.22)}.agenda-num{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#f5cf70;color:#090909;font-size:22px;font-weight:950}.agenda-step h3{margin:0!important;color:#fff!important;font-size:clamp(18px,1.7vw,27px)!important}.agenda-step p{margin:.28em 0 0!important;color:#aaa7a0!important;font-size:clamp(12px,1.02vw,16px)!important;line-height:1.25!important;font-weight:750!important}.agenda-close{grid-column:1/-1;margin-top:1%;padding:1em 1.25em;border-radius:20px;background:rgba(245,207,112,.1);border:1px solid rgba(245,207,112,.28);color:#fff;font-size:clamp(13px,1.08vw,17px);font-weight:850;text-align:center}.aps-rate-link-slide{background:radial-gradient(circle at 78% 8%,rgba(89,180,255,.18),transparent 34%),linear-gradient(145deg,#06111f,#0a2138 58%,#03101d)!important;color:#fff!important;padding:5.2% 6%!important;overflow:hidden!important}.aps-rate-link-wrap{height:100%;display:grid;grid-template-columns:1.04fr .96fr;gap:5%;align-items:center}.aps-rate-copy .eyebrow{display:inline-flex;align-items:center;gap:.55em;margin:0 0 1em;padding:.55em .9em;border:1px solid rgba(255,211,108,.45);border-radius:999px;color:#ffd36c;background:rgba(255,211,108,.08);font-size:clamp(10px,.9vw,14px);letter-spacing:.14em;text-transform:uppercase;font-weight:950}.aps-rate-copy h1{margin:0!important;color:#fff!important;font-size:clamp(42px,5.6vw,82px)!important;line-height:.9!important;letter-spacing:-.06em!important;font-weight:950!important;max-width:11em!important}.aps-rate-copy p{margin:1.1em 0 0;color:#bcd3ee!important;font-size:clamp(15px,1.35vw,21px)!important;line-height:1.35!important;font-weight:750!important;max-width:36em!important}.aps-rate-card{border:1px solid rgba(255,255,255,.16);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.055));box-shadow:0 28px 90px rgba(0,0,0,.45);padding:7%;display:grid;gap:1em}.aps-rate-card h2{margin:0!important;color:#fff!important;font-size:clamp(25px,3.2vw,48px)!important;letter-spacing:-.04em!important;line-height:1.02!important}.aps-rate-card ul{margin:.2em 0 0;padding:0;list-style:none;display:grid;gap:.75em}.aps-rate-card li{display:flex;gap:.7em;align-items:flex-start;color:#d9e8fb;font-size:clamp(13px,1.05vw,18px);line-height:1.25;font-weight:800}.aps-rate-card li:before{content:'✓';color:#56e39f;font-weight:950;flex:0 0 auto}.aps-rate-button{display:flex!important;align-items:center!important;justify-content:center!important;min-height:64px;margin-top:.7em;border-radius:999px;background:linear-gradient(135deg,#ffe6a5,#ffd36c)!important;color:#111!important;text-decoration:none!important;font-weight:950!important;font-size:clamp(15px,1.15vw,20px)!important;box-shadow:0 16px 40px rgba(255,211,108,.24);border:0!important;padding:0 1.4em!important;text-align:center!important}.aps-rate-button span{display:inline-block}.aps-rate-button:after{content:'↗';margin-left:.55em;font-size:1.1em}.aps-rate-url{color:#8fb8e4!important;font-size:clamp(9px,.72vw,12px)!important;font-weight:800!important;word-break:break-all;margin:.4em 0 0!important}.aps-rate-note{grid-column:1/-1;margin:1.5% 0 0;padding:1em 1.2em;border-radius:18px;background:rgba(86,227,159,.1);border:1px solid rgba(86,227,159,.25);color:#c7f9dd;font-size:clamp(12px,1vw,16px);font-weight:850;text-align:center}@media(max-width:800px){.mission-cover .mission-word{font-size:clamp(38px,9vw,76px)!important;white-space:normal}.mission-cover .mission-line{font-size:clamp(10px,2vw,16px)!important}.agenda-slide,.aps-rate-link-slide{padding:7% 5%!important}.agenda-wrap,.aps-rate-link-wrap{grid-template-columns:1fr;gap:3%}.agenda-copy h1,.aps-rate-copy h1{font-size:48px!important}.agenda-step{border-radius:18px}.aps-rate-card{border-radius:22px;padding:5%}.aps-rate-button{min-height:52px}}
`;d.head.appendChild(style)}
function replaceMissionCover(d){if(!d||d.getElementById('oweMissionCover'))return;const cover=[...d.querySelectorAll('.slide')].find(s=>/More power to\s*you/i.test(s.textContent||''));if(!cover)return;ensureSharedStyles(d);cover.id='oweMissionCover';cover.classList.add('mission-cover');const h1=cover.querySelector('h1');if(h1)h1.style.display='none';const stage=d.createElement('div');stage.className='mission-stage';stage.innerHTML=`<div class="mission-kicker">Our World Energy</div><div class="mission-ribbon"><div class="mission-line">${MISSION} ${MISSION}</div><div class="mission-line">${MISSION} ${MISSION}</div><div class="mission-line">${MISSION} ${MISSION}</div></div><h1 class="mission-word">Mission Statement</h1>`;cover.insertBefore(stage,cover.firstChild)}
function addAgendaSlide(d){if(!d||d.getElementById('todayReviewAgendaSlide'))return;const slides=[...d.querySelectorAll('.slide')];if(!slides.length)return;ensureSharedStyles(d);const slide=d.createElement('section');slide.className='slide agenda-slide';slide.id='todayReviewAgendaSlide';slide.innerHTML=`<div class="agenda-wrap"><div class="agenda-copy"><div class="eyebrow">Today's Review</div><h1>Here’s what we’ll cover.</h1><p>I’ll keep this simple and walk through everything in order so you can see exactly what your utility is doing, what your options are, and whether this actually makes sense for your home.</p></div><div class="agenda-steps"><div class="agenda-step"><div class="agenda-num">1</div><div><h3>Your utility & current bill</h3><p>We’ll look at how you’re buying power today and where the cost is coming from.</p></div></div><div class="agenda-step"><div class="agenda-num">2</div><div><h3>The solution</h3><p>We’ll show how the system is designed around your home and usage.</p></div></div><div class="agenda-step"><div class="agenda-num">3</div><div><h3>Your numbers</h3><p>We’ll compare the current utility path against the proposed monthly cost and long-term savings.</p></div></div><div class="agenda-step"><div class="agenda-num">4</div><div><h3>Qualification & next steps</h3><p>If everything makes sense and the home qualifies, we’ll complete the required documents and submit the project for utility review and approval.</p></div></div></div><div class="agenda-close">That way, by the end, you’ll know exactly what the program looks like and whether it’s worth moving forward.</div></div>`;const first=slides[0];if(first.nextSibling){first.parentNode.insertBefore(slide,first.nextSibling)}else{first.parentNode.appendChild(slide)}}
function addRateLinkSlide(d){if(!d||d.getElementById('apsOfficialRateLinkSlide'))return;const slides=[...d.querySelectorAll('.slide')];const target=slides.find(s=>/Arizona.?s\s+largest\s+installer|Arizona.*largest.*installer|largest\s+installer|largest\s+solar\s+installer/i.test(s.textContent||''));const before=target||slides.find(s=>/BBB|Our World Energy|credential|review/i.test(s.textContent||''))||slides[1]||null;if(!before||!before.parentNode)return;ensureSharedStyles(d);const slide=d.createElement('section');slide.className='slide aps-rate-link-slide';slide.id='apsOfficialRateLinkSlide';slide.innerHTML=`<div class="aps-rate-link-wrap"><div class="aps-rate-copy"><div class="eyebrow">Official APS Rates</div><h1>Current rate plan pricing.</h1><p>Use the official APS page during the appointment so the homeowner sees the live pricing straight from the utility instead of a recreated screenshot.</p></div><div class="aps-rate-card"><h2>Time-of-Use 4pm-7pm Weekdays with Demand Charge</h2><ul><li>Current summer, winter, on-peak, off-peak, super off-peak, and demand charge pricing</li><li>Official APS source for the exact plan being discussed</li><li>Opens separately so you can show the customer the current utility page</li></ul><a class="aps-rate-button" href="${APS_RATE_URL}" target="_blank" rel="noopener noreferrer"><span>Open Official APS Rate Plan</span></a><p class="aps-rate-url">${APS_RATE_URL}</p></div><div class="aps-rate-note">Use this before the installer proof slide so the customer sees APS current pricing first.</div></div>`;before.parentNode.insertBefore(slide,before)}
function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function patch(){try{const docs=walkDocs(base.contentDocument,[]);docs.forEach(cleanDoc);docs.forEach(replaceMissionCover);docs.forEach(addAgendaSlide);docs.forEach(addRateLinkSlide)}catch(e){}resize()}
base.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,1000);setTimeout(patch,2500)});setInterval(patch,1400);window.addEventListener('resize',()=>setTimeout(resize,100));
</script>
</body>
</html>
