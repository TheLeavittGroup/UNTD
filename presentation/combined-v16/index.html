function walkDocs(doc,docs=[]){try{if(!doc||docs.includes(doc))return docs;docs.push(doc);doc.querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument)walkDocs(f.contentDocument,docs)}catch(e){}})}catch(e){}return docs}

ass="arb-link" href="https://www.aps.com/en/Residential/Service-Plans/Compare-Service-Plans/Time-of-Use-4pm-7pm-Weekdays-with-Demand-Charge" target="_blank" rel="noopener">VIEW APS RATE CHART</a></section><section class="arb-card"><div class="arb-rule"></div><div class="arb-num">02 / AVOID</div><div class="arb-label">REMOVE DEMAND EXPOSURE</div><div class="arb-big">$19.585/kW <small>summer</small><br>$13.747/kW <small>winter</small></div><p class="arb-copy">Use stored energy during the 4–7 p.m. weekday demand window to reduce the home's grid demand.</p><a class="arb-link" href="https://www.aps.com/demand" target="_blank" rel="noopener">HOW APS DEMAND WORKS</a></section><section class="arb-card"><div class="arb-rule"></div><div class="arb-num">03 / EXPORT</div><div class="arb-label">EXPORT EXCESS SOLAR</div><div class="arb-big">6.17¢/kWh <small>posted RCP</small></div><p class="arb-copy">Qualifying excess solar sent back to APS can receive an export credit under the renewable rider.</p><a class="arb-link" href="https://www.aps.com/en/Residential/Service-Plans/Compare-Service-Plans/Renewable-Energy-Riders" target="_blank" rel="noopener">VIEW APS EXPORT RIDER</a></section></div><p class="arb-foot">APS published Demand Plan and RCP figures shown. Super off-peak applies during qualifying winter weekday hours. Export eligibility depends on the customer's renewable rider and system configuration.</p>`}catch(e){}}
function resize(){try{const docs=walkDocs(base.contentDocument,[]);for(let i=docs.length-1;i>=1;i--){docs[i-1].querySelectorAll('iframe').forEach(f=>{try{if(f.contentDocument===docs[i])f.style.height=docs[i].documentElement.scrollHeight+'px'}catch(e){}})}if(base.contentDocument)base.style.height=base.contentDocument.documentElement.scrollHeight+'px'}catch(e){}}
function patch(){try{walkDocs(base.contentDocument,[]).forEach(d=>{cleanDoc(d);rebuildArbitrage(d)})}catch(e){}resize()}
base.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,1000);setTimeout(patch,2500)});setInterval(patch,1400);window.addEventListener('resize',()=>setTimeout(resize,100));
