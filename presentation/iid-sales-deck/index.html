<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IID Sales Deck</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#000;min-height:100%}#base{display:block;width:100%;height:27000px;border:0;background:#000}</style>
</head>
<body>
<iframe id="base" scrolling="no" title="IID Sales Deck"></iframe>
<script>
const base=document.getElementById('base');
base.src='../combined-v14/?build=iid-sales-deck-v5&refresh='+Date.now();
let resizeTimer=0;

function setHeight(frame,height){
 const next=Math.ceil(height||0),current=parseInt(frame.style.height,10)||0;
 if(next>0&&Math.abs(next-current)>4)frame.style.height=next+'px';
}

function getDeck(){
 try{
  const docs=[];let doc=base.contentDocument;
  while(doc){
   docs.push(doc);
   const frame=doc.getElementById('base');
   if(!frame||!frame.contentDocument)break;
   doc=frame.contentDocument;
  }
  const outer=docs[docs.length-1];
  const deckFrame=outer&&outer.getElementById('deckFrame');
  const deck=deckFrame&&deckFrame.contentDocument;
  return{docs,deckFrame,deck};
 }catch(e){return{}}
}

function resizeAll(ctx){
 try{
  const{docs,deckFrame,deck}=ctx;
  if(deckFrame&&deck)setHeight(deckFrame,deck.documentElement.scrollHeight);
  if(docs)for(let i=docs.length-1;i>0;i--){
   const frame=docs[i-1].getElementById('base');
   if(frame)setHeight(frame,docs[i].documentElement.scrollHeight);
  }
  if(base.contentDocument)setHeight(base,base.contentDocument.documentElement.scrollHeight);
 }catch(e){}
}

function replaceText(root){
 const walker=root.createTreeWalker(root.body,NodeFilter.SHOW_TEXT);
 const nodes=[];let node;
 while((node=walker.nextNode()))nodes.push(node);
 nodes.forEach(textNode=>{
  const parent=textNode.parentElement;
  if(!parent||/^(SCRIPT|STYLE|NOSCRIPT)$/.test(parent.tagName))return;
  let text=textNode.nodeValue||'';
  text=text.replace(/APS and SRP/gi,'IID').replace(/APS\s*\/\s*SRP/gi,'IID').replace(/APS|SRP/gi,'IID');
  text=text.replace(/4\s*(?:-|–|—|to)\s*7\s*(?:PM|P\.M\.)/gi,'4–9 PM');
  text=text.replace(/4:00\s*(?:PM|P\.M\.)\s*(?:-|–|—|to)\s*7:00\s*(?:PM|P\.M\.)/gi,'4:00 PM–9:00 PM');
  textNode.nodeValue=text;
 });
}

function patchSavingsCopy(savings){
 const paragraph=savings.querySelector('.savings-head p');
 if(paragraph)paragraph.textContent='IID rates stayed relatively stable for years—until recent increases totaling 59%.';
}

function patchDeck(){
 const ctx=getDeck(),d=ctx.deck;
 if(!d)return false;

 replaceText(d);

 [...d.querySelectorAll('h1')].forEach(h=>{
  if(/^Why are people going solar\?$/i.test((h.textContent||'').trim()))h.textContent='Why are people getting batteries?';
 });

 const grid=d.querySelector('.slide.grid-interactive,.slide.grid-live-retry,.slide.grid-v4,.slide.grid-slide')||[...d.querySelectorAll('.slide')].find(s=>{const h=s.querySelector('h1');return h&&/^The Grid$/i.test((h.textContent||'').trim())});
 const net=d.querySelector('.slide.net-simple')||[...d.querySelectorAll('.slide')].find(s=>/The Power of Net Metering/i.test(s.textContent||''));
 const moving=d.querySelector('.slide.move')||[...d.querySelectorAll('.slide')].find(s=>/Moving with Solar/i.test(s.textContent||''));
 const options=d.querySelector('.slide.options-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/The Options/i.test(s.textContent||''));
 const savings=d.querySelector('.slide.savings-upgrade')||[...d.querySelectorAll('.slide')].find(s=>/Be your own power company/i.test(s.textContent||''));
 if(!grid||!net||!moving||!options||!savings)return false;

 const label=grid.querySelector('.main-reasons-title,.grid-retry-reasons-title,.why-incentive-title');
 if(label)label.textContent='Main Reason: IID pays homeowners to have their own storage';

 const cards=[...net.querySelectorAll('.simple-card')];
 const buyCard=cards.find(card=>/buy|purchase|utility rate|power/i.test(card.textContent||''))||cards[0];
 const sellCard=net.querySelector('.simple-card.sell')||cards.find(card=>/export|sell/i.test(card.textContent||''))||cards[1];
 if(buyCard){
  const rate=buyCard.querySelector('.simple-rate');
  if(rate)rate.textContent='13.65¢';
  const copy=buyCard.querySelector('.simple-label,.simple-copy,.simple-title');
  if(copy&&/APS|SRP|IID|buy|purchase|utility/i.test(copy.textContent||''))copy.textContent='IID buying power';
  const note=buyCard.querySelector('.simple-note');
  if(note)note.remove();
 }
 if(sellCard){
  const rate=sellCard.querySelector('.simple-rate');
  if(rate)rate.textContent='6.98¢';
  const copy=sellCard.querySelector('.simple-label,.simple-copy,.simple-title');
  if(copy&&/APS|SRP|IID|export|sell/i.test(copy.textContent||''))copy.textContent='IID selling power';
 }

 const demandLine=net.querySelector('.demand-line');
 if(demandLine)demandLine.innerHTML='Use stored battery power during <span>IID’s 4–9 PM on-peak window</span> to avoid higher-cost grid energy.';

 const installer=d.querySelector('.slide.installer-links')||[...d.querySelectorAll('.slide')].find(s=>/Google Reviews/i.test(s.textContent||''));
 if(installer){
  const heading=installer.querySelector('.installer-head h1');
  if(heading)heading.innerHTML='Proven at Scale: <strong>1,000+</strong> installs a month';
  const googleLogo=[...installer.querySelectorAll('.credential-logo')].find(el=>/Google/i.test(el.textContent||''));
  if(googleLogo){
   const stars=googleLogo.querySelector('.stars');
   if(stars)stars.innerHTML='★★★★★ <b>4.4</b>';
   const reviews=googleLogo.querySelector('small');
   if(reviews)reviews.textContent='2,000+ Google Reviews';
  }
  const localTitle=installer.querySelector('.az-facts-title');
  if(localTitle)localTitle.textContent='Built locally. Built to handle everything in-house.';
 }

 patchSavingsCopy(savings);

 const rateInputs=savings.querySelector('.rate-inputs');
 let iidRateInput=savings.querySelector('#iidRateCents');
 if(rateInputs&&!iidRateInput){
  rateInputs.innerHTML='<label>IID rate per kWh (¢)<input id="iidRateCents" type="number" inputmode="decimal" min="0" step="0.01" placeholder="22.00"></label><label>Future-rate buffer<input type="text" value="15%" readonly aria-label="15 percent future-rate buffer"></label>';
  iidRateInput=savings.querySelector('#iidRateCents');
 }

 const utilitySubtitle=savings.querySelector('.monthly-card span');
 if(utilitySubtitle)utilitySubtitle.textContent='Includes a 15% future-rate buffer';

 const monthlyEl=savings.querySelector('.monthly-card strong');
 const futureCard=savings.querySelector('.future-card');
 const monthInputs=[...savings.querySelectorAll('.month-kwh')];
 const money=value=>Number.isFinite(value)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value):'$0';
 const recalcIID=()=>{
  const annual=monthInputs.reduce((sum,input)=>sum+(parseFloat(input.value)||0),0);
  const annualUsage=savings.querySelector('#annualUsage');
  if(annualUsage)annualUsage.textContent=Math.round(annual).toLocaleString()+' kWh';
  const rateCents=parseFloat(iidRateInput?.value)||0;
  const boxes=futureCard?[...futureCard.querySelectorAll('.future-box strong')]:[];
  const result=futureCard&&futureCard.querySelector('.rate-result');
  if(!(annual>0&&rateCents>0)){
   if(monthlyEl)monthlyEl.textContent='$0';
   boxes.forEach(box=>box.textContent='$0');
   if(result)result.textContent='Enter monthly usage and the IID rate per kWh.';
   return;
  }
  const bufferedMonthly=(annual/12)*(rateCents/100)*1.15;
  if(monthlyEl)monthlyEl.textContent=money(bufferedMonthly);
  boxes.forEach((box,index)=>{
   const years=[5,10,15,25][index]||0;
   box.textContent=money(bufferedMonthly*Math.pow(1.15,years/5));
  });
  if(result)result.textContent='IID rate: '+rateCents.toFixed(2)+'¢/kWh • Monthly estimate includes 15% future-rate buffer';
 };
 if(!savings.dataset.iidRateBound){
  [...monthInputs,iidRateInput].filter(Boolean).forEach(input=>input.addEventListener('input',recalcIID));
  savings.dataset.iidRateBound='true';
 }
 recalcIID();

 let style=d.getElementById('iidDeckStyles');
 if(!style){style=d.createElement('style');style.id='iidDeckStyles'}
 style.textContent=`
  .main-reasons,.grid-retry-reasons{grid-template-columns:minmax(170px,1.35fr) 1fr 1fr!important}
  .main-reasons-title,.grid-retry-reasons-title,.why-incentive-title{white-space:normal!important;line-height:1.12!important;text-align:left!important;font-size:clamp(11px,1.08vw,17px)!important;padding:.7em 1em!important}
  @media(max-width:600px){
   .main-reasons,.grid-retry-reasons{grid-template-columns:1.35fr 1fr 1fr!important}
   .main-reasons-title,.grid-retry-reasons-title,.why-incentive-title{font-size:6.2px!important;line-height:1.08!important;padding:.45em!important}
   .grid-interactive>.grid-address-tool,.grid-live-retry>.grid-address-tool,.grid-v4>.grid-address-tool,.grid-slide>.grid-address-tool{position:absolute!important;top:2.1%!important;right:2.5%!important;width:30.5%!important;margin:0!important;z-index:90!important}
   .move{padding:3% 4% 3% 13%!important;overflow:hidden!important}
   .move .logo{left:3%!important;top:7%!important;width:7%!important;border-width:2px!important;font-size:8px!important}
   .move .title{margin:0!important;padding:0!important;font-size:28px!important;line-height:.95!important;letter-spacing:-.035em!important}
   .move ul{position:absolute!important;left:13%!important;top:24%!important;width:47%!important;max-width:none!important;margin:0!important;padding-left:16px!important;display:grid!important;gap:9px!important;font-size:9.4px!important;line-height:1.18!important}
   .move li{margin:0!important;padding:0!important}
   .move .moving-photo{right:6%!important;top:38%!important;width:35%!important;height:34%!important}
   .options-upgrade{aspect-ratio:auto!important;height:480px!important;min-height:480px!important;padding:3% 3.5% 5%!important;overflow:hidden!important}
   .options-upgrade .options-grid{height:82%!important;margin-top:1.5%!important;gap:2%!important;align-items:stretch!important;overflow:visible!important}
   .options-upgrade .option{width:46%!important;min-height:100%!important;padding:2.5% 2.4% 3%!important;display:flex!important;flex-direction:column!important;position:relative!important;overflow:visible!important}
   .options-upgrade .option h2{font-size:21px!important;line-height:.94!important;margin:0 0 4%!important}
   .options-upgrade .option-list{display:grid!important;gap:5px!important}
   .options-upgrade .option-item{font-size:7.2px!important;line-height:1.14!important;gap:.4em!important}
   .options-upgrade .option-pain{margin-top:auto!important;margin-bottom:11%!important;padding:2.3%!important;font-size:6.8px!important;line-height:1.1!important;transform:translateY(4px)!important}
   .options-upgrade .choice-mascot{display:flex!important;left:-2%!important;right:auto!important;top:auto!important;bottom:-1%!important;transform:scale(.58)!important;transform-origin:left bottom!important;z-index:30!important}
   .options-upgrade .choice-mascot.dev{display:flex!important;left:auto!important;right:-2%!important;bottom:-1%!important;transform:scale(.58)!important;transform-origin:right bottom!important}
   .options-upgrade .choice-face{width:48px!important;height:48px!important;font-size:30px!important;border-width:2px!important}
   .options-upgrade .choice-bubble{font-size:11px!important;padding:.45em .65em!important;margin-bottom:13%!important}
  }
 `;
 d.head.appendChild(style);

 if(window.innerWidth<=600){
  const address=grid.querySelector('.grid-address-tool');
  if(address){
   if(address.parentElement!==grid)grid.appendChild(address);
   address.style.setProperty('position','absolute','important');
   address.style.setProperty('top','2.1%','important');
   address.style.setProperty('right','2.5%','important');
   address.style.setProperty('z-index','90','important');
  }
  const list=moving.querySelector('ul');
  if(list)list.innerHTML='<li>Home buyers prefer homes with lower expenses</li><li>Easily transferred to new homeowners</li><li>Solar can increase the value of your home</li><li>Solar homes sell faster than homes without solar</li>';
  options.style.setProperty('height','480px','important');
  options.style.setProperty('min-height','480px','important');
  options.style.setProperty('aspect-ratio','auto','important');
 }

 resizeAll(ctx);
 requestAnimationFrame(()=>requestAnimationFrame(()=>resizeAll(getDeck())));
 return true;
}

function waitForDeck(attempt=0){
 if(patchDeck()){
  setTimeout(()=>{patchDeck();resizeAll(getDeck())},850);
  return;
 }
 if(attempt<100)setTimeout(()=>waitForDeck(attempt+1),100);
}

base.addEventListener('load',()=>waitForDeck(),{once:true});
setTimeout(()=>waitForDeck(),120);
window.addEventListener('resize',()=>{
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{patchDeck();resizeAll(getDeck())},220);
},{passive:true});
</script>
</body>
</html>
