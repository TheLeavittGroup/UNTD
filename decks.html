<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sales Presentation Decks</title>

    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0, #7d5a19, transparent 32%), linear-gradient(135deg, #050506, #0b0b0d 60%, #000); color: #f7f4ec; font-family: Arial, Helvetica, sans-serif; padding: 24px; }
      main { max-width: 980px; margin: auto; padding: 42px 0; }
      p { color: #f5cf70; font-weight: 900; letter-spacing: .18em; }
      h1 { font-size: clamp(42px, 9vw, 88px); line-height: .9; margin: 0 0 22px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      a { display: block; color: #f7f4ec; text-decoration: none; font-size: 22px; font-weight: 900; background: #11100d; border: 1px solid rgba(245, 207, 112, .35); border-radius: 22px; padding: 24px; box-shadow: 0 18px 50px rgba(0, 0, 0, .35); transition: .2s; }
      a:hover { background: #f5cf70; color: #050506; transform: translateY(-3px); }
      small { display: block; color: #b9b6ad; margin-top: 6px; font-size: 13px; }
      a:hover small { color: #050506; }
      .back { margin-bottom: 18px; font-size: 18px; }
      @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 44px; } }
    </style>
  </head>

  <body>
    <main>
      <a class="back" href="./">Back to UNTD</a>
      <p>THE LEAVITT GROUP</p>
      <h1>Sales Presentations</h1>
      <div class="grid">
        <a id="daddyDeck" href="presentation/combined-v15/">
          D&#97;&#100;&#100;y&#39;s Sales Deck
          <small>Original presentation plus the complete closing tool</small>
        </a>
        <a href="https://untd.solar/joinus/wp-content/uploads/2024/03/Owe-Arizona-PP-.pdf">
          United Sales Deck
          <small>UNTD / OWE Arizona PDF deck</small>
        </a>
      </div>
    </main>
    <script>
      const deck=document.getElementById('daddyDeck');
      deck.addEventListener('click',event=>{
        event.preventDefault();
        location.href='presentation/combined-v15/?refresh='+Date.now();
      });
    </script>
  </body>
</html>
